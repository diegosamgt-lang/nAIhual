<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nAIhual</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* =====================================================================
   nAIhual 3.7 · sistema visual (tokens). Cambiar un token cambia toda la app.
   Concepto: Antigua en piedra, cal y basalto. Muros encalados (fondo), basalto volcánico (tinta),
   añil de fachada (acento de rutas y enlaces) y los cuatro colores de los guardianes por rumbo*.
   Layout: app de celular en una columna (máx. 560px). Cada pantalla abre con una imagen, un mapa o una ilustración.
   ===================================================================== */
:root {
  /* color · base */
  --cal: #f3f1ec; --papel: #ffffff; --piedra: #e7e3db; --piedra-2: #d8d2c6;
  --basalto: #1d2125; --ink-2: #474c52; --ink-3: #62676d;
  --line: rgba(29,33,37,.12); --line-2: rgba(29,33,37,.22);
  --anil: #2f4b7c; --anil-soft: #dfe5f0; --on-anil: #ffffff;
  --band: #1d2125; --band-ink: #f3f1ec; --band-muted: rgba(243,241,236,.66);
  --tint-cafe: #f1dfbd; --tint-comida: #efd3c6; --tint-cultura: #d9e1ee; --tint-noche: #dcd6ea; --tint-postres: #f3dde3; --tint-parque: #d7e6d3;
  --cielo-1: #f6d9b8; --cielo-2: #c9d4e3; --volcan: #6f7d8f; --volcan-2: #4f5b6b; --techo: #b4664b;
  /* color · estados */
  --heart: #b4462f; --ok: #2f6b4f; --ok-soft: #dcebe2;
  --check: #8a5a14; --check-soft: #f5ead2;        /* avisos y «Según la IA» */
  --sponsor-bg: #efe3c8; --sponsor-ink: #4d3a10;  /* Patrocinado */
  --future-bg: #e6e3f0; --future-ink: #3c3561;    /* diseño futuro / no activo */
  /* color · guardianes (color por rumbo*, pendiente de validación cultural) */
  --g-noj: #b3402f; --g-iq: #ffffff; --g-kej: #23262a; --g-e: #e2b33c;
  --g-noj-on: #ffffff; --g-iq-on: #1d2125; --g-kej-on: #ffffff; --g-e-on: #1d2125;
  --g-noj-soft: #f5e1dc; --g-iq-soft: #ffffff; --g-kej-soft: #e3e3e1; --g-e-soft: #f7ecce;
  /* tipografía: títulos con carácter, texto legible, datos y calles en monoespaciada */
  --f-display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --t-2xs: 11px; --t-xs: 12px; --t-sm: 13.5px; --t-base: 16px; --t-md: 17px; --t-lg: 21px; --t-xl: 28px; --t-2xl: 38px;
  --lh-tight: 1.08; --lh-snug: 1.25; --lh-body: 1.5;
  /* espacio (múltiplos de 4) y forma */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-7: 32px; --s-8: 44px;
  --r-sm: 10px; --r-md: 16px; --r-lg: 24px; --r-xl: 32px; --r-pill: 999px;
  --tap: 44px;
  --shadow-1: 0 1px 2px rgba(20,24,28,.06), 0 6px 18px rgba(20,24,28,.06);
  --shadow-2: 0 10px 30px rgba(20,24,28,.16);
  /* movimiento */
  --ease: cubic-bezier(.2,.7,.2,1); --dur-1: .18s; --dur-2: .35s; --dur-route: 1.4s;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --cal: #121518; --papel: #1b1f23; --piedra: #262b30; --piedra-2: #333940;
  --basalto: #eceae4; --ink-2: #c3c1ba; --ink-3: #9c9a93;
  --line: rgba(236,234,228,.13); --line-2: rgba(236,234,228,.24);
  --anil: #93acdb; --anil-soft: #222c3d; --on-anil: #121518;
  --band: #07090a; --band-ink: #eceae4; --band-muted: rgba(236,234,228,.6);
  --tint-cafe: #3a2f1c; --tint-comida: #3a2620; --tint-cultura: #1f2a3b; --tint-noche: #2a2538; --tint-postres: #3a2229; --tint-parque: #1f3121;
  --cielo-1: #2a2d3f; --cielo-2: #141a26; --volcan: #3a4352; --volcan-2: #2a313c; --techo: #6b3d2f;
  --heart: #ef8a70; --ok: #8fcaa9; --ok-soft: #1d2e26; --check: #e7bd6a; --check-soft: #33291a;
  --sponsor-bg: #3a2f17; --sponsor-ink: #f0d79c; --future-bg: #2a2740; --future-ink: #cfc8f3;
  --g-noj: #e07a68; --g-iq: #f3f2ef; --g-kej: #0b0c0d; --g-e: #e5b94a;
  --g-noj-on: #121518; --g-iq-on: #121518; --g-kej-on: #eceae4; --g-e-on: #121518;
  --g-noj-soft: #3a221d; --g-iq-soft: #2c2f33; --g-kej-soft: #0e1012; --g-e-soft: #362b13;
  --shadow-1: 0 1px 2px rgba(0,0,0,.5); --shadow-2: 0 10px 30px rgba(0,0,0,.5);
  color-scheme: dark;
} }
/* Mismo bloque para quien fuerce el modo oscuro con data-theme (así lo pide el visor de Claude). */
:root[data-theme="dark"] {
  --cal: #121518; --papel: #1b1f23; --piedra: #262b30; --piedra-2: #333940;
  --basalto: #eceae4; --ink-2: #c3c1ba; --ink-3: #9c9a93;
  --line: rgba(236,234,228,.13); --line-2: rgba(236,234,228,.24);
  --anil: #93acdb; --anil-soft: #222c3d; --on-anil: #121518;
  --band: #07090a; --band-ink: #eceae4; --band-muted: rgba(236,234,228,.6);
  --tint-cafe: #3a2f1c; --tint-comida: #3a2620; --tint-cultura: #1f2a3b; --tint-noche: #2a2538; --tint-postres: #3a2229; --tint-parque: #1f3121;
  --cielo-1: #2a2d3f; --cielo-2: #141a26; --volcan: #3a4352; --volcan-2: #2a313c; --techo: #6b3d2f;
  --heart: #ef8a70; --ok: #8fcaa9; --ok-soft: #1d2e26; --check: #e7bd6a; --check-soft: #33291a;
  --sponsor-bg: #3a2f17; --sponsor-ink: #f0d79c; --future-bg: #2a2740; --future-ink: #cfc8f3;
  --g-noj: #e07a68; --g-iq: #f3f2ef; --g-kej: #0b0c0d; --g-e: #e5b94a;
  --g-noj-on: #121518; --g-iq-on: #121518; --g-kej-on: #eceae4; --g-e-on: #121518;
  --g-noj-soft: #3a221d; --g-iq-soft: #2c2f33; --g-kej-soft: #0e1012; --g-e-soft: #362b13;
  --shadow-1: 0 1px 2px rgba(0,0,0,.5); --shadow-2: 0 10px 30px rgba(0,0,0,.5);
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--cal); color: var(--basalto); font-family: var(--f-body); font-size: var(--t-base); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 700; letter-spacing: -.02em; line-height: var(--lh-tight); text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
svg { display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--anil); outline-offset: 2px; border-radius: 6px; }
.eyebrow { font-family: var(--f-data); font-size: var(--t-2xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-3); }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.sm { width: 16px; height: 16px; }

/* ---------- estructura ---------- */
.app { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; background: color-mix(in srgb, var(--cal) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); padding-block: 10px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--cal); }
.wordmark { all: unset; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.03em; }
.wordmark i { font-style: normal; color: var(--anil); }
.top-actions { display: flex; align-items: center; gap: var(--s-2); }
.seg { display: flex; padding: 2px; border-radius: var(--r-pill); background: var(--piedra); }
.seg button { border: 0; cursor: pointer; min-width: 44px; min-height: 44px; padding: 0 10px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 700; background: transparent; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--papel); color: var(--basalto); box-shadow: var(--shadow-1); }
.sos { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: var(--r-pill); border: 1.5px solid var(--heart); color: var(--heart); background: transparent; font-weight: 700; font-size: 13px; cursor: pointer; }
main { flex: 1; display: flex; flex-direction: column; gap: var(--s-6); padding-block: var(--s-2) 120px; min-width: 0; }
main.chat { padding-bottom: 230px; gap: var(--s-4); }
@media (prefers-reduced-motion: no-preference) { main.enter > * { animation: rise var(--dur-2) var(--ease) both; } main.enter > *:nth-child(2) { animation-delay: .04s; } main.enter > *:nth-child(3) { animation-delay: .08s; } main.enter > *:nth-child(n+4) { animation-delay: .12s; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@media (prefers-reduced-motion: no-preference) { .msg.new { animation: rise var(--dur-2) var(--ease) both; } }

/* ---------- navegación inferior ---------- */
nav.tabs { position: fixed; z-index: 9; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: min(480px, calc(100% - 24px));
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0,1fr); gap: 2px; padding: 6px; border-radius: var(--r-xl); background: var(--band); box-shadow: var(--shadow-2); }
nav.tabs button { border: 0; cursor: pointer; min-height: 52px; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: transparent; color: var(--band-muted); font-size: 11.5px; font-weight: 700; }
nav.tabs button[aria-current="page"] { background: var(--band-ink); color: var(--band); }
nav.tabs button.plus { color: var(--band-ink); }
nav.tabs button.plus .ico { width: 30px; height: 30px; padding: 5px; border-radius: 50%; background: var(--anil); color: var(--on-anil); stroke-width: 2.6; }
nav.tabs .count { font-family: var(--f-data); font-size: 10px; }

/* ---------- botones y chips ---------- */
/* Acciones: rectángulo redondeado. Filtros y opciones (chips, etiquetas): píldora. Así se distinguen a simple vista. */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: var(--tap); padding: 0 18px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--papel); color: var(--basalto); font-weight: 700; font-size: 14.5px; text-decoration: none; cursor: pointer; }
.btn.primary { background: var(--basalto); color: var(--cal); border-color: transparent; }
.btn.anil { background: var(--anil); color: var(--on-anil); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.big { min-height: 58px; font-size: 17px; border-radius: var(--r-md); padding: 0 22px; }
.btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: var(--r-pill); border: 1px solid var(--line-2); background: var(--papel); color: var(--basalto); font-size: 14px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--basalto); color: var(--cal); border-color: transparent; }
.chip.pilot { background: var(--anil); color: var(--on-anil); border-color: transparent; }
.chip.switch { border-style: dashed; }
.chips { display: flex; gap: var(--s-2); overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.heart { position: absolute; top: 10px; right: 10px; z-index: 2; width: 44px; height: 44px; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer; background: color-mix(in srgb, var(--papel) 92%, transparent); box-shadow: var(--shadow-1); color: var(--heart); }
.heart[aria-pressed="true"] .ico { fill: var(--heart); }
.btn .ico.fill, .heart .ico { stroke: var(--heart); }

/* ---------- vida: los toques responden ---------- */
@media (prefers-reduced-motion: no-preference) {
  .btn, .chip, .tile, .route-card, .gbtn, .switch, .wtoggle, nav.tabs button { transition: transform var(--dur-1) var(--ease), background-color var(--dur-1) var(--ease); }
  .btn:active, .chip:active, .tile:active, .route-card:active, .gbtn:active, .switch:active, nav.tabs button:active { transform: scale(.96); }
}

/* ---------- widgets del Inicio (se contraen como en el teléfono) ---------- */
.widget { border-radius: var(--r-xl); background: var(--papel); border: 1px solid var(--line); overflow: hidden; }
.whead { display: flex; align-items: center; gap: var(--s-2); padding: 4px 8px 4px 4px; }
.wtoggle { all: unset; box-sizing: border-box; cursor: pointer; flex: 1; min-width: 0; min-height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: var(--r-lg); }
.wtoggle h2 { font-size: var(--t-md); flex: 1; min-width: 0; }
.wtoggle .ico { color: var(--wc, var(--anil)); }
.wtoggle .chev { transition: transform var(--dur-2) var(--ease); color: var(--ink-3); }
.widget.closed .wtoggle .chev { transform: rotate(-90deg); }
.wbody { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--dur-2) var(--ease); }
.widget.closed .wbody { grid-template-rows: 0fr; }
.winner { min-height: 0; overflow: hidden; }
.winner > .wpad { padding: 0 var(--s-4) var(--s-4); display: flex; flex-direction: column; gap: var(--s-3); }
.widget.closed .winner { visibility: hidden; transition: visibility 0s var(--dur-2); }
.widget .rail { margin: 0 -16px; padding: 2px 16px 6px; }
.widget .chips:not(.perfil-switches) { margin: 0; padding: 2px 0; }
.hello { font-family: var(--f-data); font-size: var(--t-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.9); text-shadow: 0 1px 8px rgba(0,0,0,.35); }
/* La idea del guía: su color, su voz, otra idea con un toque. */
.idea { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 12px; align-items: start; }
.idea .bubble { background: var(--gs); }
.idea .bubble b { display: block; font-family: var(--f-display); font-size: var(--t-md); margin: 2px 0; }
.idea .row { margin-top: 8px; }
/* Interruptor de perfil (como el de silencio del teléfono): encendido = añil. */
.switches { display: flex; flex-direction: column; gap: 6px; }
.switch { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 6px 8px 6px 14px; border-radius: var(--r-md); background: var(--cal); border: 1px solid var(--line); font-weight: 600; }
.switch i { flex: none; width: 50px; height: 30px; border-radius: 999px; background: var(--piedra-2); position: relative; transition: background-color var(--dur-2) var(--ease); }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--papel); box-shadow: var(--shadow-1); transition: transform var(--dur-2) var(--ease); }
.switch[aria-checked="true"] { background: var(--anil-soft); border-color: var(--anil); }
.switch[aria-checked="true"] i { background: var(--anil); }
.switch[aria-checked="true"] i::after { transform: translateX(20px); }
/* Publicar y el muro */
.temas { display: flex; flex-wrap: wrap; gap: 8px; }
.bform .temas label.chip { position: relative; flex-direction: row; align-items: center; gap: 0; color: var(--basalto); font-size: 14px; }
.temas input { position: absolute; opacity: 0; pointer-events: none; }
.bform .temas label.chip:has(input:checked) { background: var(--basalto); color: var(--cal); border-color: transparent; }
.temas label.chip:has(input:focus-visible) { outline: 3px solid var(--anil); outline-offset: 2px; }
.post { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: var(--r-lg); background: var(--papel); border: 1px solid var(--line); }
.post .who { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.post b.ttl { font-family: var(--f-display); font-size: var(--t-md); }

/* ---------- etiquetas, sello e información ---------- */
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: var(--r-pill); font-size: var(--t-2xs); font-weight: 700; letter-spacing: .02em; background: var(--piedra); color: var(--ink-2); white-space: nowrap; }
.tag.check { background: var(--check-soft); color: var(--check); border: 1px dashed currentColor; }
.tag.warn { background: var(--check-soft); color: var(--check); }
.seal.ref summary { color: var(--ink-2); }
.tag.sp { background: var(--sponsor-bg); color: var(--sponsor-ink); }
.tag.future { background: var(--future-bg); color: var(--future-ink); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
details.seal, details.info { font-size: var(--t-sm); }
details.seal summary, details.info summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; }
details.seal summary::-webkit-details-marker, details.info summary::-webkit-details-marker { display: none; }
details.seal summary { padding: 4px 12px; border-radius: var(--r-pill); font-weight: 700; font-size: 12.5px; }
details.seal.ok summary { background: var(--ok-soft); color: var(--ok); }
details.seal p, details.info p { margin-top: 6px; color: var(--ink-2); font-size: 13px; }
details.info summary { width: 44px; height: 44px; justify-content: center; border-radius: 50%; color: var(--ink-3); border: 1px solid var(--line-2); background: var(--papel); }
details.info[open] { flex-basis: 100%; }

/* ---------- imagen de lugar (foto o espacio provisional) ---------- */
.ph { position: relative; overflow: hidden; border-radius: var(--r-lg); background: var(--piedra); aspect-ratio: 4 / 3; max-width: 100%; }
.ph svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.ph .ph-note { position: absolute; left: 10px; bottom: 10px; font-family: var(--f-data); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: var(--r-pill); background: color-mix(in srgb, var(--papel) 85%, transparent); color: var(--ink-3); }

/* ---------- inicio ---------- */
.hero { position: relative; margin: 0 -16px; padding: 0 16px; display: flex; flex-direction: column; gap: var(--s-4); }
.hero-art { position: relative; border-radius: var(--r-xl); overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; background: var(--cielo-2); }
.hero-art svg { width: 100%; height: 100%; }
.hero-copy { position: absolute; left: 0; right: 0; bottom: 0; padding: var(--s-5); display: flex; flex-direction: column; gap: 6px; }
.hero-copy h1 { font-size: clamp(26px, 8vw, var(--t-2xl)); color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,.35); max-width: 15ch; }
.hero-copy p { color: rgba(255,255,255,.92); font-weight: 600; text-shadow: 0 1px 10px rgba(0,0,0,.4); }
.cta-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s-2); }
.sec { display: flex; flex-direction: column; gap: var(--s-3); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); }
.sec-head h2 { font-size: var(--t-lg); }
.linkish { all: unset; cursor: pointer; display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; font-size: var(--t-sm); font-weight: 700; color: var(--anil); }
.rail { display: flex; gap: var(--s-3); overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px 6px; }
.rail::-webkit-scrollbar { display: none; }
.route-card { all: unset; box-sizing: border-box; cursor: pointer; scroll-snap-align: start; flex: none; width: min(78vw, 300px); display: flex; flex-direction: column; border-radius: var(--r-lg); background: var(--papel); border: 1px solid var(--line); overflow: hidden; }
.route-card .map { aspect-ratio: 1 / .78; }
.route-card .rc-body { padding: var(--s-3) var(--s-4) var(--s-4); display: flex; flex-direction: column; gap: 4px; }
.route-card .tags, .rcard .tags { margin-top: 2px; }
.route-card .rc-title { font-family: var(--f-display); font-weight: 700; letter-spacing: -.02em; font-size: var(--t-md); line-height: 1.15; }
.perfil { display: flex; flex-direction: column; gap: var(--s-2); }
.perfil .chips { flex-wrap: wrap; margin: 0; padding: 0; overflow: visible; }
.tiles { display: flex; flex-direction: column; border-radius: var(--r-lg); background: var(--papel); border: 1px solid var(--line); overflow: hidden; }
.tile { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); min-height: 64px; padding: var(--s-3) var(--s-4); border-radius: var(--r-lg); background: var(--papel); border: 1px solid var(--line); }
.tiles .tile { border: 0; border-radius: 0; }
.tiles .tile + .tile { border-top: 1px solid var(--line); }
.tile > .ico { color: var(--ink-3); }
.tile b { font-family: var(--f-display); font-size: var(--t-md); letter-spacing: -.01em; line-height: 1.15; }
.tile small { display: block; color: var(--ink-3); font-size: 13px; margin-top: 2px; }
.guard-strip { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: var(--s-2); }
.gbtn { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: var(--s-3) 4px; border-radius: var(--r-md); text-align: center; }
.gbtn b { font-family: var(--f-display); font-size: 15px; }
.gbtn small { font-size: 11.5px; color: var(--ink-3); line-height: 1.25; }
.gbtn[aria-current="true"] { background: var(--papel); box-shadow: var(--shadow-1); }
.tag.like { background: var(--g-noj-soft); color: var(--basalto); }
.intro-in h3 { font-size: var(--t-lg); line-height: var(--lh-snug); }
.intro-card { display: flex; flex-direction: column; gap: 6px; padding: var(--s-5); border-radius: var(--r-xl); background: var(--band); color: var(--band-ink); }
.intro-card h2 { font-size: var(--t-lg); }
.intro-card p { color: var(--band-muted); font-size: 14.5px; }
.brujula { display: grid; gap: var(--s-3); }
.brujula .art { background: var(--papel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 8px; }
.brujula .art > svg { display: block; width: 100%; height: auto; max-width: 420px; margin: 0 auto; }
.brujula .note { font-size: 12.5px; }
.bru-row { display: flex; flex-wrap: wrap; gap: 8px; }
.bru-test { width: 100%; border-collapse: collapse; font-size: 13px; }
.bru-test th, .bru-test td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.beta-card { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: var(--r-md); border: 1.5px dashed var(--line-2); background: var(--papel); }
.beta-card .row { display: flex; flex-wrap: wrap; gap: 8px; }
.bform { display: flex; flex-direction: column; gap: 10px; }
.bform label { display: flex; flex-direction: column; gap: 4px; font-size: var(--t-sm); font-weight: 600; color: var(--ink-2); }
.bform input[type=text], .bform input[type=url], .bform select, .bform textarea { font: inherit; font-size: 16px; font-weight: 400; color: var(--basalto); background: var(--papel); border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 10px 12px; min-height: 44px; width: 100%; }
.bform textarea { min-height: 76px; resize: vertical; }
.bform .checkline { flex-direction: row; align-items: center; gap: 10px; min-height: 44px; }
.bform .checkline input { width: 22px; height: 22px; }
.bitem { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: var(--r-md); background: var(--papel); border: 1px solid var(--line); }
.fui-bar { position: fixed; left: 12px; right: 12px; bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 55; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: var(--r-lg); background: var(--papel); border: 1.5px solid var(--anil); box-shadow: var(--shadow-2); }
.fui-bar[hidden] { display: none; }
.fui-bar .row { display: flex; gap: 8px; flex-wrap: wrap; }
.score { display: flex; flex-direction: column; gap: 6px; }
.score .lbl { font-size: var(--t-sm); font-weight: 600; color: var(--ink-2); }
.score input[type=range] { width: 100%; height: 44px; accent-color: var(--anil); }
.score-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.score-row small { font-size: 11.5px; color: var(--ink-3); max-width: 38%; }
.score-row output { font-family: var(--f-display); font-weight: 700; font-size: 22px; }
.bphoto { width: 100%; max-height: 220px; object-fit: cover; border-radius: var(--r-md); }
.sr-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.dlg .bform h2 { font-size: var(--t-lg); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 60; display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; border-radius: var(--r-pill); background: var(--band); color: var(--band-ink); box-shadow: 0 8px 24px rgba(0,0,0,.18); font-weight: 600; font-size: 14.5px; max-width: calc(100vw - 32px); }
.toast[hidden] { display: none; }
.toast span { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.toast .btn { background: var(--band-ink); color: var(--band); border-color: transparent; }
.toast.bad { background: var(--check-soft); color: var(--check); }
.bitem small { color: var(--ink-3); font-family: var(--f-data); font-size: 11.5px; }
.btn.sm { padding: 0 12px; font-size: 13px; }
.btn.danger { background: var(--heart); color: var(--cal); border-color: transparent; }
.del-ask { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: var(--t-sm); font-weight: 600; }
.frase-de { color: var(--ink-3); font-size: .92em; white-space: nowrap; }
/* Con la pregunta «¿Fuiste?» abajo, el final de cada pantalla sube para que no quede tapado. */
body.has-fui main { padding-bottom: 240px; }
body.has-fui main.chat { padding-bottom: 360px; }
.foot { font-size: 11.5px; color: var(--ink-3); text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.foot .linkbtn { border: 0; background: none; padding: 12px 8px; min-height: 44px; cursor: pointer; text-decoration: underline; color: var(--ink-3); font-size: 12px; }

/* ---------- retrato abstracto de guardián (espacio para el arte final de Diego) ---------- */
.portrait { flex: none; display: block; border-radius: 50%; }
.portrait .ring { fill: var(--gc); stroke: var(--line-2); stroke-width: 1; }
.portrait .inner { fill: none; stroke: var(--go); stroke-opacity: .55; stroke-width: 1.5; }
.portrait .dot { fill: var(--go); }
.g-noj { --gc: var(--g-noj); --go: var(--g-noj-on); --gs: var(--g-noj-soft); }
.g-iq { --gc: var(--g-iq); --go: var(--g-iq-on); --gs: var(--g-iq-soft); }
.g-kej { --gc: var(--g-kej); --go: var(--g-kej-on); --gs: var(--g-kej-soft); }
.g-e { --gc: var(--g-e); --go: var(--g-e-on); --gs: var(--g-e-soft); }

/* ---------- mapa esquemático ---------- */
.map { position: relative; width: 100%; background: var(--piedra); }
.map svg { width: 100%; height: 100%; display: block; }
.map .block { fill: var(--papel); }
.map .park { fill: var(--ok-soft); stroke: var(--ok); stroke-opacity: .35; }
.map .lbl { font-family: var(--f-data); font-size: 9px; fill: var(--ink-3); letter-spacing: .04em; }
.map .park-lbl { fill: var(--ok); font-size: 8.5px; text-transform: uppercase; }
.map .north path { fill: var(--basalto); }
.map .route { fill: none; stroke: var(--anil); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.map .route.faint { stroke: var(--ink-3); stroke-opacity: .28; stroke-width: 2.5; }
.map .stop circle { fill: var(--basalto); stroke: var(--papel); stroke-width: 2; }
.map .stop text { font-family: var(--f-data); font-size: 10px; font-weight: 600; fill: var(--cal); text-anchor: middle; dominant-baseline: central; }
.map .stop.aprox circle { stroke-dasharray: 2 2; }
.map .pin circle { fill: var(--anil); stroke: var(--papel); stroke-width: 3; }
/* Referencias del paisaje: íconos al borde = está afuera del centro, hacia ese lado. */
.map .ref circle { fill: var(--papel); stroke: var(--ink-3); stroke-width: 1.2; }
.map .ref path { fill: none; stroke: var(--basalto); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.map .ref path.solid { fill: var(--ink-3); stroke: none; }
.map .ref .arrow { fill: var(--ink-3); stroke: none; }
/* Los nombres aparecen al tocar el ícono. */
.map [data-ref] { cursor: pointer; }
.map [data-ref] text { opacity: 0; transition: opacity var(--dur-1) var(--ease); }
.map [data-ref].open text { opacity: 1; }
.map [data-ref].open circle, .map .ruin.open rect { stroke: var(--anil); stroke-width: 2.5; }
.map [data-ref]:focus, .map [data-ref]:focus-visible { outline: none; }
.map [data-ref]:focus-visible circle, .map .ruin:focus-visible rect { stroke: var(--anil); stroke-width: 3; }
.map .ref text, .map .ruin text { font-family: var(--f-body); font-size: 8.5px; font-weight: 700; fill: var(--basalto); paint-order: stroke; stroke: var(--piedra); stroke-width: 3px; stroke-linejoin: round; }
.map .ruin rect { fill: var(--techo); }
.map .ruin path { fill: none; stroke: var(--papel); stroke-width: 1.3; }
.map .edge { fill: none; stroke: var(--line-2); stroke-width: 1; stroke-dasharray: 3 4; }
.map .note { position: absolute; left: 8px; bottom: 8px; font-family: var(--f-data); font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase; padding: 3px 7px; border-radius: var(--r-pill); background: color-mix(in srgb, var(--papel) 88%, transparent); color: var(--ink-3); }
@media (prefers-reduced-motion: no-preference) { .map .route.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--dur-route) var(--ease) forwards .15s; } }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* ---------- rutas ---------- */
.mapframe { border-radius: var(--r-xl); overflow: hidden; border: 1px solid var(--line); aspect-ratio: 1 / .95; max-width: 100%; }
.stops { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--s-2); }
.stops li button { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: var(--s-3); align-items: center; padding: 10px 12px; border-radius: var(--r-md); background: var(--papel); border: 1px solid var(--line); }
.stops .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--basalto); color: var(--cal); font-family: var(--f-data); font-weight: 600; font-size: 13px; }
.stops b { display: block; font-size: 15px; line-height: 1.25; }
.stops small { color: var(--ink-3); font-size: 12.5px; }

/* ---------- tarjetas de lugar ---------- */
.pcard { position: relative; display: flex; flex-direction: column; border-radius: var(--r-lg); background: var(--papel); border: 1px solid var(--line); overflow: hidden; }
.pcard .ph { border-radius: 0; aspect-ratio: 16 / 9; }
.pcard .pc-body { padding: var(--s-3) var(--s-4) var(--s-4); display: flex; flex-direction: column; gap: 6px; }
.pcard h3 { font-size: var(--t-md); line-height: var(--lh-snug); }
.pcard p { font-size: 14.5px; color: var(--ink-2); }
.pcard .addr { font-size: 13px; color: var(--ink-3); }
.pcard .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2); margin-top: 4px; }
.tipcard { position: relative; padding: var(--s-4) 56px var(--s-4) var(--s-4); border-radius: var(--r-lg); background: var(--piedra); display: flex; flex-direction: column; gap: 6px; }
.tipcard p { font-size: 15.5px; font-weight: 600; line-height: 1.38; }
.rcard { display: grid; grid-template-columns: 92px minmax(0,1fr); gap: var(--s-3); align-items: center; padding: 10px; border-radius: var(--r-lg); background: var(--papel); border: 1px solid var(--line); }
.rcard .map { width: 92px; height: 92px; border-radius: var(--r-md); overflow: hidden; }
.rcard b { font-family: var(--f-display); font-size: 16px; display: block; }
.rcard .btn { margin-top: 6px; min-height: 38px; font-size: 13.5px; padding: 0 14px; }

/* ---------- guía (chat) ---------- */
.guide-head { position: sticky; top: calc(58px + env(safe-area-inset-top, 0px)); z-index: 6; margin: 0 -16px; padding: 6px 16px 10px; background: color-mix(in srgb, var(--cal) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: var(--s-3); }
.guide-head .who { flex: 1; min-width: 0; }
.guide-head b { font-family: var(--f-display); font-size: 18px; display: block; }
.guide-head small { color: var(--ink-3); font-size: 12.5px; }
.minis { display: flex; gap: 4px; }
.minis button { all: unset; cursor: pointer; border-radius: 50%; padding: 8px; opacity: .5; }
.minis button[aria-current="true"] { opacity: 1; box-shadow: 0 0 0 2px var(--basalto); }
.msg { display: flex; flex-direction: column; gap: var(--s-2); min-width: 0; scroll-margin-top: 140px; }
.msg .by { display: flex; align-items: center; gap: var(--s-2); font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.bubble { align-self: flex-start; max-width: 100%; padding: 12px 16px; border-radius: 6px var(--r-lg) var(--r-lg) var(--r-lg); background: var(--gs); border: 1px solid var(--line); font-size: 15.5px; }
.bubble p + p { margin-top: 6px; }
.me { align-self: flex-end; max-width: 85%; padding: 10px 15px; border-radius: var(--r-lg) 6px var(--r-lg) var(--r-lg); background: var(--basalto); color: var(--cal); }
.cards { display: flex; flex-direction: column; gap: var(--s-3); }
.dock { position: fixed; z-index: 7; left: 0; right: 0; bottom: 0; background: linear-gradient(to top, var(--cal) 82%, transparent); padding-top: 16px; padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
.dock-in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
form.ask { display: flex; gap: var(--s-2); align-items: center; padding: 5px 5px 5px 16px; border-radius: var(--r-pill); background: var(--papel); border: 1px solid var(--line-2); box-shadow: var(--shadow-1); }
form.ask input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; min-height: 40px; }
form.ask button { flex: none; width: 44px; height: 44px; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer; background: var(--basalto); color: var(--cal); }
.thinking { display: inline-flex; gap: 4px; align-items: center; }
.thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
@media (prefers-reduced-motion: no-preference) { .thinking i { animation: blink 1s infinite; } .thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; } }
@keyframes blink { 50% { opacity: .25; } }
.empty { display: flex; flex-direction: column; gap: var(--s-3); align-items: flex-start; padding: var(--s-5); border-radius: var(--r-lg); background: var(--papel); border: 1px solid var(--line); }
.empty .art { width: 100%; max-width: 100%; border-radius: var(--r-md); overflow: hidden; aspect-ratio: 16 / 7; }
.empty b { font-family: var(--f-display); font-size: var(--t-md); }
.empty p { color: var(--ink-2); font-size: 14.5px; }

/* ---------- páginas ---------- */
.pagehead { display: flex; flex-direction: column; gap: 6px; }
.pagehead h1 { font-size: var(--t-xl); }
.pagehead p { color: var(--ink-2); }
.back { align-self: flex-start; }
.search { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 16px; border-radius: var(--r-pill); background: var(--papel); border: 1px solid var(--line-2); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; }
.grid { column-count: 2; column-gap: var(--s-3); }
.grid > * { break-inside: avoid; margin-bottom: var(--s-3); display: block; }
.pin { all: unset; box-sizing: border-box; cursor: pointer; display: block; width: 100%; position: relative; }
.pin .ph { border-radius: var(--r-md); }
.pin .cap { padding: 8px 2px 0; display: flex; flex-direction: column; gap: 3px; }
.pin .cap b { font-size: 14.5px; line-height: 1.25; }
.pin .cap small { font-size: 12.5px; color: var(--ink-3); line-height: 1.35; }
.pin.tip { padding: var(--s-4); border-radius: var(--r-md); background: var(--piedra); }
.pin.tip p { font-weight: 600; font-size: 14.5px; line-height: 1.38; }
.d-hero { margin: 0 -16px; }
.d-hero .ph { border-radius: 0; aspect-ratio: 4 / 3; }
.d-body { display: flex; flex-direction: column; gap: var(--s-3); }
.d-body h1 { font-size: var(--t-xl); }
.d-body .lead { font-size: var(--t-md); color: var(--ink-2); }
.d-body .addr { font-size: var(--t-sm); color: var(--ink-3); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.actions .btn.primary, .actions .btn.anil { flex: 1; }
.minimap { border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--line); aspect-ratio: 16 / 9; max-width: 100%; }
.asklist { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.facts { margin: 0; display: grid; gap: var(--s-2); }
.facts div { padding: 12px 16px; border-radius: var(--r-md); background: var(--papel); border: 1px solid var(--line); }
.facts dt { font-family: var(--f-data); font-size: var(--t-2xs); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.facts dd { margin: 3px 0 0; }
.note { font-size: 13px; color: var(--ink-3); }
.artbox { margin: 0; display: flex; flex-direction: column; gap: 10px; padding: var(--s-4); border-radius: var(--r-xl); background: var(--papel); border: 1px solid var(--line); }
.artbox > svg { width: 100%; height: auto; max-height: 300px; }
.artbox figcaption { display: block; font-size: 13.5px; color: var(--ink-2); }
.artbox figcaption details.info { display: inline-block; vertical-align: middle; margin-left: 4px; }
.artbox figcaption b { font-family: var(--f-data); font-size: 15px; color: var(--basalto); }
.nawal-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--s-2); }
.nawal { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--r-md); background: var(--papel); border: 1px solid var(--line); }
.nawal .n { font-family: var(--f-data); font-weight: 600; font-size: 13px; color: var(--ink-3); }
.nawal b { display: block; font-family: var(--f-display); font-size: 16px; }
.nawal small { color: var(--ink-3); font-size: 12px; }
.nawal.guard { border-color: var(--line-2); background: var(--gs); }
.gfull { display: grid; grid-template-columns: 76px minmax(0,1fr); gap: var(--s-4); padding: var(--s-4); border-radius: var(--r-lg); background: var(--gs); border: 1px solid var(--line); }
.gfull h2 { font-size: var(--t-lg); }
.gfull dl { margin: 6px 0 0; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 3px 10px; font-size: var(--t-sm); }
.gfull dt { color: var(--ink-3); }
.gfull dd { margin: 0; }
dialog { border: 0; padding: 0; border-radius: var(--r-xl); width: min(480px, calc(100% - 32px)); max-height: 85vh; background: var(--cal); color: var(--basalto); box-shadow: var(--shadow-2); }
dialog::backdrop { background: rgba(0,0,0,.45); }
.dlg { padding: var(--s-5); display: flex; flex-direction: column; gap: var(--s-3); }
.dlg h2 { font-size: var(--t-lg); }

/* ---------- documentos largos (vista interna) ---------- */
.doc { display: flex; flex-direction: column; gap: var(--s-5); }
.doc section { display: flex; flex-direction: column; gap: 10px; }
.doc h2 { font-size: 20px; }
.doc h3 { font-size: 16px; }
.doc p, .doc li { color: var(--ink-2); font-size: 14.5px; }
.doc ul, .doc ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.doc strong { color: var(--basalto); }
.status { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: var(--r-md); background: var(--sponsor-bg); color: var(--sponsor-ink); font-size: var(--t-sm); }
.status b { font-size: 14.5px; }
.status.future { background: var(--future-bg); color: var(--future-ink); }
.status.plain { background: var(--piedra); color: var(--basalto); }

    '<section><h3>Retratos de los guardianes</h3><div class="row">' + ORDER.map(function (g) { return portrait(g, 56); }).join('') + '</div><p class="note">El punto apunta a su rumbo*: No\'j al oriente, Iq\' al norte, Kej al poniente, E\' al sur. Es un espacio para tu arte.</p></section>' +
    '<section><h3>Tarjeta de lugar (ejemplo ficticio)</h3><div class="pcard" data-demo="tarjeta"><div class="ph" style="aspect-ratio:16/9">' + photoArt('cafe', 'iq') + '<span class="ph-note">Foto pendiente</span></div><div class="pc-body"><div class="tags"><span class="tag">Café</span></div><h3>Nombre de ejemplo</h3><p>Frase de ejemplo.</p><span class="addr">Dirección de ejemplo</span><div class="row"><span class="btn primary" aria-disabled="true">' + icon('pin', 'sm') + 'Cómo llegar</span><span class="tag ok">' + icon('check', 'sm') + 'Verificado · [fecha]</span></div></div></div></section>' +
    '<section><h3>Mapa esquemático</h3><div class="minimap map">' + mapSVG({ labels: true, lang: 'es', label: 'Cuadrícula de Antigua' }) + '<span class="note">Esquema · no a escala</span></div></section>';
}
function tallerHTML() {
  var cur = SECS.filter(function (s) { return s[0] === S.sec; })[0] || SECS[0], sec = cur[0], body = cur[2]();
  return '<div class="inbanner" role="note"><span>Vista interna del equipo · no la ve el visitante</span><button type="button" class="btn" data-go="inicio">Volver a la app</button></div>' +
    '<div class="chips" role="group" aria-label="Secciones internas">' + SECS.map(function (s) { return '<button type="button" class="chip" data-sec="' + s[0] + '" aria-pressed="' + (s[0] === sec) + '">' + esc(s[1]) + '</button>'; }).join('') + '</div>' +
    '<article class="doc" id="taller-' + sec + '">' + body + '</article>' +
    (S.lang === 'en' ? '<p class="note">The team view is only available in Spanish for now.</p>' : '');
}

// ===================== DIBUJAR Y NAVEGAR =====================
// En la beta, «+ Publicar» va al centro de la barra, como en una red social.
var TABS = [['inicio', 'home'], ['rutas', 'map']].concat(BETA_ON ? [['publicar', 'plus']] : [], [['guia', 'chat'], ['guardados', 'heart']]);
var VIEWS = { inicio: inicioHTML, rutas: rutasHTML, guia: guiaHTML, guardados: guardadosHTML, explorar: explorarHTML, cultura: culturaHTML, costumbres: costumbresHTML, nawales: nawalesHTML, nawal: nawalHTML, guardianes: guardianesHTML, ficha: fichaHTML, beta: betaHTML, taller: tallerHTML };
var TAB_OF = { inicio: 'inicio', explorar: 'inicio', cultura: 'inicio', costumbres: 'inicio', nawales: 'inicio', nawal: 'inicio', guardianes: 'inicio', beta: 'inicio', taller: 'inicio', rutas: 'rutas', guia: 'guia', guardados: 'guardados', ficha: null };
var main = document.getElementById('main');
document.addEventListener('visibilitychange', function () { if (!document.hidden) fuiBar(); });
function render(opts) {
  // opts: { keep } redibuja sin animar · { scroll } baja al último mensaje · {} entra con animación.
  opts = opts || { keep: true };
  var t = T(), v = S.view;
  document.documentElement.lang = S.lang;
  ['es', 'en'].forEach(function (l) { document.getElementById('lang-' + l).setAttribute('aria-pressed', String(S.lang === l)); });
  var sos = document.getElementById('sos'); sos.hidden = !PREVIEW; sos.innerHTML = icon('alert', 'sm') + esc(t.sos);
  var onGuia = v === 'guia';
  document.getElementById('dock').hidden = !onGuia;
  main.className = (onGuia ? 'chat' : '') + (opts.keep || opts.scroll ? '' : ' enter');
  var tab = TAB_OF[v] === undefined ? null : TAB_OF[v];
  if (v === 'ficha') tab = TAB_OF[S.stack.length ? S.stack[S.stack.length - 1].view : 'inicio'] || 'inicio';
  var n = savedShown().length;
  document.getElementById('tabs').innerHTML = TABS.map(function (d) {
    if (d[0] === 'publicar') return '<button type="button" class="plus" data-publish>' + icon('plus') + '<span>' + esc(X().publish) + '</span></button>';
    return '<button type="button" data-tab="' + d[0] + '"' + (tab === d[0] ? ' aria-current="page"' : '') + '>' + icon(d[1]) + '<span>' + esc(t.tabs[d[0]]) + (d[0] === 'guardados' && n ? ' <span class="count">' + n + '</span>' : '') + '</span></button>';
  }).join('');
  document.getElementById('q').placeholder = t.placeholder;
  document.getElementById('q').setAttribute('aria-label', t.placeholder);
  var send = document.getElementById('send'); send.setAttribute('aria-label', t.send); send.innerHTML = icon('up');
  document.getElementById('chips').innerHTML = t.chips.map(function (c, i) {
    return (i === 1 ? '<button type="button" class="chip switch" data-next>' + icon('shuffle', 'sm') + esc(t.switchChip) + '</button>' : '') + '<button type="button" class="chip' + (c[0] === 'cafe' ? ' pilot' : '') + '" data-chip="' + c[0] + '">' + esc(c[1]) + '</button>';
  }).join('');
  var hadFocus = document.activeElement && document.activeElement.id === 'fq', caret = hadFocus ? document.activeElement.selectionStart : 0;
  main.innerHTML = (VIEWS[v] || inicioHTML)(opts.scroll);
  if (onGuia && opts.scroll) { var msgs = main.querySelectorAll('.msg'); var target = msgs[Math.max(0, msgs.length - 2)]; if (target) target.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
  fuiBar();
  if (hadFocus) { var fi = document.getElementById('fq'); if (fi) { fi.focus(); try { fi.setSelectionRange(caret, caret); } catch (e) {} } }
}
function nav(view, o) {
  o = o || {};
  if (view === 'taller' && !PREVIEW) view = 'inicio';
  if (view === 'beta' && !BETA_ON) view = 'inicio';
  if (!o.tab && view !== S.view) S.stack.push({ view: S.view, detail: S.detail, nawal: S.nawal, route: S.route });
  if (o.tab) S.stack = [];
  S.view = view;
  if (o.silent) return;
  render({}); window.scrollTo(0, view === 'guia' ? document.body.scrollHeight : 0);
}
function back() {
  var prev = S.stack.pop() || { view: 'inicio' };
  S.view = prev.view; S.detail = prev.detail; S.nawal = prev.nawal; S.route = prev.route;
  render({}); window.scrollTo(0, 0);
}
function openKey(key) {
  var k = key.split(':')[0], id = key.split(':')[1];
  if (k === 'p' && P[id] && (visible(P[id]))) { nav('ficha', { silent: true }); S.detail = id; render({}); window.scrollTo(0, 0); }
  if (k === 'r' && ROUTES[id]) { S.route = id; nav('rutas'); }
}

document.getElementById('ask').addEventListener('submit', function (e) { e.preventDefault(); var i = document.getElementById('q'); ask(i.value); i.value = ''; });
// «Vamos»: en la beta queda pendiente la pregunta «¿Fuiste?».
function goingTo(pid, nombre) { if (!BETA_ON) return; fuiSet({ lugar: pid || null, nombre: nombre }); setTimeout(fuiBar, 400); }
// Cada atributo data-* que se puede tocar y lo que hace. Si un elemento tiene varios, gana el primero de la lista.
var ACTIONS = [
  ['data-vamos', function (v) { goingTo(v, P[v] ? P[v].name : v); }],
  ['data-vamos-name', function (v) { goingTo(null, v); }],
  ['data-fui-yes', function () { if (FUI) openVisit(FUI.lugar, FUI.nombre); }],
  ['data-fui-no', function () { fuiSet(null); fuiBar(); }],
  ['data-visit', function (v) { openVisit(v, P[v] ? P[v].name : v); }],
  ['data-del-ask', function (v) { BETA.delAsk = v; render({ keep: true }); }],
  ['data-del-yes', function (v) { betaDelete(v); }],
  ['data-del-no', function () { BETA.delAsk = ''; render({ keep: true }); }],
  ['data-bru-land', function (v) { bruSee(v); }],
  ['data-bru-north', function () { BRU.offset = null; if (BRU.sensor === 'on') bruStop(); BRU.heading = 0; render({ keep: true }); }],
  ['data-bru-sensor', function () { if (BRU.sensor === 'on' || BRU.sensor === 'esperando') { bruStop(); render({ keep: true }); } else bruStart(); }],
  ['data-bru-test-at', function (v) { bruTestAt(v); }],
  ['data-bru-fb', function (v) { BRU.fb = v; BRU.testOpen = true; render({ keep: true }); }],
  ['data-bru-save', function () { bruSave(); }],
  ['data-learn-ok', function (v) { learnSet(v, 'confirmado'); }],
  ['data-beta-like', function (v) { betaToggleLike(v); }],
  ['data-toggle', function (v, e) { e.preventDefault(); e.stopPropagation(); toggle(v); }],
  ['data-open', function (v) { openKey(v); }],
  ['data-route', function (v) { openKey('r:' + v); }],
  ['data-selroute', function (v) { S.route = v; render({}); }],
  ['data-filter', function (v) { S.filter = v; render({ keep: true }); }],
  ['data-tab', function (v) { nav(v, { tab: true }); }],
  ['data-go', function (v) { nav(v); }],
  ['data-back', function () { back(); }],
  ['data-lang', function (v) { S.lang = v; persist(); render({ keep: true }); }],
  ['data-ask', function (v) { askIntent(v); }],
  ['data-chip', function (v) { askIntent(v); }],
  ['data-say', function (v) { ask(v); }],
  ['data-stop', function () { if (AI.ctl) AI.ctl.abort(); }],
  ['data-next', function () { switchTo(ORDER[(ORDER.indexOf(S.guide) + 1) % ORDER.length]); render({ scroll: true }); }],
  ['data-g', function (v) { if (v !== S.guide) { switchTo(v); render({ scroll: true }); } }],
  ['data-guide', function (v) { if (v !== S.guide) switchTo(v); nav('guia', { tab: true }); }],
  ['data-nawal', function (v) { S.nawal = v; nav('nawal'); }],
  ['data-sec', function (v) { S.sec = v; render({ keep: true }); window.scrollTo(0, 0); }],
  ['data-demo-fb', function (v) { S.demoFb = v; render({ keep: true }); }],
  ['data-perfil', function (v) { var i = S.perfiles.indexOf(v); if (i >= 0) S.perfiles.splice(i, 1); else { S.perfiles.push(v); if (S.perfiles.length > 2) S.perfiles.shift(); } tick(); persist(); render({ keep: true }); }],
  ['data-wtoggle', function (v, e, el) { CLOSED[v] = !CLOSED[v]; saveClosed(); tick(); var wd = el.closest('.widget'); wd.classList.toggle('closed', !!CLOSED[v]); el.setAttribute('aria-expanded', String(!CLOSED[v])); }],
  ['data-idea', function () { S.ideaN++; tick(); var b = document.getElementById('idea-body'); if (b) b.innerHTML = ideaHTML(); }],
  ['data-publish', function () { tick(); openDialog(postForm()); }],
  ['data-post-ok', function (v) { postUpdate(v, { estado: 'confirmado' }); tick(); }],
  ['data-ref', function (v) { S.refOpen = S.refOpen === v ? '' : v; [].forEach.call(document.querySelectorAll('.map [data-ref]'), function (g) { g.classList.toggle('open', g.getAttribute('data-ref') === S.refOpen); }); }],
  ['data-sos', function () { var t = T(); openDialog('<h2>' + esc(t.sosTitle) + '</h2><p>' + esc(t.sosBody) + '</p><button type="button" class="btn primary" data-close>' + esc(t.close) + '</button>'); }],
  ['data-close', function () { document.getElementById('dlg').close(); }]
];
var ACTION_SEL = ACTIONS.map(function (x) { return '[' + x[0] + ']'; }).join(',');
document.addEventListener('click', function (e) {
  var el = e.target.closest(ACTION_SEL); if (!el) return;
  for (var i = 0; i < ACTIONS.length; i++) if (el.hasAttribute(ACTIONS[i][0])) { ACTIONS[i][1](el.getAttribute(ACTIONS[i][0]), e, el); return; }
});
// Los íconos del mapa también se abren con el teclado.
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var el = e.target.closest && e.target.closest('.map [data-ref]'); if (!el) return;
  e.preventDefault(); el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
});
document.addEventListener('submit', function (e) { var f = e.target.closest && e.target.closest('[data-bform]'); if (!f) return; e.preventDefault(); betaSubmit(f); });
document.addEventListener('toggle', function (e) { if (e.target && e.target.matches && e.target.matches('[data-bru-test]')) BRU.testOpen = e.target.open; if (e.target && e.target.matches && e.target.matches('[data-beta-new]')) BETA.newOpen = e.target.open; }, true);
document.addEventListener('focusout', function () { setTimeout(function () { if (BETA.dirty && !betaTyping()) { BETA.dirty = false; render({ keep: true }); } }, 0); });
document.addEventListener('input', function (e) {
  if (e.target.name === 'puntaje') { var sc = e.target, w = sc.closest('[data-score]'); sc.setAttribute('data-touched', '1'); w.querySelector('[data-score-out]').textContent = sc.value; w.querySelector('[data-score-warn]').hidden = sc.value !== '10'; return; }
  if (e.target.id === 'bq') { BETA.q = e.target.value; var out = document.getElementById('bq-out'); if (out) out.innerHTML = bqRows(BETA.q); return; }
  if (e.target.id === 'fq') { S.query = e.target.value; render({ keep: true }); }
});

// Abrir una pantalla directa con un enlace: #rutas, #guia, #guardados, #explorar, #cultura, #costumbres, #nawales, #guardianes
// y, en vista previa, #beta, #taller o una sección interna (#revision, #textos, #modelo, #aprendizaje, #arquitectura, #sistema).
(function () {
  var h = String(location.hash || '').slice(1);
  if (Object.prototype.hasOwnProperty.call(VIEWS, h) && h !== 'ficha' && h !== 'nawal' && !(h === 'taller' && !PREVIEW) && !(h === 'beta' && !BETA_ON)) S.view = h;
  else if (PREVIEW && SECS.some(function (s) { return s[0] === h; })) { S.view = 'taller'; S.sec = h; }
  if (S.view !== 'inicio') S.stack = [{ view: 'inicio' }];
})();
S.msgs.push({ from: ORDER[0], kind: 'welcome' });
render({});
})();
</script>
