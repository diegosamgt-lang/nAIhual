<title>Curtis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=Instrument+Sans:wght@400..700&family=Fira+Sans+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: inspiración revista de naturaleza. Papel cálido, tinta de bosque, el marco amarillo como único acento fuerte. Inicio: resumen enmarcado en amarillo sobre curvas de nivel que se mueven despacio; después tiempo (calendario + fechas límite), hoy y proyectos. Compu: barra lateral; celular: barra abajo. */
:root {
  --bg: #f6f4ee; --surface: #ffffff; --surface-2: #eeebe2; --ink: #1a1f1b; --muted: #676b62; --line: rgba(26,31,27,.10);
  --yellow: #ffc72c; --forest: #2f5d46; --moss: #7d9150; --clay: #b4512f; --earth: #c08a3e; --lake: #3b7690; --sand: #e4d8bf;
  --forest-t: #2b553f; --moss-t: #56662f; --clay-t: #9a3f22; --earth-t: #85591a; --lake-t: #2c5f75; --yellow-t: #7a5a00;
  --shadow: 0 1px 2px rgba(26,31,27,.05), 0 10px 28px rgba(26,31,27,.06);
  --f-ui: "Instrument Sans", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-head: "Newsreader", Georgia, "Times New Roman", serif;
  --f-mark: "Fira Sans Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --r: 16px; --r-sm: 10px; --side: 252px;
  --c-in: #1f78b4; --c-out: #d0731f; --rule: rgba(26,31,27,.85);
  --rose: #c2577a; --plum: #7a5aa0; --teal: #2a8a84; --sky: #3f8fd0; --olive: #8c8a2e; --coral: #e07a5f;
  --rose-t: #9c3a5d; --plum-t: #5d4282; --teal-t: #1f6a65; --sky-t: #2a6aa0; --olive-t: #5f5d18; --coral-t: #a8482f;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121512; --surface: #1b1f1b; --surface-2: #252a25; --ink: #eef0ea; --muted: #9ea397; --line: rgba(255,255,255,.09);
  --yellow: #ffcf47; --forest: #5e9a78; --moss: #a3b86f; --clay: #e0805f; --earth: #dcab5f; --lake: #6fb0cc; --sand: #4a4434;
  --forest-t: #86c3a0; --moss-t: #b9cc85; --clay-t: #ef9c80; --earth-t: #e8bf7c; --lake-t: #8fc6dd; --yellow-t: #ffd866;
  --shadow: 0 1px 2px rgba(0,0,0,.35); color-scheme: dark; --c-in: #3d9be0; --c-out: #d27a2c; --rule: rgba(238,240,234,.75); --rose: #e88aa7; --plum: #b49ad6; --teal: #5fc0b8; --sky: #7ab8ea; --olive: #c2c05a; --coral: #f0a089; --rose-t: #f0a9bf; --plum-t: #c8b3e6; --teal-t: #8ad6cf; --sky-t: #a3cff2; --olive-t: #d6d48a; --coral-t: #f5bba9; } }
:root[data-theme="dark"] {
  --bg: #121512; --surface: #1b1f1b; --surface-2: #252a25; --ink: #eef0ea; --muted: #9ea397; --line: rgba(255,255,255,.09);
  --yellow: #ffcf47; --forest: #5e9a78; --moss: #a3b86f; --clay: #e0805f; --earth: #dcab5f; --lake: #6fb0cc; --sand: #4a4434;
  --forest-t: #86c3a0; --moss-t: #b9cc85; --clay-t: #ef9c80; --earth-t: #e8bf7c; --lake-t: #8fc6dd; --yellow-t: #ffd866;
  --shadow: 0 1px 2px rgba(0,0,0,.35); color-scheme: dark; --c-in: #3d9be0; --c-out: #d27a2c; --rule: rgba(238,240,234,.75); --rose: #e88aa7; --plum: #b49ad6; --teal: #5fc0b8; --sky: #7ab8ea; --olive: #c2c05a; --coral: #f0a089; --rose-t: #f0a9bf; --plum-t: #c8b3e6; --teal-t: #8ad6cf; --sky-t: #a3cff2; --olive-t: #d6d48a; --coral-t: #f5bba9; }

body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 15px; height: 15px; } .ic.lg { width: 22px; height: 22px; }
h1, h2, h3 { font-family: var(--f-head); font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }

/* estructura */
.app { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100%; }
.side { display: none; }
.main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px calc(100px + env(safe-area-inset-bottom, 0px)); min-width: 0; }
.main-in { max-width: 64rem; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
@media (min-width: 920px) {
  .app { grid-template-columns: var(--side) minmax(0, 1fr); }
  .side { display: flex; flex-direction: column; gap: 3px; position: sticky; top: 0; height: 100vh; overflow: auto; padding: 22px 14px 18px max(14px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); box-sizing: border-box; }
  .main { padding: 28px 34px 48px; }
  .tabbar { display: none !important; }
}
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 10px 16px; }
.brand-mark { width: 26px; height: 34px; border: 4px solid var(--yellow); box-sizing: border-box; flex: none; }
.brand b { font-family: var(--f-head); font-style: italic; font-weight: 600; font-size: 1.7rem; letter-spacing: -.01em; }
.nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; border-radius: 9px; padding: 8px 10px; text-align: left; color: var(--muted); font-weight: 550; }
.nav-btn:hover { background: var(--surface-2); color: var(--ink); }
.nav-btn[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.nav-btn .count { margin-left: auto; font-size: .78rem; font-variant-numeric: tabular-nums; }
.nav-h { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 16px 10px 4px; display: flex; justify-content: space-between; align-items: center; }
.nav-h button { border: 0; background: none; color: var(--muted); padding: 2px; border-radius: 6px; display: grid; }
.nav-emoji { width: 22px; text-align: center; }
.side-foot { margin-top: auto; padding-top: 12px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: space-around; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
.tab-btn { border: 0; background: none; display: grid; justify-items: center; gap: 2px; font-size: .62rem; font-weight: 600; color: var(--muted); padding: 4px 1px; min-width: 44px; flex: 1 1 0; }
.tab-btn[aria-current="page"] { color: var(--ink); }
.tab-btn[aria-current="page"] .ic { stroke: var(--forest); }
.fab { position: fixed; right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px)); bottom: calc(78px + env(safe-area-inset-bottom, 0px)); z-index: 31; width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--forest); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
@media (min-width: 920px) { .fab { bottom: calc(28px + env(safe-area-inset-bottom, 0px)); } }

/* piezas */
.btn { border: 0; background: var(--ink); color: var(--surface); border-radius: 999px; padding: 9px 16px; font-weight: 650; white-space: nowrap; font-size: .9rem; display: inline-flex; align-items: center; gap: 7px; }
.btn.forest { background: var(--forest); color: #fff; }
.btn.soft { background: var(--surface-2); color: var(--ink); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn.ok { background: color-mix(in srgb, var(--forest) 16%, var(--surface)); color: var(--forest-t); }
.btn.warn { background: color-mix(in srgb, var(--clay) 15%, var(--surface)); color: var(--clay-t); }
.btn.yellow { background: var(--yellow); color: #1a1f1b; }
.btn.small { padding: 6px 12px; font-size: .82rem; }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { border: 0; background: none; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--muted); flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 0; background: var(--surface-2); border-radius: 999px; padding: 5px 11px; font-size: .82rem; font-weight: 550; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg { display: inline-flex; justify-self: start; max-width: 100%; overflow-x: auto; gap: 2px; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 13px; font-weight: 600; font-size: .85rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.page-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.page-h h1 { margin: 0; font-size: clamp(1.8rem, 4.5vw, 2.4rem); }
.kicker { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
.kicker::before { content: ""; width: 10px; height: 10px; border: 2.5px solid var(--yellow); box-sizing: border-box; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 2px 10px; }
.sec-h h2 { margin: 0; font-size: 1.35rem; display: flex; align-items: center; gap: 8px; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.pad { padding: 16px 18px; }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: .84rem; margin: 0; }
.err { color: var(--clay-t); font-weight: 600; margin: 0; font-size: .9rem; }
.empty { color: var(--muted); padding: 14px 18px; margin: 0; font-size: .92rem; }
.scroll-x { overflow-x: auto; }
.two { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 21rem), 1fr)); align-items: start; }

/* estado */
.st { flex: none; width: 19px; height: 19px; box-sizing: border-box; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--muted) 75%, transparent); position: relative; display: inline-block; }
.st.mini { width: 13px; height: 13px; border-width: 1.75px; }
.st.en-proceso { border-color: var(--earth); background: linear-gradient(90deg, var(--earth) 50%, transparent 50%); }
.st.esperando { border-radius: 4px; border-color: var(--lake); background: var(--lake); }
.st.listo { border-color: var(--forest); background: var(--forest); }
.st.listo::after { content: ""; position: absolute; left: 32%; top: 14%; width: 25%; height: 46%; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.st.mini.listo::after { border-width: 0 1.5px 1.5px 0; }
.st-btn { border: 0; background: none; padding: 5px; margin: -5px; border-radius: 50%; display: grid; place-items: center; }
.st-btn:hover .st:not(.listo) { border-color: var(--forest); }

/* urgencia */
.u { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px 2px 7px; font-size: .76rem; font-weight: 650; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.u.late { background: color-mix(in srgb, var(--clay) 15%, var(--surface)); color: var(--clay-t); }
.u.today { background: color-mix(in srgb, var(--yellow) 38%, var(--surface)); color: var(--yellow-t); }
.u.soon { background: color-mix(in srgb, var(--earth) 18%, var(--surface)); color: var(--earth-t); }
.u.week { background: color-mix(in srgb, var(--moss) 18%, var(--surface)); color: var(--moss-t); }
.u.later { background: color-mix(in srgb, var(--forest) 10%, var(--surface)); color: var(--forest-t); }
.u.wait { background: color-mix(in srgb, var(--lake) 15%, var(--surface)); color: var(--lake-t); }
.u.none { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.u.done { background: transparent; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.tag { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 1px 7px 1px 5px; font-size: .74rem; font-weight: 650; border: 0; }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 22px; padding: 22px; background: var(--surface); box-shadow: var(--shadow); display: grid; gap: 18px; isolation: isolate; }
.topo { position: absolute; inset: -20% -10% auto auto; width: 95%; max-width: 760px; height: auto; z-index: -1; opacity: .5; pointer-events: none; }
.topo path { fill: none; stroke: var(--moss); stroke-width: 1; }
@media (prefers-reduced-motion: no-preference) { .topo { animation: drift 48s ease-in-out infinite alternate; } @keyframes drift { from { transform: translate(0,0) rotate(0deg); } to { transform: translate(-24px, 14px) rotate(4deg); } } }
.hero-top { display: flex; justify-content: space-between; align-items: start; gap: 16px; flex-wrap: wrap; }
.frame { border: 7px solid var(--yellow); padding: 14px 18px 16px; background: color-mix(in srgb, var(--surface) 86%, transparent); max-width: 34rem; flex: 1 1 18rem; box-sizing: border-box; }
.hero-greet { font-family: var(--f-head); font-size: clamp(2rem, 6vw, 2.9rem); line-height: 1; margin: 0; font-weight: 600; letter-spacing: -.02em; }
.hero-date { margin: 8px 0 0; font-weight: 650; display: flex; align-items: center; gap: 7px; font-size: .95rem; }
.hero-line { margin: 10px 0 0; font-size: .98rem; }
.ring-box { display: grid; place-items: center; position: relative; width: 112px; height: 112px; flex: none; }
.ring-box svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--surface-2); stroke-width: 8; }
.ring-fg { fill: none; stroke: var(--forest); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
.ring-txt { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.05; }
.ring-txt b { font-family: var(--f-head); font-size: 1.7rem; font-weight: 600; display: block; }
.ring-txt span { font-size: .72rem; color: var(--muted); font-weight: 650; }
.quote { margin: 0; font-family: var(--f-head); font-style: italic; font-size: 1.15rem; line-height: 1.35; display: flex; gap: 10px; align-items: start; }
.quote .ic { color: var(--moss); margin-top: 4px; }
.quote-row { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
@media (prefers-reduced-motion: no-preference) { .fade { animation: fade .8s ease-out; } @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } } }
.stats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr)); }
.stat { border: 0; text-align: left; background: var(--bg); border-radius: 14px; padding: 12px 14px; display: grid; gap: 3px; min-width: 0; }
.stat-k { display: flex; align-items: center; gap: 6px; font-size: .76rem; font-weight: 650; color: var(--muted); }
.stat-v { font-family: var(--f-head); font-size: 1.6rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat-v small { font-family: var(--f-ui); font-size: .8rem; font-weight: 600; color: var(--muted); }
.stat-s { font-size: .78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.now-strip { background: var(--surface); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; box-shadow: inset 0 0 0 2px var(--ink); }
.now-label { font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--forest-t); display: flex; align-items: center; gap: 7px; }
.now-title { margin: 0; font-family: var(--f-head); font-weight: 600; font-size: clamp(1.25rem, 3.6vw, 1.55rem); line-height: 1.2; overflow-wrap: anywhere; }
.now-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; color: var(--muted); font-size: .84rem; align-items: center; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.nudges { display: grid; gap: 8px; }
.nudge { border: 0; text-align: left; display: flex; align-items: center; gap: 10px; background: color-mix(in srgb, var(--yellow) 18%, var(--surface)); border-radius: 12px; padding: 10px 12px; font-weight: 550; font-size: .9rem; }
.nudge .go { margin-left: auto; color: var(--muted); }
.ai-sum { display: grid; gap: 8px; background: var(--bg); border-radius: 14px; padding: 12px 14px; }
.ai-sum p { margin: 0; white-space: pre-wrap; }
.ai-sum-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .78rem; font-weight: 700; color: var(--muted); }
.ai-sum-h span { display: inline-flex; align-items: center; gap: 6px; }

/* calendario */
.cal-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.cal-h b { font-family: var(--f-head); font-size: 1.15rem; font-weight: 600; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal-dow { font-size: .68rem; font-weight: 700; color: var(--muted); text-align: center; padding: 2px 0 4px; text-transform: uppercase; }
.cal-d { border: 0; background: none; border-radius: 10px; height: 44px; display: grid; grid-template-rows: 1fr auto; place-items: center; padding: 3px 0; font-variant-numeric: tabular-nums; font-size: .86rem; position: relative; }
.cal-d:hover { background: var(--surface-2); }
.cal-d.out { color: color-mix(in srgb, var(--muted) 55%, transparent); }
.cal-d.today { font-weight: 800; box-shadow: inset 0 0 0 2px var(--yellow); }
.cal-d[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.cal-dots { display: flex; gap: 2px; height: 6px; }
.cal-dots i { width: 5px; height: 5px; border-radius: 50%; display: block; }
.cal-dots i.sq { border-radius: 1px; }
.agenda { display: grid; gap: 6px; margin-top: 12px; }
.agenda-h { font-weight: 700; font-size: .86rem; display: flex; align-items: center; gap: 6px; }
.dl { display: grid; gap: 0; }
.dl-row { border: 0; background: none; text-align: left; display: grid; grid-template-columns: 4.6rem minmax(0, 1fr); gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.dl-row:last-child { border-bottom: 0; }
.dl-when { font-size: .78rem; font-weight: 700; display: grid; gap: 1px; }
.dl-when span { color: var(--muted); font-weight: 600; font-size: .72rem; }
.dl-t { font-weight: 600; overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dl-t.proj { font-family: var(--f-head); font-size: 1.05rem; }

/* lista estilo Asana */
.group { display: grid; gap: 0; }
.group-h { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 10px 4px 6px; font-family: var(--f-head); font-weight: 600; font-size: 1.12rem; width: 100%; text-align: left; }
.group-h .n { color: var(--muted); font-family: var(--f-ui); font-weight: 600; font-size: .8rem; }
.group-h .chev { transition: transform .2s; color: var(--muted); }
.group-h[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.group-h .act { margin-left: auto; }
.rows { list-style: none; margin: 0; padding: 0 16px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.trow { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.trow:last-child { border-bottom: 0; }
.trow[draggable="true"] { cursor: grab; }
.trow-main { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 0; display: grid; gap: 4px; }
.trow-t { font-weight: 550; overflow-wrap: anywhere; }
.trow.done .trow-t { text-decoration: line-through; color: var(--muted); }
.trow-m { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: .78rem; color: var(--muted); align-items: center; }
.trow-m > span { display: inline-flex; align-items: center; gap: 4px; }
.add-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; color: var(--muted); }
.add-row input { flex: 1; min-width: 0; border: 0; background: none; padding: 4px 0; }
.add-row input:focus { outline: none; }
.add-row input::placeholder { color: var(--muted); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* kanban */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(16rem, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.col { background: var(--surface-2); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; min-height: 120px; align-content: start; }
.col.over { box-shadow: inset 0 0 0 2px var(--forest); }
.col-h { display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px; font-weight: 650; }
.col-h .n { color: var(--muted); font-size: .8rem; }
.kcard { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 11px 12px; display: grid; gap: 6px; border: 0; text-align: left; cursor: grab; }
.kcard.done .trow-t { text-decoration: line-through; color: var(--muted); }

/* proyectos */
.gallery { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15.5rem), 1fr)); }
.pcard { border: 0; padding: 0; text-align: left; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; display: grid; min-width: 0; }
.pcard-cover { height: 60px; position: relative; }
.pcard-emoji { position: absolute; left: 14px; bottom: -18px; font-size: 1.8rem; line-height: 1; width: 44px; height: 44px; display: grid; place-items: center; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); }
.pcard-b { padding: 26px 14px 14px; display: grid; gap: 8px; }
.pcard-t { font-family: var(--f-head); font-weight: 600; font-size: 1.15rem; margin: 0; overflow-wrap: anywhere; line-height: 1.2; }
.bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 999px; background: var(--forest); }
.pcard-new { border: 2px dashed var(--line); background: transparent; box-shadow: none; display: grid; place-items: center; min-height: 170px; color: var(--muted); font-weight: 650; gap: 6px; }
.p-cover { height: 110px; border-radius: 20px; position: relative; }
.p-cover-tools { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: end; }
.swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.2); padding: 0; flex: none; }
.swatch[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
.p-head { display: grid; gap: 10px; margin-top: -40px; padding: 0 6px; position: relative; }
.p-emoji { font-size: 2.5rem; width: 70px; height: 70px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); border: 0; display: grid; place-items: center; line-height: 1; }
.p-title { font-family: var(--f-head); font-weight: 600; font-size: clamp(1.7rem, 4.6vw, 2.4rem); border: 0; background: transparent; padding: 2px 4px; margin-left: -4px; border-radius: 8px; width: 100%; box-sizing: border-box; letter-spacing: -.015em; }
.p-title:focus { outline: 2px solid var(--ink); }
.emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; background: var(--surface); padding: 8px; border-radius: 14px; box-shadow: var(--shadow); max-width: 20rem; }
.emoji-grid button { border: 0; background: none; font-size: 1.35rem; padding: 4px; border-radius: 8px; }
.emoji-grid button:hover { background: var(--surface-2); }
.props { display: grid; gap: 2px; }
.prop { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); align-items: center; gap: 10px; min-height: 38px; }
.prop > span:first-child { color: var(--muted); font-size: .85rem; display: flex; align-items: center; gap: 7px; }
.prop input, .prop select, .prop textarea { border: 0; background: transparent; border-radius: 8px; padding: 7px 8px; width: 100%; box-sizing: border-box; min-width: 0; }
.prop input:hover, .prop select:hover { background: var(--surface-2); }
.prop input:focus, .prop select:focus { outline: 2px solid var(--ink); background: var(--surface); }
.prop a { color: var(--ink); overflow-wrap: anywhere; }
.desc { width: 100%; box-sizing: border-box; border: 0; background: var(--surface-2); border-radius: 12px; padding: 12px 14px; min-height: 4.5rem; resize: vertical; }
.desc:focus { outline: 2px solid var(--ink); }
.tools-row { display: flex; flex-wrap: wrap; gap: 8px; }
.sec-title { flex: 1; min-width: 0; border: 0; background: transparent; font-family: var(--f-head); font-weight: 600; font-size: 1.08rem; padding: 3px 6px; border-radius: 8px; }
.sec-title:focus { outline: 2px solid var(--ink); background: var(--surface); }
.tag-new { border: 0; background: transparent; border-radius: 6px; padding: 3px 6px; width: 9rem; font-size: .8rem; box-shadow: inset 0 0 0 1px var(--line); }
.tag-new:focus { outline: 2px solid var(--ink); }

/* panel */
.drawer-bg { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.28); display: flex; justify-content: flex-end; align-items: flex-end; }
.drawer { background: var(--surface); width: 100%; max-height: 94vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 14px 18px calc(24px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; display: grid; gap: 16px; align-content: start; box-shadow: 0 -10px 40px rgba(0,0,0,.18); }
@media (min-width: 920px) { .drawer-bg { align-items: stretch; } .drawer { width: min(35rem, 92vw); max-height: none; height: 100%; border-radius: 20px 0 0 20px; padding: 18px 24px calc(24px + env(safe-area-inset-bottom, 0px)) 24px; } }
.drawer-top { display: flex; align-items: center; gap: 8px; position: sticky; top: -14px; background: var(--surface); padding: 6px 0; z-index: 2; }
.drawer-top .spacer { flex: 1; }
.saved { font-size: .76rem; color: var(--muted); }
.d-title { font-family: var(--f-head); font-weight: 600; font-size: 1.6rem; border: 0; background: transparent; width: 100%; box-sizing: border-box; padding: 4px 6px; margin-left: -6px; border-radius: 8px; resize: none; overflow: hidden; line-height: 1.2; }
.d-title:focus { outline: 2px solid var(--ink); }
.subs { display: grid; gap: 2px; }
.sub { display: flex; align-items: center; gap: 10px; min-height: 36px; }
.sub input[type=text] { flex: 1; min-width: 0; border: 0; background: transparent; padding: 6px; border-radius: 8px; }
.sub input[type=text]:focus { outline: 2px solid var(--ink); }
.sub.done input[type=text] { text-decoration: line-through; color: var(--muted); }
.check { width: 20px; height: 20px; border-radius: 6px; border: 2px solid color-mix(in srgb, var(--muted) 70%, transparent); background: none; padding: 0; display: grid; place-items: center; flex: none; color: #fff; }
.check[aria-checked="true"] { background: var(--forest); border-color: var(--forest); }
.block-h { font-size: .74rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 600; font-size: .9rem; background: color-mix(in srgb, var(--clay) 12%, var(--surface)); border-radius: 12px; padding: 10px 12px; }

/* chat */
.ask { display: grid; gap: 10px; background: var(--bg); border-radius: 16px; padding: 14px; }
.ask-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.ask-h b { display: inline-flex; align-items: center; gap: 7px; font-family: var(--f-head); font-weight: 600; font-size: 1.08rem; }
.msgs { display: grid; gap: 8px; max-height: 24rem; overflow: auto; }
.msg { max-width: 90%; padding: 9px 13px; border-radius: 15px; font-size: .92rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.yo { justify-self: end; background: var(--forest); color: #fff; border-bottom-right-radius: 4px; }
.msg.claude { justify-self: start; background: var(--surface); border-bottom-left-radius: 4px; }
.msg.pending { color: var(--muted); }
.msg.tool { justify-self: center; background: none; color: var(--muted); font-size: .78rem; padding: 2px; }
.ask-row { display: flex; gap: 8px; align-items: end; }
.ask-row textarea { flex: 1; min-width: 0; border: 0; border-radius: 14px; background: var(--surface); padding: 10px 12px; min-height: 2.6rem; max-height: 8rem; resize: vertical; box-sizing: border-box; }
.ask-row textarea:focus { outline: 2px solid var(--ink); }

/* foco */
.focus { display: grid; justify-items: center; gap: 18px; text-align: center; padding: 26px 18px; position: relative; overflow: hidden; isolation: isolate; }
.focus-ring { width: min(72vw, 260px); aspect-ratio: 1; position: relative; }
.focus-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.focus-ring .ring-fg { stroke: var(--forest); stroke-width: 6; transition: stroke-dashoffset 1s linear; }
.focus-ring .ring-bg { stroke-width: 6; }
.focus-time { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-head); font-weight: 600; font-size: clamp(2.6rem, 11vw, 3.6rem); font-variant-numeric: tabular-nums; }
.focus-task { font-family: var(--f-head); font-weight: 600; font-size: 1.3rem; margin: 0; max-width: 30ch; overflow-wrap: anywhere; }
.focus select { border: 0; background: var(--surface-2); border-radius: 12px; padding: 9px 12px; max-width: 100%; }

/* registro / memoria */
.entries { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); }
.entry { border: 0; text-align: left; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.entry-top { display: flex; justify-content: space-between; gap: 8px; font-size: .8rem; color: var(--muted); }
.entry-t { font-family: var(--f-head); font-weight: 600; font-size: 1.08rem; overflow-wrap: anywhere; }
.entry-b { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .92rem; }
.entry-k { font-size: .68rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.hours-n { font-family: var(--f-head); font-weight: 600; font-size: 1.8rem; font-variant-numeric: tabular-nums; }
.insight { display: flex; gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.insight:last-child { border-bottom: 0; }
.insight .ic { color: var(--forest); margin-top: 2px; }
.mem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mem:last-child { border-bottom: 0; }
.mem textarea { border: 0; background: transparent; resize: none; overflow: hidden; width: 100%; padding: 4px 6px; border-radius: 8px; box-sizing: border-box; }
.mem textarea:focus { outline: 2px solid var(--ink); background: var(--surface); }
.mem-k { font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border-radius: 6px; padding: 3px 7px; margin-top: 4px; white-space: nowrap; }

/* guía */
.guide summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; font-weight: 650; }
.guide summary::-webkit-details-marker { display: none; }
.guide summary .chev { margin-left: auto; transition: transform .2s; color: var(--muted); }
.guide[open] summary .chev { transform: rotate(180deg); }
.steps { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12.5rem), 1fr)); }
.steps li { background: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: .9rem; display: grid; gap: 4px; align-content: start; }
.steps b { font-family: var(--f-head); font-weight: 600; font-size: 1.02rem; display: flex; align-items: center; gap: 7px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: .84rem; color: var(--muted); margin-top: 12px; align-items: center; }
.legend > span { display: inline-flex; align-items: center; gap: 7px; }

/* avisos */
.modal-bg { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.35); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 20px; padding: 20px; width: min(100%, 30rem); display: grid; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.3); max-height: 88vh; overflow: auto; box-sizing: border-box; }
.modal.wide { width: min(100%, 40rem); }
.modal h3 { margin: 0; font-size: 1.35rem; display: flex; align-items: center; gap: 8px; }
.modal ul { margin: 0; padding-left: 1.2rem; display: grid; gap: 3px; font-size: .9rem; }
.form-grid { display: grid; gap: 12px; }
.field { display: grid; gap: 5px; }
.field > span { font-size: .78rem; font-weight: 650; color: var(--muted); }
.field input, .field textarea, .field select { border: 0; background: var(--surface-2); border-radius: 10px; padding: 9px 11px; width: 100%; box-sizing: border-box; }
.field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid var(--ink); }
.line-row { display: grid; grid-template-columns: minmax(0, 1fr) 4.5rem 6rem 34px; gap: 6px; align-items: center; }
.line-row input { border: 0; background: var(--surface-2); border-radius: 10px; padding: 8px 9px; min-width: 0; width: 100%; box-sizing: border-box; }
.steps-bar { display: flex; gap: 6px; }
.steps-bar span { flex: 1; height: 4px; border-radius: 999px; background: var(--surface-2); }
.steps-bar span.on { background: var(--forest); }
.file-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 13rem); gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .86rem; }
.file-row select { border: 0; background: var(--surface-2); border-radius: 8px; padding: 6px 8px; min-width: 0; width: 100%; }
.file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-name small { color: var(--muted); }
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 18px; text-align: center; display: grid; gap: 8px; justify-items: center; color: var(--muted); }
.drop.over { border-color: var(--forest); background: color-mix(in srgb, var(--forest) 6%, var(--surface)); }
.qa { display: flex; gap: 10px; align-items: center; padding: 7px 0; }

.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 999px; font-weight: 650; font-size: .88rem; z-index: 80; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.2); }
@media (min-width: 920px) { .toast { bottom: calc(28px + env(safe-area-inset-bottom, 0px)); } }
.status { background: color-mix(in srgb, var(--clay) 14%, var(--surface)); color: var(--clay-t); border-radius: 12px; padding: 12px 14px; font-weight: 600; margin: 0; }
.confetti { position: fixed; z-index: 90; pointer-events: none; width: 7px; height: 11px; border-radius: 40% 60%; }
@media (prefers-reduced-motion: no-preference) { .confetti { animation: pop 1000ms ease-out forwards; } @keyframes pop { to { transform: translate(var(--dx), var(--dy)) rotate(300deg); opacity: 0; } } }
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
.logo { display: block; flex: none; overflow: visible; }
.brand-txt { display: grid; line-height: 1; min-width: 0; }
.brand-txt b { font-family: var(--f-mark); font-style: normal; font-weight: 600; font-size: 1.32rem; letter-spacing: .16em; text-transform: uppercase; }
.brand-txt small, .tagline { font-size: .68rem; color: var(--muted); font-weight: 600; margin-top: 4px; display: block; min-height: 1em; }
.wordmark { font-family: var(--f-mark); font-weight: 600; letter-spacing: .16em; text-transform: uppercase; font-size: .86rem; margin: 0; }
.brand-txt .tagline { min-height: 2.3em; line-height: 1.15; }
.tagline.cambia { animation: tagfade .5s ease; }
@keyframes tagfade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
/* precios y licencias */
.ic.up { transform: rotate(90deg); } .ic.down { transform: rotate(-90deg); }
.fx-box { display: grid; gap: 4px; background: var(--bg); border-radius: 14px; padding: 12px 14px; }
.fx-box h4 { margin: 0; font-size: 1rem; }
.fx-row { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0 6px; border-top: 1px solid var(--line); }
.fx-row.off .fx-main b, .fx-row.off .fx-main p { opacity: .5; }
.fx-main b { font-size: .9rem; display: block; }
.fx-main p { margin: 2px 0 3px; font-size: .82rem; color: var(--muted); line-height: 1.35; }
.fx-main small { font-size: .78rem; font-weight: 650; color: var(--muted); }
.fx-main small.up { color: var(--earth-t); } .fx-main small.down { color: var(--forest-t); }
.fx-ico { width: 38px; display: grid; place-items: center; color: var(--muted); padding-top: 2px; }
.fx-x { display: flex; align-items: center; gap: 4px; font-weight: 700; color: var(--muted); }
.fx-x input { width: 4.4rem; border: 0; background: var(--surface); border-radius: 9px; padding: 7px 8px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; color: var(--ink); box-sizing: border-box; }
.fx-x input:disabled { opacity: .45; }
.switch { width: 38px; height: 22px; border-radius: 999px; border: 0; background: color-mix(in srgb, var(--ink) 22%, transparent); position: relative; padding: 0; margin-top: 1px; cursor: pointer; flex: none; transition: background-color .2s ease; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .22s cubic-bezier(.2, .8, .2, 1); }
.switch[aria-checked="true"] { background: var(--forest); }
.switch[aria-checked="true"]::after { transform: translateX(16px); }
.chip.static { background: var(--surface-2); color: var(--muted); font-size: .76rem; padding: 3px 9px; }
.chip.strong { background: var(--ink); color: var(--surface); }
.seg.small button { padding: 4px 10px; font-size: .8rem; }
.empty-state { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 28px 18px; }
.empty-state h3 { margin: 0; font-family: var(--f-head); font-size: 1.35rem; }
.empty-state p { max-width: 30rem; margin: 0; }
.svc-group { display: grid; }
.svc-list { display: grid; padding: 4px 14px; }
.svc { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.svc:last-child { border-bottom: 0; }
.svc .check { margin-top: 2px; }
.svc-body { border: 0; background: none; padding: 0; text-align: left; display: grid; gap: 4px; color: var(--ink); min-width: 0; cursor: pointer; }
.svc-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.svc-top b { font-size: 1rem; }
.svc-price { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.svc-price small { font-weight: 550; color: var(--muted); font-size: .76rem; }
.svc-sub { font-size: .86rem; color: var(--muted); font-weight: 600; }
.svc-desc { font-size: .86rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.svc-desc.muted { color: var(--muted); font-style: italic; }
.sel-bar { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; background: var(--surface); box-shadow: var(--shadow), 0 8px 30px rgba(0,0,0,.12); border-radius: 16px; padding: 10px 12px; }
.sel-bar > span { font-variant-numeric: tabular-nums; }
@media (min-width: 900px) { .sel-bar { bottom: 16px; } }
.cot-list { display: grid; padding: 4px 6px; }
.cot-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; border: 0; background: none; text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--line); color: var(--ink); border-radius: 10px; cursor: pointer; }
.cot-row:last-child { border-bottom: 0; }
.cot-row:hover { background: var(--surface-2); }
.cot-main { display: grid; gap: 2px; min-width: 0; }
.cot-main b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cot-main small { color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cot-total { font-weight: 700; font-variant-numeric: tabular-nums; }
.pill { font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.est-enviada { background: color-mix(in srgb, var(--lake) 16%, var(--surface)); color: var(--lake-t); }
.pill.est-aceptada { background: color-mix(in srgb, var(--forest) 16%, var(--surface)); color: var(--forest-t); }
.pill.est-rechazada { background: color-mix(in srgb, var(--clay) 14%, var(--surface)); color: var(--clay-t); }
.cot-head { display: grid; gap: 12px; }
.cot-lines { display: grid; gap: 2px; }
.cot-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "type tools" "body body"; gap: 2px 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.cot-type { grid-area: type; font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); align-self: center; }
.cot-line > :nth-child(2) { grid-area: body; min-width: 0; }
.cot-tools { grid-area: tools; display: flex; gap: 0; }
.cot-tools .icon-btn { width: 30px; height: 30px; }
.cot-tools .icon-btn:disabled { opacity: .3; }
.cot-line input, .cot-line textarea { border: 0; background: var(--surface-2); border-radius: 10px; padding: 8px 10px; width: 100%; box-sizing: border-box; min-width: 0; font: inherit; color: var(--ink); }
.cot-line input:focus, .cot-line textarea:focus { outline: 2px solid var(--ink); }
.cot-line .cot-h1 { font-family: var(--f-head); font-size: 1.35rem; font-weight: 600; background: transparent; padding: 4px 6px; }
.cot-line .cot-h2 { font-weight: 700; font-size: 1rem; background: transparent; padding: 4px 6px; }
.cot-line .cot-note { font-style: italic; font-size: .9rem; }
.cot-line.t-titulo { border-top: 2px solid var(--forest); margin-top: 6px; }

      + 'Personalidad: chistoso y amigable, pero ordenado, estricto, puntual y resolutivo. Tu tono: un explorador de National Geographic documentando el caos creativo, con frases introspectivas al estilo de Carl Jung (la sombra, el inconsciente, darle sentido a lo que hace) y un giro de humor. Cómo respondés: español de Guatemala, de vos. Corto: máximo 5 líneas o 3 pasos. Una cosa a la vez. Sin palabras técnicas. Sin halagos vacíos ni logros falsos: si algo está mal o un precio está bajo, lo decís directo. Siempre cerrá con el siguiente paso concreto y cuándo hacerlo. No inventes datos: si falta algo, hacé una sola pregunta.\n' + limitesTexto();

  use('mcp').then(async (m) => {
    S.mcp = m || null;
    if (m && m.listTools) { try { const lt = await m.listTools(); S.fileArgs = !!(lt && lt.fileArgs); } catch (e) { S.fileArgs = false; } }
    if (m) {
      let st = 'prompt';
      try { const pm = await use('permissions'); if (pm) st = await pm.state('mcp:' + GCAL); } catch (e) { st = 'prompt'; }
      S.gcal.perm = st;
      if (st === 'granted') cargarGcal(true); else renderMain();
    }
  }).catch(() => {});
  use('assets').then((a) => { S.assets = a || null; }).catch(() => {});
  use('db').then((db) => {
    if (!db) { S.loadedItems = S.loadedProy = true; renderMain(true); $('#main').prepend(h('p', { class: 'status', text: 'No se pudo abrir tu registro. Abrí Curtis desde claude.ai con tu cuenta.' })); return; }
    S.db = db;
    const fail = (e) => { $('#main').prepend(h('p', { class: 'status', text: e && e.code === 'revoked' ? 'Ya no tenés acceso a este panel.' : 'Se cortó la conexión con tu registro. Recargá la página.' })); };
    db.collection('items').onSnapshot((snap) => { S.items = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); S.loadedItems = true; renderAll(); refreshChats(); quizasFrase(); }, fail);
    db.collection('proyectos').onSnapshot((snap) => { S.proyectos = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); S.loadedProy = true; renderAll(); refreshChats(); }, fail);
    db.collection('etiquetas').onSnapshot((snap) => { S.etiquetas = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())).sort((a, b) => (a.creado || 0) - (b.creado || 0)); renderAll(); }, () => {});
    db.collection('ilustraciones').onSnapshot((snap) => { S.ilustraciones = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); if (S.view === 'proyectos' || S.view === 'proyecto') renderMain(); }, () => {});
    const enVista = (...vs) => vs.includes(S.view);
    db.collection('areas').onSnapshot((snap) => { S.areas = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())).sort((a, b) => (!!b.fijada - !!a.fijada) || (a.creado || 0) - (b.creado || 0)); S.loadedAreas = true; renderNav(); if (enVista('proyectos', 'proyecto', 'area')) renderMain(); }, () => {});
    db.collection('clientes').onSnapshot((snap) => { S.clientes = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); if (enVista('proyectos', 'proyecto', 'area', 'precios')) renderMain(); }, () => {});
    db.collection('facturas').onSnapshot((snap) => { S.facturas = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); if (enVista('proyectos', 'proyecto', 'area', 'precios')) renderMain(); if (S.cotId) { const box = document.getElementById('fac-box'); if (box && S.cotDraft) { const nb = bloqueFacturasCot(S.cotDraft); nb.id = 'fac-box'; box.replaceWith(nb); } } }, () => {});
    db.collection('suscripciones').onSnapshot((snap) => { S.suscripciones = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); if (enVista('precios')) renderMain(); }, () => {});
    db.collection('movimientos').onSnapshot((snap) => { S.movimientos = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); if (enVista('precios', 'proyecto')) renderMain(); }, () => {});
    db.collection('servicios').onSnapshot((snap) => { S.servicios = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); if (S.view === 'precios' && !S.cotId) renderMain(); }, () => {});
    db.collection('cotizaciones').onSnapshot((snap) => { S.cotizaciones = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); S.loadedCot = true;
      if (S.cotId) { if (S.cotizaciones.some((c) => c.id === S.cotId)) S.cotVisto = true; else if (S.cotVisto) { S.cotId = null; S.cotDraft = null; if (S.view === 'precios') renderMain(true); } }
      if ((S.view === 'precios' && !S.cotId) || S.view === 'proyecto') renderMain(); }, () => {});
    db.collection('archivos').onSnapshot((snap) => { S.archivos = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); if (S.view === 'proyectos' || S.view === 'proyecto') renderMain(); }, () => {});
    db.collection('memoria').onSnapshot((snap) => { S.memoria = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); if (S.view === 'curtis') renderMain(); }, () => {});
    db.doc('ajustes/general').onSnapshot((snap) => { S.ajustes = snap.exists ? snap.data() : {}; renderMain(); }, () => {});
    db.doc('resumen/dia').onSnapshot((snap) => { S.resumen = snap.exists ? snap.data() : null; renderMain(); }, () => {});
    db.doc('frase/dia').onSnapshot((snap) => { S.frase = snap.exists ? snap.data() : null; const el = document.querySelector('#frase span'); if (el && !S.asking.has('frase')) el.textContent = fraseHoy(); }, () => {});
    db.doc('curtis/chat').onSnapshot((snap) => { S.curtisChat = snap.exists && Array.isArray(snap.data().chat) ? snap.data().chat : []; renderChatBox('c:general'); }, () => {});
  });
  function refreshChats() { S.asking.forEach((_, k) => renderChatBox(k)); }
  let lastDay = hoy();
  setInterval(() => { if (hoy() !== lastDay) { lastDay = hoy(); fraseIntentada = false; renderAll(); quizasFrase(); if (S.gcal.ok) cargarGcal(true); } }, 60000);
  setInterval(() => { if (S.gcal.ok && document.visibilityState === 'visible') cargarGcal(true); }, 15 * 60000);
})();
</script>
