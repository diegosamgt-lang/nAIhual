<title>Mi Tablero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&family=Sedgwick+Ave+Display&display=swap">
<style>
/* Layout: app de dos zonas. Compu: barra lateral fija + contenido; celular: contenido + barra de abajo. Inicio abre con el resumen (tarjeta grande con degradado suave), después lo de hoy. Detalle de tarea en panel lateral (compu) u hoja (celular). */
:root {
  --bg: #f5f2ec; --surface: #ffffff; --surface-2: #f0ece5; --ink: #23211d; --muted: #77716a; --line: rgba(35,33,29,.09);
  --coral: #e2735c; --butter: #eebd52; --mint: #6fb58f; --lilac: #a596e0; --sky: #78afd9; --rose: #e996ab;
  --coral-t: #b5503b; --mint-t: #3d8461; --butter-t: #94701c;
  --shadow: 0 1px 2px rgba(35,33,29,.05), 0 8px 24px rgba(35,33,29,.06);
  --f-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-head: "Bricolage Grotesque", -apple-system, "Segoe UI", sans-serif;
  --f-tag: "Sedgwick Ave Display", "Marker Felt", "Comic Sans MS", cursive;
  --r: 20px; --r-sm: 12px; --side: 248px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151412; --surface: #1f1d1a; --surface-2: #2a2824; --ink: #f3efe8; --muted: #a49e95; --line: rgba(255,255,255,.08);
  --coral: #ec8a74; --butter: #f0c869; --mint: #86c7a2; --lilac: #b5a8ec; --sky: #8fc0e6; --rose: #f0a9bb;
  --coral-t: #f09a86; --mint-t: #8fd0aa; --butter-t: #f1cd78; --shadow: 0 1px 2px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #151412; --surface: #1f1d1a; --surface-2: #2a2824; --ink: #f3efe8; --muted: #a49e95; --line: rgba(255,255,255,.08);
  --coral: #ec8a74; --butter: #f0c869; --mint: #86c7a2; --lilac: #b5a8ec; --sky: #8fc0e6; --rose: #f0a9bb;
  --coral-t: #f09a86; --mint-t: #8fd0aa; --butter-t: #f1cd78; --shadow: 0 1px 2px rgba(0,0,0,.35); color-scheme: dark; }

body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 15px; height: 15px; }
.ic.lg { width: 22px; height: 22px; }
h1, h2, h3 { font-family: var(--f-head); letter-spacing: -.015em; text-wrap: balance; }

/* estructura */
.app { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100%; }
.side { display: none; }
.main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px calc(96px + env(safe-area-inset-bottom, 0px)); min-width: 0; }
.main-in { max-width: 62rem; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px; }
@media (min-width: 900px) {
  .app { grid-template-columns: var(--side) minmax(0, 1fr); }
  .side { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; overflow: auto; padding: 22px 14px 18px max(14px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); box-sizing: border-box; }
  .main { padding: 28px 32px 48px; }
  .tabbar { display: none !important; }
}
.brand { font-family: var(--f-tag); font-size: 1.9rem; line-height: 1; padding: 4px 10px 14px; }
.nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; border-radius: 10px; padding: 8px 10px; text-align: left; color: var(--muted); font-weight: 550; }
.nav-btn:hover { background: var(--surface-2); color: var(--ink); }
.nav-btn[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.nav-btn .count { margin-left: auto; font-size: .8rem; font-variant-numeric: tabular-nums; }
.nav-h { font-size: .72rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 16px 10px 4px; display: flex; justify-content: space-between; align-items: center; }
.nav-h button { border: 0; background: none; color: var(--muted); padding: 2px; border-radius: 6px; display: grid; }
.nav-emoji { width: 22px; text-align: center; }
.side-foot { margin-top: auto; padding-top: 12px; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: space-around; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tab-btn { border: 0; background: none; display: grid; justify-items: center; gap: 2px; font-size: .68rem; font-weight: 600; color: var(--muted); padding: 4px 6px; min-width: 56px; }
.tab-btn[aria-current="page"] { color: var(--ink); }
.fab { position: fixed; right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 31; width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--ink); color: var(--surface); display: grid; place-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
@media (min-width: 900px) { .fab { bottom: calc(28px + env(safe-area-inset-bottom, 0px)); } }

/* piezas comunes */
.btn { border: 0; background: var(--ink); color: var(--surface); border-radius: 999px; padding: 9px 16px; font-weight: 650; white-space: nowrap; font-size: .92rem; display: inline-flex; align-items: center; gap: 7px; }
.btn.soft { background: var(--surface-2); color: var(--ink); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn.ok { background: color-mix(in srgb, var(--mint) 22%, var(--surface)); color: var(--mint-t); }
.btn.warn { background: color-mix(in srgb, var(--coral) 18%, var(--surface)); color: var(--coral-t); }
.btn.small { padding: 6px 12px; font-size: .84rem; }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { border: 0; background: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 0; background: var(--surface-2); border-radius: 999px; padding: 5px 11px; font-size: .83rem; font-weight: 550; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg { display: inline-flex; gap: 2px; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 13px; font-weight: 600; font-size: .86rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.page-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.page-h h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.1rem); font-weight: 800; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 2px 10px; }
.sec-h h2 { margin: 0; font-size: 1.15rem; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.sec-h .muted { color: var(--muted); font-size: .86rem; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.pad { padding: 16px 18px; }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: .84rem; margin: 0; }
.err { color: var(--coral-t); font-weight: 600; margin: 0; font-size: .9rem; }
.empty { color: var(--muted); padding: 14px 18px; margin: 0; font-size: .92rem; }
.scroll-x { overflow-x: auto; }

/* forma de estado */
.st { flex: none; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--muted) 70%, transparent); position: relative; display: inline-block; }
.st.mini { width: 13px; height: 13px; border-width: 1.75px; }
.st.en-proceso { border-color: var(--butter); background: linear-gradient(90deg, var(--butter) 50%, transparent 50%); }
.st.esperando { border-radius: 5px; border-color: var(--coral); background: var(--coral); }
.st.listo { border-color: var(--mint); background: var(--mint); }
.st.listo::after { content: ""; position: absolute; left: 32%; top: 14%; width: 25%; height: 46%; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.st.mini.listo::after { border-width: 0 1.5px 1.5px 0; }
.st-btn { border: 0; background: none; padding: 5px; margin: -5px; border-radius: 50%; display: grid; place-items: center; }
.st-btn:hover .st:not(.listo) { border-color: var(--mint); }

/* resumen (hero) */
.hero { position: relative; overflow: hidden; border-radius: 26px; padding: 22px 22px 20px; background:
  radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--butter) 42%, transparent) 0%, transparent 55%),
  radial-gradient(90% 90% at 100% 10%, color-mix(in srgb, var(--rose) 40%, transparent) 0%, transparent 60%),
  radial-gradient(100% 100% at 60% 120%, color-mix(in srgb, var(--lilac) 45%, transparent) 0%, transparent 60%),
  var(--surface); box-shadow: var(--shadow); display: grid; gap: 18px; }
.hero-top { display: flex; justify-content: space-between; align-items: start; gap: 16px; flex-wrap: wrap; }
.hello-tag { font-family: var(--f-tag); font-size: clamp(2rem, 6.5vw, 3rem); line-height: .95; margin: 0; }
.hero-date { font-family: var(--f-head); font-weight: 650; font-size: 1.05rem; margin: 6px 0 0; display: flex; align-items: center; gap: 7px; }
.hero-line { margin: 10px 0 0; max-width: 46ch; font-size: 1rem; }
.ring-box { display: grid; place-items: center; position: relative; width: 108px; height: 108px; flex: none; }
.ring-box svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: color-mix(in srgb, var(--ink) 10%, transparent); stroke-width: 9; }
.ring-fg { fill: none; stroke: var(--ink); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
.ring-txt { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.05; }
.ring-txt b { font-family: var(--f-head); font-size: 1.6rem; font-weight: 800; display: block; }
.ring-txt span { font-size: .72rem; color: var(--muted); font-weight: 600; }
.stats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr)); }
.stat { border: 0; text-align: left; background: color-mix(in srgb, var(--surface) 72%, transparent); backdrop-filter: blur(6px); border-radius: 16px; padding: 12px 14px; display: grid; gap: 4px; min-width: 0; }
.stat-k { display: flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 650; color: var(--muted); }
.stat-v { font-family: var(--f-head); font-size: 1.45rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat-v small { font-size: .82rem; font-weight: 600; color: var(--muted); }
.stat-s { font-size: .8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.now-strip { background: var(--surface); border-radius: 18px; padding: 14px 16px; display: grid; gap: 10px; box-shadow: 0 0 0 2px var(--ink); }
.now-label { font-family: var(--f-tag); font-size: 1.25rem; line-height: 1; color: var(--coral-t); display: flex; align-items: center; gap: 8px; }
.now-title { margin: 0; font-family: var(--f-head); font-weight: 650; font-size: clamp(1.15rem, 3.4vw, 1.4rem); line-height: 1.2; overflow-wrap: anywhere; }
.now-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--muted); font-size: .86rem; align-items: center; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.ai-sum { display: grid; gap: 8px; background: color-mix(in srgb, var(--surface) 70%, transparent); border-radius: 16px; padding: 12px 14px; }
.ai-sum p { margin: 0; white-space: pre-wrap; }
.ai-sum-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .8rem; font-weight: 700; color: var(--muted); }
.ai-sum-h span { display: inline-flex; align-items: center; gap: 6px; }

/* lista estilo Asana */
.group { display: grid; gap: 0; }
.group-h { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 10px 4px 6px; font-family: var(--f-head); font-weight: 650; font-size: 1rem; width: 100%; text-align: left; }
.group-h .n { color: var(--muted); font-family: var(--f-ui); font-weight: 600; font-size: .82rem; }
.group-h .chev { transition: transform .2s; color: var(--muted); }
.group-h[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.group-h .act { margin-left: auto; }
.rows { list-style: none; margin: 0; padding: 0 16px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.trow { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.trow:last-child { border-bottom: 0; }
.trow[draggable="true"] { cursor: grab; }
.trow-main { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 0; display: grid; gap: 3px; }
.trow-t { font-weight: 550; overflow-wrap: anywhere; }
.trow.done .trow-t { text-decoration: line-through; color: var(--muted); }
.trow-m { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .8rem; color: var(--muted); align-items: center; }
.trow-m span { display: inline-flex; align-items: center; gap: 4px; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: .76rem; font-weight: 650; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.hoy { background: color-mix(in srgb, var(--butter) 30%, var(--surface)); color: var(--butter-t); }
.pill.antes { background: color-mix(in srgb, var(--coral) 16%, var(--surface)); color: var(--coral-t); }
.pill.prio { background: color-mix(in srgb, var(--coral) 16%, var(--surface)); color: var(--coral-t); }
.add-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; color: var(--muted); }
.add-row input { flex: 1; min-width: 0; border: 0; background: none; padding: 4px 0; }
.add-row input:focus { outline: none; }
.add-row input::placeholder { color: var(--muted); }

/* tablero (kanban) */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(16rem, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.col { background: var(--surface-2); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; min-height: 120px; align-content: start; }
.col.over { box-shadow: inset 0 0 0 2px var(--ink); }
.col-h { display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px; font-weight: 650; font-family: var(--f-head); }
.col-h input { flex: 1; min-width: 0; border: 0; background: transparent; font-family: var(--f-head); font-weight: 650; font-size: 1rem; padding: 2px 4px; border-radius: 6px; }
.col-h input:focus { outline: 2px solid var(--ink); background: var(--surface); }
.col-h .n { color: var(--muted); font-size: .8rem; font-family: var(--f-ui); }
.kcard { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 11px 12px; display: grid; gap: 6px; border: 0; text-align: left; cursor: grab; }
.kcard.done .trow-t { text-decoration: line-through; color: var(--muted); }

/* proyectos (galería Notion) */
.gallery { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15.5rem), 1fr)); }
.pcard { border: 0; padding: 0; text-align: left; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; display: grid; min-width: 0; }
.pcard-cover { height: 64px; position: relative; }
.pcard-emoji { position: absolute; left: 14px; bottom: -18px; font-size: 1.9rem; line-height: 1; width: 44px; height: 44px; display: grid; place-items: center; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); }
.pcard-b { padding: 26px 14px 14px; display: grid; gap: 8px; }
.pcard-t { font-family: var(--f-head); font-weight: 650; font-size: 1.05rem; margin: 0; overflow-wrap: anywhere; }
.bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 999px; background: var(--mint); }
.pcard-new { border: 2px dashed var(--line); background: transparent; box-shadow: none; display: grid; place-items: center; min-height: 170px; color: var(--muted); font-weight: 650; gap: 6px; }

/* página de proyecto */
.p-cover { height: 120px; border-radius: 22px; position: relative; }
.p-cover-tools { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: end; }
.swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.2); padding: 0; }
.swatch[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
.p-head { display: grid; gap: 10px; margin-top: -42px; padding: 0 6px; position: relative; }
.p-emoji { font-size: 2.6rem; width: 72px; height: 72px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); border: 0; display: grid; place-items: center; line-height: 1; }
.p-title { font-family: var(--f-head); font-weight: 800; font-size: clamp(1.6rem, 4.5vw, 2.2rem); border: 0; background: transparent; padding: 2px 4px; margin-left: -4px; border-radius: 8px; width: 100%; box-sizing: border-box; letter-spacing: -.015em; }
.p-title:focus { outline: 2px solid var(--ink); }
.emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; background: var(--surface); padding: 8px; border-radius: 14px; box-shadow: var(--shadow); max-width: 20rem; }
.emoji-grid button { border: 0; background: none; font-size: 1.35rem; padding: 4px; border-radius: 8px; }
.emoji-grid button:hover { background: var(--surface-2); }
.props { display: grid; gap: 2px; }
.prop { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); align-items: center; gap: 10px; min-height: 38px; }
.prop > span { color: var(--muted); font-size: .86rem; display: flex; align-items: center; gap: 7px; }
.prop input, .prop select, .prop textarea { border: 0; background: transparent; border-radius: 8px; padding: 7px 8px; width: 100%; box-sizing: border-box; min-width: 0; }
.prop input:hover, .prop select:hover, .prop textarea:hover { background: var(--surface-2); }
.prop input:focus, .prop select:focus, .prop textarea:focus { outline: 2px solid var(--ink); background: var(--surface); }
.prop a { color: var(--ink); overflow-wrap: anywhere; }
.desc { width: 100%; box-sizing: border-box; border: 0; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; min-height: 4.5rem; resize: vertical; }
.desc:focus { outline: 2px solid var(--ink); }
.tools-row { display: flex; flex-wrap: wrap; gap: 8px; }
.sec-title { flex: 1; min-width: 0; border: 0; background: transparent; font-family: var(--f-head); font-weight: 650; font-size: 1rem; padding: 3px 6px; border-radius: 8px; }
.sec-title:focus { outline: 2px solid var(--ink); background: var(--surface); }

/* detalle (panel) */
.drawer-bg { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.28); display: flex; justify-content: flex-end; align-items: flex-end; }
.drawer { background: var(--surface); width: 100%; max-height: 94vh; overflow: auto; border-radius: 22px 22px 0 0; padding: 14px 18px calc(24px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; display: grid; gap: 16px; align-content: start; box-shadow: 0 -10px 40px rgba(0,0,0,.18); }
@media (min-width: 900px) { .drawer-bg { align-items: stretch; } .drawer { width: min(34rem, 92vw); max-height: none; height: 100%; border-radius: 22px 0 0 22px; padding: 18px 24px calc(24px + env(safe-area-inset-bottom, 0px)) 24px; } }
.drawer-top { display: flex; align-items: center; gap: 8px; position: sticky; top: -14px; background: var(--surface); padding: 6px 0; z-index: 2; }
.drawer-top .spacer { flex: 1; }
.saved { font-size: .78rem; color: var(--muted); }
.d-title { font-family: var(--f-head); font-weight: 800; font-size: 1.45rem; border: 0; background: transparent; width: 100%; box-sizing: border-box; padding: 4px 6px; margin-left: -6px; border-radius: 8px; resize: none; overflow: hidden; line-height: 1.2; }
.d-title:focus { outline: 2px solid var(--ink); }
.subs { display: grid; gap: 2px; }
.sub { display: flex; align-items: center; gap: 10px; min-height: 36px; }
.sub input[type=text] { flex: 1; min-width: 0; border: 0; background: transparent; padding: 6px; border-radius: 8px; }
.sub input[type=text]:focus { outline: 2px solid var(--ink); }

  const S = {

  // ================= utilidades =================
  const $ = (s) => document.querySelector(s);
  function h(tag, props, ...kids) {

    for (const c of kids.flat(3)) if (c != null && c !== false && c !== '') el.append(c.nodeType ? c : document.createTextNode(String(c)));
    return el;
  }
  const put = (el, ...kids) => el.replaceChildren(...kids.flat(4).filter((k) => k != null && k !== false && k !== ''));
  function icon(name, cls) {
    const ns = 'http://www.w3.org/2000/svg';

  const isoLocal = (d) => d.toLocaleDateString('en-CA');
  const hoy = () => isoLocal(new Date());
  const mesActual = () => hoy().slice(0, 7);
  const anioActual = () => hoy().slice(0, 4);
  const parseIso = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
  const addDays = (iso, n) => { const d = parseIso(iso); d.setDate(d.getDate() + n); return isoLocal(d); };
  const diffDays = (iso) => Math.round((parseIso(iso) - parseIso(hoy())) / 864e5);
  const cap = (t) => (t ? t.charAt(0).toUpperCase() + t.slice(1) : t);
  const fmtDate = (iso, opts) => {
    if (!iso) return '';
    if (/^\d{4}$/.test(iso)) return 'Año ' + iso;
    if (/^\d{4}-\d{2}$/.test(iso)) return cap(parseIso(iso + '-01').toLocaleDateString('es-GT', { month: 'long', year: 'numeric' }));

  const when = (iso) => {
    if (!iso || iso.length < 10) return fmtDate(iso);

    if (d === 0) return 'Hoy'; if (d === 1) return 'Mañana'; if (d === -1) return 'Ayer';

  const num = (n) => new Intl.NumberFormat('es-GT', { maximumFractionDigits: 2 }).format(n || 0);

  let toastTimer;

  function confetti(x, y) {
    const colors = ['var(--coral)', 'var(--butter)', 'var(--mint)', 'var(--sky)', 'var(--lilac)', 'var(--rose)'];

  use('db').then((db) => {
    if (!db) { S.loadedItems = S.loadedProy = true; $('#main').prepend(h('p', { class: 'status', text: 'No se pudo abrir tu registro. Abrí este tablero desde claude.ai con tu cuenta.' })); renderMain(true); return; }
    S.db = db;
    const fail = (e) => { $('#main').prepend(h('p', { class: 'status', text: e && e.code === 'revoked' ? 'Ya no tenés acceso a este tablero.' : 'Se cortó la conexión con tu registro. Recargá la página.' })); };
    db.collection('items').onSnapshot((snap) => { S.items = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); S.loadedItems = true; renderAll(); refreshChats(); }, fail);
    db.collection('proyectos').onSnapshot((snap) => { S.proyectos = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); S.loadedProy = true; renderAll(); refreshChats(); }, fail);
    db.doc('ajustes/general').onSnapshot((snap) => { S.ajustes = snap.exists ? snap.data() : {}; renderMain(); }, () => {});
    db.doc('resumen/dia').onSnapshot((snap) => { S.resumen = snap.exists ? snap.data() : null; renderMain(); }, () => {});
  });
  function refreshChats() { S.asking.forEach((_, k) => renderChatBox(k)); }
  let lastDay = hoy();
  setInterval(() => { if (hoy() !== lastDay) { lastDay = hoy(); renderAll(); } }, 60000);
})();
</script>
