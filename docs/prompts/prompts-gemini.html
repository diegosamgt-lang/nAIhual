<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prompts para Gemini</title>
<style>
:root { --bg: #f3f1ec; --card: #ffffff; --ink: #1d2125; --ink2: #62676d; --line: rgba(29,33,37,.12); --acc: #2f4b7c; --on: #ffffff; --ok: #2f6b4f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121518; --card: #1b1f23; --ink: #eceae4; --ink2: #9c9a93; --line: rgba(236,234,228,.13); --acc: #93acdb; --on: #121518; --ok: #8fcaa9; } }
:root[data-theme="dark"] { --bg: #121518; --card: #1b1f23; --ink: #eceae4; --ink2: #9c9a93; --line: rgba(236,234,228,.13); --acc: #93acdb; --on: #121518; --ok: #8fcaa9; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.02em; }
.how { color: var(--ink2); margin: 0 0 18px; }
.how b { color: var(--ink); }
details { background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin: 0 0 10px; }
summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; min-height: 52px; font-weight: 700; font-size: 17px; }
summary::-webkit-details-marker { display: none; }
summary small { color: var(--ink2); font-weight: 500; font-size: 13px; }
.body { padding: 0 16px 16px; }
pre { white-space: pre-wrap; word-wrap: break-word; background: var(--bg); border-radius: 12px; padding: 12px; font: 13.5px/1.5 ui-monospace, Menlo, monospace; margin: 0 0 10px; max-height: 280px; overflow: auto; }
button { font: inherit; font-weight: 700; border: 0; border-radius: 12px; min-height: 48px; width: 100%; background: var(--acc); color: var(--on); cursor: pointer; }
button.done { background: var(--ok); }
.n { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--bg); font-size: 13px; margin-right: 8px; }
</style></head><body><main>
<h1>Prompts para Gemini</h1>
<p class="how"><b>Cómo:</b> abrí un chat nuevo en Gemini → tocá «Copiar» en la categoría → pegá y enviá. Un chat por categoría, en este orden. Lo que te devuelva, pasáselo a Claude: «cargá el directorio».</p>
<div id="list"></div>
</main>
<script>
var BASE = 'Reglas:\n- Máximo 20 lugares, empezando por los de tradición y familiares.\n- Solo lugares que aparezcan en una fuente pública que puedas citar (Google Maps, la web o las redes del negocio, guías de viaje, medios). No inventes nada.\n- Sin calificaciones, estrellas ni número de reseñas. Sin copiar reseñas.\n- Sin horarios, sin precios y sin datos de personas (nombres de empleados, teléfonos personales).\n- Sin significados mayas ni ceremonias.\n- «contexto» son datos, no opiniones: de quién es (familiar, nacional, cadena, extranjero), desde cuándo y qué lo hace distinto, según la fuente.\n- Incluí también cadenas, marcadas como cadena.\n- maps_url: el enlace del lugar en Google Maps (Compartir → Copiar enlace), no un enlace de búsqueda.\n- Si un dato no está en la fuente, dejalo vacío.\n\nDevolvé una tabla con estas columnas, en este orden:\nnombre | categoria | tipo | direccion | maps_url | contexto | redes_o_web | fuente | fuente_url | fecha_consulta (AAAA-MM-DD) | origen | para | confirmo | estado\n\n«origen» siempre «ia». Dejá vacías «para», «confirmo» y «estado» (las llena Diego).';
var CATS = [
  ['hospedaje', 'Hospedaje', 'hostales, hoteles y casas de huéspedes locales (familiares primero; las cadenas, marcadas como cadena)'],
  ['comida', 'Comida', 'restaurantes y comida típica guatemalteca, de tradición y familiares'],
  ['cafe', 'Cafés', 'cafés y cafeterías, sobre todo los que tuestan café de Guatemala'],
  ['postres', 'Pan y postres', 'panaderías tradicionales, dulcerías y pastelerías'],
  ['noche', 'De noche', 'bares, cervecerías artesanales y lugares con música en vivo'],
  ['transporte', 'Transporte', 'formas de moverse: shuttles, buses («camionetas»), tuk-tuks y taxis; dónde se toman. Con fuente y fecha; sin precios'],
  ['mercado', 'Mercados y comedores', 'mercados y comedores populares dentro de los mercados'],
  ['artesania', 'Artesanos y talleres', 'tiendas y talleres donde la artesanía la hace quien la vende (tejido, cerámica, jade, madera)'],
  ['mirador', 'Miradores y naturaleza', 'miradores, cerros, fincas y caminatas cerca de Antigua (incluí el Cerro de la Cruz y la zona de Panorama)'],
  ['evento', 'Fiestas y eventos', 'fiestas, ferias, procesiones y eventos de los próximos meses, siempre con su fecha y la fuente que la publica']
];
var list = document.getElementById('list');
CATS.forEach(function (c, i) {
  var text = 'Armá un inventario de ' + c[2] + ' en Antigua Guatemala para nAIhual, una guía de turismo consciente y comunitario. Categoría: ' + c[0] + '.\n\n' + BASE;
  var d = document.createElement('details');
  var s = document.createElement('summary'); s.innerHTML = '<span><span class="n">' + (i + 1) + '</span>' + c[1] + '</span><small>máx. 20</small>';
  var b = document.createElement('div'); b.className = 'body';
  var pre = document.createElement('pre'); pre.textContent = text;
  var btn = document.createElement('button'); btn.type = 'button'; btn.textContent = 'Copiar';
  btn.addEventListener('click', function () {
    var ok = function () { btn.textContent = 'Copiado ✓'; btn.classList.add('done'); setTimeout(function () { btn.textContent = 'Copiar'; btn.classList.remove('done'); }, 2500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, function () { sel(pre); });
    else sel(pre);
  });
  b.appendChild(pre); b.appendChild(btn); d.appendChild(s); d.appendChild(b); list.appendChild(d);
});
function sel(el) { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
</script>
</body></html>
