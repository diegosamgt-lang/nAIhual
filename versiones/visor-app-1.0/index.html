<style>
/* Layout: app de celular (máx. 520px), 3 pestañas abajo: Guía (chat), Explorar (muro 2 columnas), Para vos.
   Visual NEUTRO y provisional: el fundador hará el arte final. Los colores de guardián solo sirven para distinguirlos. */
:root {
  --bg: #f3f2ef; --surface: #ffffff; --sunk: #e8e6e1;
  --ink: #1b1b1a; --ink-2: #4a4945; --ink-3: #75736d;

  --on-g: #ffffff; --heart: #b4462f;
  --star: #8a4b2a; --hist: #4f6340;
  --band: #1b1b1a; --band-ink: #f3f2ef; --band-muted: #c9c6be;
  --shadow: 0 1px 2px rgba(0,0,0,.08), 0 4px 14px rgba(0,0,0,.05);
  --font: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161615; --surface: #222220; --sunk: #2c2c29;
  --ink: #efede8; --ink-2: #c9c6be; --ink-3: #9d9a92;
  --line: rgba(239,237,232,.14);
  --g-batz: #d98468; --g-kej: #93ab7c; --g-ajpu: #d9ad4c; --g-noj: #86a7bf;
  --g-batz-soft: #3a2620; --g-kej-soft: #26301f; --g-ajpu-soft: #362b13; --g-noj-soft: #1f2a33;
  --on-g: #161615; --heart: #ef8a70; --star: #e59b72; --hist: #a9c08f;
  --band: #0c0c0b; --band-ink: #efede8; --band-muted: #9d9a92;
  --shadow: 0 1px 2px rgba(0,0,0,.5);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #161615; --surface: #222220; --sunk: #2c2c29;
  --ink: #efede8; --ink-2: #c9c6be; --ink-3: #9d9a92;
  --line: rgba(239,237,232,.14);
  --g-batz: #d98468; --g-kej: #93ab7c; --g-ajpu: #d9ad4c; --g-noj: #86a7bf;
  --g-batz-soft: #3a2620; --g-kej-soft: #26301f; --g-ajpu-soft: #362b13; --g-noj-soft: #1f2a33;
  --on-g: #161615; --heart: #ef8a70; --star: #e59b72; --hist: #a9c08f;
  --band: #0c0c0b; --band-ink: #efede8; --band-muted: #9d9a92;
  --shadow: 0 1px 2px rgba(0,0,0,.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }

.app { max-width: 520px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column;

.g-batz { --gc: var(--g-batz); --gs: var(--g-batz-soft); }

.hint { font-size: 12px; color: var(--ink-3); text-align: center; margin: -4px 0 0; }

main { flex: 1; padding-block: 16px 140px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.tipcard p { color: var(--ink); }
.notes { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }
.note-star { color: var(--star); } .note-hist { color: var(--hist); } .note-muted { color: var(--ink-3); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); font-size: 14.5px; font-weight: 600; text-decoration: none; background: var(--surface); cursor: pointer; }
.btn.solid { background: var(--ink); color: var(--bg); border-color: transparent; }
.btn.g { background: var(--gc); color: var(--on-g); border-color: transparent; }
.btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.btn svg { fill: none; stroke: currentColor; }
.card .btn { align-self: flex-start; margin-top: 4px; min-height: 42px; font-size: 14px; }
.heart { position: absolute; right: 6px; bottom: 6px; width: 40px; height: 40px; border: 0; border-radius: 50%; cursor: pointer; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow); }
.heart svg, .btn.save svg { fill: none; stroke: var(--heart); }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: linear-gradient(to top, var(--bg) 85%, transparent); padding-top: 18px; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.dock-in { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); cursor: pointer; min-height: 40px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: transparent; }

form { display: flex; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 5px 5px 16px; box-shadow: var(--shadow); }

form button { flex: none; border: 0; cursor: pointer; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--gc); color: var(--on-g); }

nav.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(440px, calc(100% - 28px)); display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: var(--band); box-shadow: var(--shadow); z-index: 6; }
nav.tabs button { flex: 1; border: 0; cursor: pointer; min-height: 46px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 14px; font-weight: 700; background: transparent; color: var(--band-muted); }
nav.tabs button[aria-current="page"] { background: var(--bg); color: var(--ink); }
nav.tabs svg { fill: none; stroke: currentColor; }

/* explorar */
.pagehead h1 { font-size: 28px; line-height: 1.1; }
.pagehead p { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; }
.search { display: flex; align-items: center; gap: 10px; padding: 0 16px; min-height: 48px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.search svg { fill: none; stroke: var(--ink-3); flex: none; }

.grid { column-count: 2; column-gap: 12px; }
.pin { display: inline-block; width: 100%; margin: 0 0 14px; break-inside: avoid; cursor: pointer; vertical-align: top; }
.pin-img { position: relative; border-radius: 20px; overflow: hidden; background: var(--sunk); display: flex; align-items: flex-end; padding: 12px; }

.tag { display: inline-flex; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface); color: var(--ink-2); }
.pin-cap { padding: 8px 4px 0; display: flex; flex-direction: column; gap: 3px; }
.pin-cap b { font-size: 14.5px; line-height: 1.25; }
.pin-cap > span:not(.gs) { font-size: 12.5px; line-height: 1.35; color: var(--ink-3); }
.pin-cap .gs { display: flex; gap: 4px; margin-top: 2px; }

.pin-tip { position: relative; padding: 16px 16px 56px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); }
.pin-tip .k { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.pin-tip p { margin: 6px 0 0; font-size: 16px; line-height: 1.35; font-weight: 600; }
.empty-q { margin: 4px; color: var(--ink-2); }
.biz { padding: 20px; border-radius: 26px; background: var(--band); color: var(--band-ink); display: flex; flex-direction: column; gap: 10px; }
.biz .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.biz .kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--band-muted); }
.biz .tag { background: var(--band-ink); color: var(--band); }
.biz h2 { font-size: 21px; }
.biz p { margin: 0; font-size: 14.5px; color: var(--band-muted); }
.biz .btn { align-self: flex-start; background: var(--band-ink); color: var(--band); border-color: transparent; }

/* ficha */
.d-img { height: 170px; border-radius: 26px; background: var(--sunk); display: flex; align-items: flex-end; padding: 18px; }
.d-img .glyph { font-size: 64px; font-weight: 700; line-height: 1; color: var(--ink-3); opacity: .5; }
.d-body { display: flex; flex-direction: column; gap: 8px; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }

.rlink svg { fill: none; stroke: currentColor; flex: none; }
.list { display: flex; flex-direction: column; gap: 8px; }
.respect { margin: 0; font-size: 13px; color: var(--ink-3); }

/* para vos */
.emptybox { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 22px; border-radius: 26px; background: var(--surface); border: 1px solid var(--line); }

.plan > p { margin: 0; font-size: 13.5px; color: var(--ink-2); }

.plan .num { width: 36px; height: 36px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; font-weight: 700; }
.plan li b { display: block; font-size: 15px; }
.plan li small { font-size: 12.5px; color: var(--ink-3); }
.plan .btn { width: 100%; }
.saved-h { font-size: 18px; margin-top: 8px; }

.foot { font-size: 11.5px; color: var(--ink-3); text-align: center; margin: 0; }
.linkbtn { border: 0; background: none; padding: 0; cursor: pointer; text-decoration: underline; color: var(--ink-3); font-size: 11.5px; }
dialog { border: 0; padding: 0; border-radius: 22px; width: min(480px, calc(100% - 32px)); max-height: 85vh; background: var(--bg); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.3); }

.dlg { padding: 20px; display: flex; flex-direction: column; gap: 12px; }

.dlg > p { margin: 0; color: var(--ink-2); font-size: 14.5px; }

.gcard dt { color: var(--ink-3); } .gcard dd { margin: 0; }

@media (prefers-reduced-motion: no-preference) { .msg.new { animation: up .25s ease-out; } @keyframes up { from { transform: translateY(6px); opacity: .4; } } .pin:active { transform: scale(.98); } }
</style>

  return '<div class="msg g-' + m.from + (isNew ? ' new' : '') + '"><div class="who"><span class="av" aria-hidden="true">' + g.ini + '</span><div><b>' + esc(g.name) + '</b> <em>' + esc(t.guides + ' · ' + g.value[L].toLowerCase()) + '</em></div></div>' +
    '<div class="bubble">' + paras.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div>' +
    (cards ? '<div class="cards">' + cards + '</div>' : '') + notesHTML(star, hist) + '</div>';
}
function guiaHTML(scrollNew) {
  return S.msgs.map(function (m, i) { return msgHTML(m, scrollNew && i >= S.msgs.length - 2); }).join('');
}

// ===================== EXPLORAR (muro) =====================
var FEED = ['r:centro', 'p:doce', 't:cholqij', 'p:capuchinas', 'c:nawales', 'p:once', 'r:conventos', 't:rukux', 'p:artista', 't:foto', 'p:arco', 'p:siena', 't:maiz', 'p:cazador', 'r:norte', 'p:coffea', 't:winaq', 'p:merced', 't:nikaj', 'p:patio', 'p:fatcat', 'p:santaclara', 't:ab', 'p:komori', 't:horario', 'p:sanfrancisco', 't:rueda', 'p:hectors', 'p:catedral', 't:cargadores', 'p:nikolo', 'p:alegria', 'p:palacio', 'p:pina', 'p:parque']
  .concat(NAWALES.map(function (r) { return 'n:' + r[0]; }));
var HEIGHTS = [210, 160, 190, 230, 150, 200];
function gOf(key) {
  var k = key.split(':')[0], id = key.split(':')[1];
  if (k === 'p') return P[id].g; if (k === 'r') return ROUTES[id].g; if (k === 't') return TIPS[id].g;
  if (k === 'n') return GUARDIAN_NAWAL[id] ? [id] : []; return ['noj'];
}
function pinOf(key, i) {
  var t = STR[S.lang], L = S.lang, k = key.split(':')[0], id = key.split(':')[1], b = { key: key, h: HEIGHTS[i % HEIGHTS.length], g: gOf(key) };
  if (k === 'r') { var r = ROUTES[id]; return Object.assign(b, { type: 'route', img: true, label: t.route, glyph: r.stops.length, title: r.title[L] + ' †', sub: r.stops.length + ' ' + t.stops, text: r.title[L] + ' ' + r.intro[L], hist: true }); }
  if (k === 'p') { var p = P[id]; return Object.assign(b, { type: p.cat, img: true, label: t.place[p.cat], glyph: p.name.charAt(0), title: p.name + marks(p), sub: p.why[L], text: p.name + ' ' + p.why[L], hist: !!p.hist }); }
  if (k === 'c') return Object.assign(b, { type: 'cultura', img: true, label: t.collection, glyph: '20', title: t.nawalsTitle + ' *', sub: t.nawalsSub, text: t.nawalsTitle + ' nawal nahual', star: true });
  if (k === 'n') { var nw = N[id]; return Object.assign(b, { type: 'nawal', img: true, label: t.nawal, glyph: nw.n, title: nw.name + ' *', sub: nw.symbol[L], text: nw.name + ' nawal nahual ' + nw.symbol[L] + ' ' + nw.animal[L], star: true }); }
  var tp = TIPS[id]; return Object.assign(b, { type: 'tip', img: false, label: t.tip, body: tp.body[L] + marks(tp), text: tp.body[L], star: !!tp.star });
}
function gsHTML(list) { return list && list.length ? '<span class="gs">' + list.map(function (g) { return '<span class="av g-' + g + '" title="' + esc(G[g].name) + '">' + G[g].ini + '</span>'; }).join('') + '</span>' : ''; }
function pinHTML(p) {
  if (!p.img) return '<div class="pin" data-open="' + p.key + '" role="button" tabindex="0"><div class="pin-tip"><span class="k">' + esc(p.label) + '</span><p>' + esc(p.body) + '</p>' + heartBtn(p.key) + '</div></div>';
  return '<div class="pin" data-open="' + p.key + '" role="button" tabindex="0"><div class="pin-img" style="height:' + p.h + 'px"><span class="tag">' + esc(p.label) + '</span><span class="glyph" aria-hidden="true">' + esc(p.glyph) + '</span>' + heartBtn(p.key) + '</div>' +
    '<div class="pin-cap"><b>' + esc(p.title) + '</b><span>' + esc(p.sub) + '</span>' + gsHTML(p.g) + '</div></div>';
}
function gridNotes(list) { return notesHTML(list.some(function (p) { return p.star; }), list.some(function (p) { return p.hist; })); }
function feedHTML() {
  var t = STR[S.lang], qy = norm(S.query.trim()), f = S.filter, all = FEED.map(pinOf);
  var list = all.filter(function (p) {
    var ok = f === 'all' ? p.type !== 'nawal' : f === 'route' ? p.type === 'route' : f === 'tip' ? p.type === 'tip' : f === 'nawal' ? p.type === 'nawal' : (p.type === f);
    if (qy) ok = (f === 'all' || ok) && norm(p.text).indexOf(qy) >= 0;
    return ok;
  });
  var fdefs = [['all', t.fAll], ['route', t.fRoute], ['cultura', t.fCultura], ['nawal', t.fNawal], ['cafe', t.fCafe], ['comida', t.fComida], ['tip', t.fTip]];
  var wa = BIZ_WHATSAPP.replace(/\D/g, '');
  var biz = wa ? '<a class="btn" href="https://wa.me/' + wa + '?text=' + encodeURIComponent(t.bizMsg) + '" target="_blank" rel="noopener">' + esc(t.bizCta) + '</a>' : '<span class="btn" aria-disabled="true">' + esc(t.bizPending) + '</span>';
  return '<div class="pagehead"><h1>' + esc(t.feedTitle) + '</h1><p>' + esc(t.feedSub) + '</p></div>' +
    '<label class="search">' + ICON.search + '<input id="fq" type="search" autocomplete="off" placeholder="' + esc(t.search) + '" value="' + esc(S.query) + '" aria-label="' + esc(t.search) + '"></label>' +
    '<div class="chips" role="group">' + fdefs.map(function (d) { return '<button type="button" class="chip" data-filter="' + d[0] + '" aria-pressed="' + (f === d[0]) + '">' + esc(d[1]) + '</button>'; }).join('') + '</div>' +
    (list.length ? '<div class="grid">' + list.map(pinHTML).join('') + '</div>' : '<p class="empty-q">' + esc(t.noResults) + '</p>') + gridNotes(list) +
    '<section class="biz"><div class="row"><span class="kicker">' + esc(t.bizKicker) + '</span><span class="tag">' + esc(t.bizTag) + '</span></div><h2>' + esc(t.bizTitle) + '</h2><p>' + esc(t.bizBody) + '</p>' + biz + '</section>';
}

// ===================== FICHA =====================
function detailHTML() {
  var t = STR[S.lang], L = S.lang, key = S.detail, k = key.split(':')[0], id = key.split(':')[1], on = isSaved(key);
  var saveBtn = '<button type="button" class="btn save" data-toggle="' + key + '" aria-pressed="' + on + '">' + ICON.heart + esc(on ? t.saved : t.save) + '</button>';
  var star = false, hist = false, h = '<button type="button" class="btn" style="align-self:flex-start" data-back>' + ICON.back + esc(t.back) + '</button>';
  function head(glyph, kicker, title, body) {
    return (glyph !== null ? '<div class="d-img"><span class="glyph" aria-hidden="true">' + esc(glyph) + '</span></div>' : '') +
      '<section class="d-body"><span class="k">' + esc(kicker) + '</span><h1>' + esc(title) + '</h1>' + (body ? '<p>' + esc(body) + '</p>' : '');
  }
  function recBy(list) {
    if (!list || !list.length) return '';
    return '<div class="recby"><h3>' + esc(t.recBy) + '</h3>' + list.map(function (g) { return '<button type="button" class="btn g-' + g + '" data-talk="' + g + '"><span class="av">' + G[g].ini + '</span>' + esc(t.askTo + ' ' + G[g].name) + '</button>'; }).join('') + '</div>';
  }
  if (k === 'r') {
    var r = ROUTES[id]; hist = true;
    h += head(r.stops.length, r.kicker[L], r.title[L] + ' †', r.intro[L]) +
      '<div class="actions"><a class="btn solid" href="' + routeUrl(r.stops) + '" target="_blank" rel="noopener">' + ICON.nav + esc(t.full) + '</a>' + saveBtn + '</div></section>' +
      '<div class="list">' + r.stops.map(function (sid) { return '<button type="button" class="rlink" data-open="p:' + sid + '">' + esc(P[sid].name) + ICON.arrow + '</button>'; }).join('') + '</div>' + recBy(r.g);
  } else if (k === 'p') {
    var p = P[id]; hist = !!p.hist;
    var routes = Object.keys(ROUTES).filter(function (rid) { return ROUTES[rid].stops.indexOf(id) >= 0; });
    h += head(p.name.charAt(0), t.place[p.cat], p.name + marks(p), p.why[L]) + '<p class="d-addr">' + esc(p.addr || t.addrPending) + '</p>' +
      '<div class="actions">' + (p.addr ? '<a class="btn solid" href="' + mapsUrl(p) + '" target="_blank" rel="noopener">' + ICON.nav + esc(t.openMaps) + '</a>' : '') + saveBtn + '</div></section>' +
      recBy(p.g) +
      (routes.length ? '<div class="recby"><h3>' + esc(t.inRoutes) + '</h3>' + routes.map(function (rid) { return '<button type="button" class="rlink" data-open="r:' + rid + '">' + esc(ROUTES[rid].title[L]) + ICON.arrow + '</button>'; }).join('') + '</div>' : '');
  } else if (k === 'c') {
    star = true;
    h += head('20', t.collection, t.nawalsTitle + ' *', t.nawalsIntro) + '<div class="actions">' + saveBtn + '</div></section><p class="warn">' + esc(t.nawalWarn) + '</p>' +
      '<div class="list">' + NAWALES.map(function (row) { var nw = N[row[0]]; return '<button type="button" class="rlink" data-open="n:' + row[0] + '"><span>' + nw.n + ' · ' + esc(nw.name) + ' <span style="font-weight:400;color:var(--ink-3)">— ' + esc(nw.animal[L]) + '</span></span>' + ICON.arrow + '</button>'; }).join('') + '</div>';
  } else if (k === 'n') {
    var nw = N[id]; star = true;
    h += head(nw.n, t.nawal + ' ' + nw.n + ' / 20', nw.name + ' *', GUARDIAN_NAWAL[id] ? t.nGuardian : '') + '<div class="actions">' + saveBtn + '</div></section>' +
      '<dl class="facts">' + [[t.nSymbol, nw.symbol], [t.nAnimal, nw.animal], [t.nLight, nw.light], [t.nShadow, nw.shadow]].map(function (f) { return '<div class="fact"><dt>' + esc(f[0]) + '</dt><dd>' + esc(f[1][L]) + '</dd></div>'; }).join('') + '</dl>' +
      '<p class="warn">' + esc(t.nawalWarn) + '</p>' + (GUARDIAN_NAWAL[id] ? recBy([id]) : '') +
      '<button type="button" class="rlink" data-open="c:nawales">' + esc(t.nawalsTitle) + ICON.arrow + '</button>';
  } else {
    var tp = TIPS[id]; star = !!tp.star;
    h += head(null, t.tip, tp.body[L] + marks(tp), '') + '<div class="actions">' + saveBtn + '</div></section>' + recBy(tp.g);
  }
  return h + notesHTML(star, hist) + '<p class="respect">' + esc(t.respect) + '</p>';
}

// ===================== PARA VOS =====================
function planIds() {
  var pool = [];
  S.saved.forEach(function (key) { var k = key.split(':')[0], id = key.split(':')[1]; if (k === 'p') pool.push(id); if (k === 'r') ROUTES[id].stops.forEach(function (s) { pool.push(s); }); });
  var used = {}, pref = S.pref;
  function pick(cat) {
    var ok = function (x) { return P[x].cat === cat && !used[x] && P[x].addr; };
    var id = pool.filter(ok)[0] || Object.keys(P).filter(ok)[0];
    if (id) used[id] = true; return id;
  }
  var a = (pref.cafe || 0) >= (pref.comida || 0) ? 'cafe' : 'comida', b = a === 'cafe' ? 'comida' : 'cafe';
  var seq = ['cultura', a, 'cultura', (pref.cultura || 0) > (pref.cafe || 0) + (pref.comida || 0) ? 'cultura' : a, b];
  return seq.map(pick).filter(Boolean);
}
function paraHTML() {
  var t = STR[S.lang], saved = FEED.concat(['t:calles', 't:nawalpersona']).filter(isSaved).map(pinOf);
  var h = '<div class="pagehead"><h1>' + esc(t.paraTitle) + '</h1><p>' + esc(t.paraSub) + '</p></div>';
  if (!saved.length) return h + '<div class="emptybox"><b>' + esc(t.emptyTitle) + '</b><span>' + esc(t.emptyBody) + '</span><button type="button" class="btn solid" data-tab="feed">' + esc(t.explore) + '</button></div>';
  var ids = planIds(), pref = S.pref;
  var top = ['cultura', 'cafe', 'comida'].sort(function (x, y) { return (pref[y] || 0) - (pref[x] || 0); })[0];
  h += '<div class="plan"><span class="k">' + esc(t.yourPlan) + '</span><h2>' + esc(t.yourPlanTitle) + '</h2><p>' + esc(t.because(saved.length, t.place[top].toLowerCase())) + '</p><ol>' +
    ids.map(function (id, i) { var p = P[id]; return '<li><button type="button" data-open="p:' + id + '"><span class="num">' + (i + 1) + '</span><span><b>' + esc(p.name) + '</b><small>' + esc(t.place[p.cat]) + '</small></span></button></li>'; }).join('') +
    '</ol>' + (ids.length > 1 ? '<a class="btn solid" href="' + routeUrl(ids) + '" target="_blank" rel="noopener">' + ICON.nav + esc(t.full) + '</a>' : '') + '</div>';
  return h + '<h3 class="saved-h">' + esc(t.savedTitle) + '</h3><div class="grid">' + saved.map(pinHTML).join('') + '</div>' + gridNotes(saved);
}

// ===================== DIBUJAR =====================
var main = document.getElementById('main');
function render(scrollChat) {
  var t = STR[S.lang], onGuia = S.tab === 'guia';
  document.documentElement.lang = S.lang;
  ['es', 'en'].forEach(function (l) { document.getElementById('lang-' + l).setAttribute('aria-pressed', String(S.lang === l)); });
  document.getElementById('tagline').textContent = t.tagline;
  document.getElementById('hint').textContent = t.hint;
  document.getElementById('wheel-wrap').hidden = !onGuia;
  document.getElementById('hdr').className = onGuia ? 'line' : '';
  document.getElementById('dock').hidden = !onGuia;
  main.className = onGuia ? 'chatpad' : '';
  document.getElementById('q').placeholder = t.placeholder;
  document.getElementById('send').setAttribute('aria-label', t.send);
  document.getElementById('ask').className = 'g-' + S.guide;
  document.getElementById('wheel').innerHTML = ORDER.map(function (id) {
    var g = G[id];
    return '<button type="button" class="wg g-' + id + '" data-g="' + id + '" aria-current="' + (id === S.guide) + '" aria-label="' + esc(t.talk + ' ' + g.name + ' · ' + g.value[S.lang]) + '"><span class="av">' + g.ini + '</span><small>' + esc(g.name) + '</small></button>';
  }).join('');
  document.getElementById('chips').innerHTML = '<button type="button" class="chip switch" data-next>' + esc(t.switchChip) + '</button>' +
    t.chips.map(function (c) { return '<button type="button" class="chip" data-chip="' + c[0] + '">' + esc(c[1]) + '</button>'; }).join('');
  var tabOn = S.tab === 'detail' ? S.prev : S.tab;
  [['guia', ICON.chat, t.tabGuia], ['feed', ICON.grid, t.tabFeed], ['para', ICON.heart, t.tabPara + (S.saved.length ? ' · ' + S.saved.length : '')]].forEach(function (d) {
    var b = document.getElementById('tab-' + d[0]); b.innerHTML = d[1] + esc(d[2]);
    if (tabOn === d[0]) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  var hadFocus = document.activeElement && document.activeElement.id === 'fq', caret = hadFocus ? document.activeElement.selectionStart : 0;
  if (onGuia) {
    main.innerHTML = guiaHTML(scrollChat) + '<p class="foot">' + esc(t.foot) + ' · <button type="button" class="linkbtn" data-who>' + esc(t.who) + '</button></p>';
    if (scrollChat) { var msgs = main.querySelectorAll('.msg'); var target = msgs[Math.max(0, msgs.length - 2)]; if (target) target.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
  } else if (S.tab === 'feed') main.innerHTML = feedHTML() + '<p class="foot">' + esc(t.foot) + '</p>';
  else if (S.tab === 'para') main.innerHTML = paraHTML();
  else main.innerHTML = detailHTML();
  if (hadFocus) { var fi = document.getElementById('fq'); if (fi) { fi.focus(); try { fi.setSelectionRange(caret, caret); } catch (e) {} } }
}
function go(tab) { S.tab = tab; S.detail = null; render(false); window.scrollTo(0, tab === 'guia' ? document.body.scrollHeight : 0); }
function open(key) {
  if (S.tab !== 'detail') S.prev = S.tab;
  S.detail = key; S.tab = 'detail'; bump(key, 1); persist(); render(false); window.scrollTo(0, 0);
}

document.getElementById('ask').addEventListener('submit', function (e) { e.preventDefault(); var i = document.getElementById('q'); ask(i.value); i.value = ''; });
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-toggle],[data-open],[data-filter],[data-tab],[data-back],[data-lang],[data-chip],[data-next],[data-g],[data-talk],[data-who],[data-close]');
  if (!el) return;
  if (el.hasAttribute('data-toggle')) { e.stopPropagation(); toggle(el.getAttribute('data-toggle')); return; }
  if (el.hasAttribute('data-open')) { open(el.getAttribute('data-open')); return; }
  if (el.hasAttribute('data-filter')) { var f = el.getAttribute('data-filter'); S.filter = f; if (S.pref[f] !== undefined) S.pref[f]++; persist(); render(false); return; }
  if (el.hasAttribute('data-tab')) { go(el.getAttribute('data-tab')); return; }
  if (el.hasAttribute('data-back')) { go(S.prev || 'feed'); return; }
  if (el.hasAttribute('data-lang')) { S.lang = el.getAttribute('data-lang'); persist(); render(false); return; }
  if (el.hasAttribute('data-chip')) { var c = STR[S.lang].chips.filter(function (x) { return x[0] === el.getAttribute('data-chip'); })[0]; ask(c[1]); return; }
  if (el.hasAttribute('data-next')) { switchTo(ORDER[(ORDER.indexOf(S.guide) + 1) % 4]); render(true); return; }
  if (el.hasAttribute('data-g')) { var id = el.getAttribute('data-g'); if (id !== S.guide) { switchTo(id); render(true); } return; }
  if (el.hasAttribute('data-talk')) { var gt = el.getAttribute('data-talk'); S.tab = 'guia'; S.detail = null; if (gt !== S.guide) switchTo(gt); render(true); return; }
  if (el.hasAttribute('data-who')) { openDlg(); return; }
  if (el.hasAttribute('data-close')) document.getElementById('dlg').close();
});
document.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.pin[data-open]')) { e.preventDefault(); open(e.target.getAttribute('data-open')); } });
document.addEventListener('input', function (e) { if (e.target.id === 'fq') { S.query = e.target.value; render(false); } });

function openDlg() {
  var t = STR[S.lang], L = S.lang;
  document.getElementById('dlg-body').innerHTML = '<h2>' + esc(t.dlgTitle) + '</h2><p>' + esc(t.dlgIntro) + '</p>' +
    ORDER.map(function (id) { var g = G[id]; return '<div class="gcard g-' + id + '"><span class="av">' + g.ini + '</span><div><b>' + esc(g.name) + '</b><dl>' +
      [[t.dValue, g.value[L] + ' *'], [t.dRole, g.role[L]], [t.dSpeaks, g.speaks[L]], [t.dRecs, g.recs[L]], [t.dPdf, g.pdf[L]]].map(function (r) { return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') +
      '</dl></div></div>'; }).join('') + '<button type="button" class="btn solid close" data-close>' + esc(t.close) + '</button>';
  var d = document.getElementById('dlg'); if (d.showModal) d.showModal(); else d.setAttribute('open', '');
}

S.msgs.push({ from: 'batz', kind: 'welcome', intro: true });
render(false);
})();
</script>
