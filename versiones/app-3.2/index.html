<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nAIhual</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* =====================================================================
   nAIhual 3.2 · sistema visual (tokens). Cambiar un token cambia toda la app.
   Concepto: Antigua en piedra, cal y basalto. Muros encalados (fondo), basalto volcánico (tinta),
   añil de fachada (acento de rutas y enlaces) y los cuatro colores de los guardianes por rumbo*.
   Layout: app de celular en una columna (máx. 560px). Cada pantalla abre con una imagen, un mapa o una ilustración.
   ===================================================================== */
:root {
  /* color · base */
  --cal: #f3f1ec; --papel: #ffffff; --piedra: #e7e3db; --piedra-2: #d8d2c6;
  --basalto: #1d2125; --ink-2: #474c52; --ink-3: #62676d;
  --line: rgba(29,33,37,.12); --line-2: rgba(29,33,37,.22);
  --anil: #2f4b7c; --anil-soft: #dfe5f0; --on-anil: #ffffff;
  --band: #1d2125; --band-ink: #f3f1ec; --band-muted: rgba(243,241,236,.66);
  --tint-cafe: #f1dfbd; --tint-comida: #efd3c6; --tint-cultura: #d9e1ee;
  --cielo-1: #f6d9b8; --cielo-2: #c9d4e3; --volcan: #6f7d8f; --volcan-2: #4f5b6b; --techo: #b4664b;
  /* color · estados */
  --heart: #b4462f; --ok: #2f6b4f; --ok-soft: #dcebe2;
  --check: #8a5a14; --check-soft: #f5ead2;        /* por verificar (solo vista previa) */
  --sponsor-bg: #efe3c8; --sponsor-ink: #4d3a10;  /* Patrocinado · Aliado Fundador */
  --future-bg: #e6e3f0; --future-ink: #3c3561;    /* diseño futuro / no activo */
  /* color · guardianes (color por rumbo*, pendiente de validación cultural) */
  --g-noj: #b3402f; --g-iq: #ffffff; --g-kej: #23262a; --g-e: #e2b33c;
  --g-noj-on: #ffffff; --g-iq-on: #1d2125; --g-kej-on: #ffffff; --g-e-on: #1d2125;
  --g-noj-soft: #f5e1dc; --g-iq-soft: #ffffff; --g-kej-soft: #e3e3e1; --g-e-soft: #f7ecce;
  /* tipografía: títulos con carácter, texto legible, datos y calles en monoespaciada */
  --f-display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --t-2xs: 11px; --t-xs: 12px; --t-sm: 13.5px; --t-base: 15.5px; --t-md: 17px; --t-lg: 21px; --t-xl: 28px; --t-2xl: 38px;
  --lh-tight: 1.08; --lh-snug: 1.25; --lh-body: 1.5;
  /* espacio (múltiplos de 4) y forma */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-7: 32px; --s-8: 44px;
  --r-sm: 10px; --r-md: 16px; --r-lg: 24px; --r-xl: 32px; --r-pill: 999px;
  --tap: 44px;
  --shadow-1: 0 1px 2px rgba(20,24,28,.06), 0 6px 18px rgba(20,24,28,.06);
  --shadow-2: 0 10px 30px rgba(20,24,28,.16);
  /* movimiento */
  --ease: cubic-bezier(.2,.7,.2,1); --dur-1: .18s; --dur-2: .35s; --dur-route: 1.4s;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --cal: #121518; --papel: #1b1f23; --piedra: #262b30; --piedra-2: #333940;
  --basalto: #eceae4; --ink-2: #c3c1ba; --ink-3: #9c9a93;
  --line: rgba(236,234,228,.13); --line-2: rgba(236,234,228,.24);
  --anil: #93acdb; --anil-soft: #222c3d; --on-anil: #121518;
  --band: #07090a; --band-ink: #eceae4; --band-muted: rgba(236,234,228,.6);
  --tint-cafe: #3a2f1c; --tint-comida: #3a2620; --tint-cultura: #1f2a3b;
  --cielo-1: #2a2d3f; --cielo-2: #141a26; --volcan: #3a4352; --volcan-2: #2a313c; --techo: #6b3d2f;
  --heart: #ef8a70; --ok: #8fcaa9; --ok-soft: #1d2e26; --check: #e7bd6a; --check-soft: #33291a;
  --sponsor-bg: #3a2f17; --sponsor-ink: #f0d79c; --future-bg: #2a2740; --future-ink: #cfc8f3;
  --g-noj: #e07a68; --g-iq: #f3f2ef; --g-kej: #0b0c0d; --g-e: #e5b94a;
  --g-noj-on: #121518; --g-iq-on: #121518; --g-kej-on: #eceae4; --g-e-on: #121518;
  --g-noj-soft: #3a221d; --g-iq-soft: #2c2f33; --g-kej-soft: #0e1012; --g-e-soft: #362b13;
  --shadow-1: 0 1px 2px rgba(0,0,0,.5); --shadow-2: 0 10px 30px rgba(0,0,0,.5);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --cal: #121518; --papel: #1b1f23; --piedra: #262b30; --piedra-2: #333940;
  --basalto: #eceae4; --ink-2: #c3c1ba; --ink-3: #9c9a93;
  --line: rgba(236,234,228,.13); --line-2: rgba(236,234,228,.24);
  --anil: #93acdb; --anil-soft: #222c3d; --on-anil: #121518;
  --band: #07090a; --band-ink: #eceae4; --band-muted: rgba(236,234,228,.6);
  --tint-cafe: #3a2f1c; --tint-comida: #3a2620; --tint-cultura: #1f2a3b;
  --cielo-1: #2a2d3f; --cielo-2: #141a26; --volcan: #3a4352; --volcan-2: #2a313c; --techo: #6b3d2f;
  --heart: #ef8a70; --ok: #8fcaa9; --ok-soft: #1d2e26; --check: #e7bd6a; --check-soft: #33291a;
  --sponsor-bg: #3a2f17; --sponsor-ink: #f0d79c; --future-bg: #2a2740; --future-ink: #cfc8f3;
  --g-noj: #e07a68; --g-iq: #f3f2ef; --g-kej: #0b0c0d; --g-e: #e5b94a;
  --g-noj-on: #121518; --g-iq-on: #121518; --g-kej-on: #eceae4; --g-e-on: #121518;
  --g-noj-soft: #3a221d; --g-iq-soft: #2c2f33; --g-kej-soft: #0e1012; --g-e-soft: #362b13;
  --shadow-1: 0 1px 2px rgba(0,0,0,.5); --shadow-2: 0 10px 30px rgba(0,0,0,.5);
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--cal); color: var(--basalto); font-family: var(--f-body); font-size: var(--t-base); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 700; letter-spacing: -.02em; line-height: var(--lh-tight); text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
svg { display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--anil); outline-offset: 2px; border-radius: 6px; }
.eyebrow { font-family: var(--f-data); font-size: var(--t-2xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.sm { width: 16px; height: 16px; }

/* ---------- estructura ---------- */
.app { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; background: color-mix(in srgb, var(--cal) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); padding-block: 10px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--cal); }
.wordmark { all: unset; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.03em; }
.wordmark i { font-style: normal; color: var(--anil); }
.top-actions { display: flex; align-items: center; gap: var(--s-2); }
.seg { display: flex; padding: 2px; border-radius: var(--r-pill); background: var(--piedra); }
.seg button { border: 0; cursor: pointer; min-width: 44px; min-height: 44px; padding: 0 10px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 700; background: transparent; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--papel); color: var(--basalto); box-shadow: var(--shadow-1); }
.sos { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: var(--r-pill); border: 1.5px solid var(--heart); color: var(--heart); background: transparent; font-weight: 700; font-size: 13px; cursor: pointer; }
main { flex: 1; display: flex; flex-direction: column; gap: var(--s-6); padding-block: var(--s-2) 120px; min-width: 0; }
main.chat { padding-bottom: 230px; gap: var(--s-4); }
@media (prefers-reduced-motion: no-preference) { main.enter > * { animation: rise var(--dur-2) var(--ease) both; } main.enter > *:nth-child(2) { animation-delay: .04s; } main.enter > *:nth-child(3) { animation-delay: .08s; } main.enter > *:nth-child(n+4) { animation-delay: .12s; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@media (prefers-reduced-motion: no-preference) { .msg.new { animation: rise var(--dur-2) var(--ease) both; } }

/* ---------- navegación inferior ---------- */
nav.tabs { position: fixed; z-index: 9; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: min(480px, calc(100% - 24px));
  display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 2px; padding: 6px; border-radius: var(--r-xl); background: var(--band); box-shadow: var(--shadow-2); }
nav.tabs button { border: 0; cursor: pointer; min-height: 52px; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: transparent; color: var(--band-muted); font-size: 11.5px; font-weight: 700; }
nav.tabs button[aria-current="page"] { background: var(--band-ink); color: var(--band); }
nav.tabs .count { font-family: var(--f-data); font-size: 10px; }

/* ---------- botones y chips ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: var(--tap); padding: 0 18px; border-radius: var(--r-pill); border: 1px solid var(--line-2); background: var(--papel); color: var(--basalto); font-weight: 700; font-size: 14.5px; text-decoration: none; cursor: pointer; }
.btn.primary { background: var(--basalto); color: var(--cal); border-color: transparent; }
.btn.anil { background: var(--anil); color: var(--on-anil); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.big { min-height: 58px; font-size: 17px; border-radius: 20px; padding: 0 22px; }
.btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: var(--r-pill); border: 1px solid var(--line-2); background: var(--papel); color: var(--basalto); font-size: 14px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--basalto); color: var(--cal); border-color: transparent; }
.chip.pilot { background: var(--anil); color: var(--on-anil); border-color: transparent; }
.chip.switch { border-style: dashed; }
.chips { display: flex; gap: var(--s-2); overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.heart { position: absolute; top: 10px; right: 10px; z-index: 2; width: 44px; height: 44px; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer; background: color-mix(in srgb, var(--papel) 92%, transparent); box-shadow: var(--shadow-1); color: var(--heart); }
.heart[aria-pressed="true"] .ico { fill: var(--heart); }
.btn .ico.fill, .heart .ico { stroke: var(--heart); }

/* ---------- etiquetas, sello e información ---------- */
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: var(--r-pill); font-size: var(--t-2xs); font-weight: 700; letter-spacing: .02em; background: var(--piedra); color: var(--ink-2); white-space: nowrap; }
.tag.check { background: var(--check-soft); color: var(--check); border: 1px dashed currentColor; }
.tag.sp { background: var(--sponsor-bg); color: var(--sponsor-ink); }
.tag.future { background: var(--future-bg); color: var(--future-ink); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
details.seal, details.info { font-size: var(--t-sm); }
details.seal summary, details.info summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; }
details.seal summary::-webkit-details-marker, details.info summary::-webkit-details-marker { display: none; }
details.seal summary { padding: 4px 12px; border-radius: var(--r-pill); font-weight: 700; font-size: 12.5px; }
details.seal.ok summary { background: var(--ok-soft); color: var(--ok); }
details.seal.pending summary { background: var(--check-soft); color: var(--check); border: 1px dashed currentColor; }
details.seal p, details.info p { margin-top: 6px; color: var(--ink-2); font-size: 13px; }
details.info summary { width: 44px; height: 44px; justify-content: center; border-radius: 50%; color: var(--ink-3); border: 1px solid var(--line-2); background: var(--papel); }
details.info[open] { flex-basis: 100%; }

/* ---------- imagen de lugar (foto o espacio provisional) ---------- */
.ph { position: relative; overflow: hidden; border-radius: var(--r-lg); background: var(--piedra); aspect-ratio: 4 / 3; max-width: 100%; }
.ph svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.ph .ph-note { position: absolute; left: 10px; bottom: 10px; font-family: var(--f-data); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: var(--r-pill); background: color-mix(in srgb, var(--papel) 85%, transparent); color: var(--ink-3); }
.ph .ph-cat { position: absolute; left: 10px; top: 10px; }

/* ---------- inicio ---------- */
.hero { position: relative; margin: 0 -16px; padding: 0 16px; display: flex; flex-direction: column; gap: var(--s-4); }
.hero-art { position: relative; border-radius: var(--r-xl); overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; background: var(--cielo-2); }
.hero-art svg { width: 100%; height: 100%; }
.hero-copy { position: absolute; left: 0; right: 0; bottom: 0; padding: var(--s-5); display: flex; flex-direction: column; gap: 6px; }
.hero-copy h1 { font-size: clamp(26px, 8vw, var(--t-2xl)); color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,.35); max-width: 15ch; }
.hero-copy p { color: rgba(255,255,255,.92); font-weight: 600; text-shadow: 0 1px 10px rgba(0,0,0,.4); }
.cta-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s-2); }
.sec { display: flex; flex-direction: column; gap: var(--s-3); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); }
.sec-head h2 { font-size: var(--t-lg); }
.linkish { all: unset; cursor: pointer; display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; font-size: var(--t-sm); font-weight: 700; color: var(--anil); }
.rail { display: flex; gap: var(--s-3); overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px 6px; }
.rail::-webkit-scrollbar { display: none; }
.route-card { all: unset; box-sizing: border-box; cursor: pointer; scroll-snap-align: start; flex: none; width: min(78vw, 300px); display: flex; flex-direction: column; border-radius: var(--r-lg); background: var(--papel); border: 1px solid var(--line); overflow: hidden; }
.route-card .map { aspect-ratio: 1 / .78; }
.route-card .rc-body { padding: var(--s-3) var(--s-4) var(--s-4); display: flex; flex-direction: column; gap: 4px; }
.route-card .rc-title { font-family: var(--f-display); font-weight: 700; letter-spacing: -.02em; font-size: var(--t-md); line-height: 1.15; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3); }
.tile { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; gap: var(--s-5); min-height: 128px; padding: var(--s-4); border-radius: var(--r-lg); background: var(--papel); border: 1px solid var(--line); }
.tile .ico { width: 26px; height: 26px; color: var(--anil); }
.tile b { font-family: var(--f-display); font-size: var(--t-md); letter-spacing: -.01em; line-height: 1.15; }
.tile small { display: block; color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.guard-strip { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: var(--s-2); }
.gbtn { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: var(--s-3) 4px; border-radius: var(--r-md); text-align: center; }
.gbtn b { font-family: var(--f-display); font-size: 15px; }
.gbtn small { font-size: 11.5px; color: var(--ink-3); line-height: 1.25; }
.gbtn[aria-current="true"] { background: var(--papel); box-shadow: var(--shadow-1); }
.tag.like { background: var(--g-noj-soft); color: var(--basalto); }
.intro-card { display: flex; flex-direction: column; gap: 6px; padding: var(--s-5); border-radius: var(--r-xl); background: var(--band); color: var(--band-ink); }
.intro-card h2 { font-size: var(--t-lg); }
.intro-card p { color: var(--band-muted); font-size: 14.5px; }
.brujula { display: grid; gap: var(--s-3); }
.brujula .art { background: var(--papel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 8px; }
.brujula .art > svg { display: block; width: 100%; height: auto; max-width: 420px; margin: 0 auto; }
.brujula .note { font-size: 12.5px; }
.bru-row { display: flex; flex-wrap: wrap; gap: 8px; }
.bru-test { width: 100%; border-collapse: collapse; font-size: 13px; }
.bru-test th, .bru-test td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.beta-card { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: var(--r-md); border: 1.5px dashed var(--line-2); background: var(--papel); }
.beta-card .row { display: flex; flex-wrap: wrap; gap: 8px; }
.bform { display: flex; flex-direction: column; gap: 10px; }
.bform label { display: flex; flex-direction: column; gap: 4px; font-size: var(--t-sm); font-weight: 600; color: var(--ink-2); }
.bform input[type=text], .bform input[type=url], .bform select, .bform textarea { font: inherit; font-size: 16px; font-weight: 400; color: var(--basalto); background: var(--papel); border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 10px 12px; min-height: 44px; width: 100%; }
.bform textarea { min-height: 76px; resize: vertical; }
.bform .check { flex-direction: row; align-items: center; gap: 10px; min-height: 44px; }
.bform .check input { width: 22px; height: 22px; }
.bitem { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: var(--r-md); background: var(--papel); border: 1px solid var(--line); }
.bitem small { color: var(--ink-3); font-family: var(--f-data); font-size: 11.5px; }
.biz { display: flex; flex-direction: column; gap: 10px; padding: var(--s-5); border-radius: var(--r-xl); background: var(--band); color: var(--band-ink); }
.biz h2 { font-size: var(--t-lg); }
.biz p { color: var(--band-muted); font-size: 14.5px; }
.biz .tag { background: var(--band-ink); color: var(--band); align-self: flex-start; }
.biz .btn { align-self: flex-start; background: var(--band-ink); color: var(--band); border-color: transparent; }
.foot { font-size: 11.5px; color: var(--ink-3); text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.foot .linkbtn { border: 0; background: none; padding: 12px 8px; min-height: 44px; cursor: pointer; text-decoration: underline; color: var(--ink-3); font-size: 12px; }

/* ---------- retrato abstracto de guardián (espacio para el arte final del fundador) ---------- */
.portrait { flex: none; display: block; border-radius: 50%; }
