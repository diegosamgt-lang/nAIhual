<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nAIhual</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* ======================================================================
   SISTEMA VISUAL nAIhual v0.1 — base para la etapa gráfica.
   Neutro y provisional: el fundador define el arte final. Cambiar aquí los tokens cambia toda la app.
   Layout: app de celular en una columna (máx. 520px), guía arriba, barra de pestañas flotante abajo.
   ====================================================================== */
:root {
  /* Color · neutros cálidos (piedra y cal), sin acento de marca todavía */
  --bg: #f3f2ef; --surface: #ffffff; --sunk: #e8e6e1;
  --ink: #1b1b1a; --ink-2: #4a4945; --ink-3: #6a6863;
  --line: rgba(27,27,26,.12);
  --band: #1b1b1a; --band-ink: #f3f2ef; --band-muted: #c9c6be;
  /* Color · estados con significado */
  --heart: #b4462f;            /* guardado ♥ */
  --star: #8a4b2a;             /* * cultural, pendiente de validación */
  --hist: #4f6340;             /* † histórico, pendiente de fuente oficial */
  --review: #6a6863;           /* en revisión */
  --sponsor-bg: #efe3c8; --sponsor-ink: #4d3a10;  /* Patrocinado · Aliado Fundador */
  --future-bg: #e6e3f0; --future-ink: #3c3561;    /* diseño futuro / no activo */
  /* Color por rumbo* (pendiente de validación cultural): No'j rojo · Iq' blanco · Kej negro · E' amarillo */
  --g-noj: #a63d2f; --g-iq: #ffffff; --g-kej: #2b2a27; --g-e: #e0b23a;
  --g-noj-on: #ffffff; --g-iq-on: #1b1b1a; --g-kej-on: #ffffff; --g-e-on: #1b1b1a;
  --g-noj-soft: #f4e0db; --g-iq-soft: #ffffff; --g-kej-soft: #e4e2dd; --g-e-soft: #f6ebcd;
  /* Tipografía · una familia por ahora; los tres papeles quedan separados para la etapa gráfica */
  --font-display: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --t-xs: 12px; --t-sm: 13.5px; --t-base: 15.5px; --t-md: 17px; --t-lg: 21px; --t-xl: 27px;
  --lh-tight: 1.15; --lh-body: 1.5;
  --w-reg: 400; --w-med: 500; --w-semi: 600; --w-bold: 700;
  --track-label: .07em;
  /* Espacio (múltiplos de 4) */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-7: 32px;
  /* Forma */
  --r-sm: 12px; --r-md: 18px; --r-lg: 26px; --r-pill: 999px;
  --tap: 44px;                 /* tamaño mínimo de un control táctil */
  --shadow: 0 1px 2px rgba(0,0,0,.08), 0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161615; --surface: #222220; --sunk: #2c2c29;
  --ink: #efede8; --ink-2: #c9c6be; --ink-3: #9d9a92;
  --line: rgba(239,237,232,.14);
  --band: #0c0c0b; --band-ink: #efede8; --band-muted: #9d9a92;
  --heart: #ef8a70; --star: #e59b72; --hist: #a9c08f; --review: #9d9a92;
  --sponsor-bg: #3a2f17; --sponsor-ink: #f0d79c; --future-bg: #2a2740; --future-ink: #cfc8f3;
  --g-noj: #e07a68; --g-iq: #f3f2ef; --g-kej: #0c0c0b; --g-e: #e5b94a;
  --g-noj-on: #161615; --g-iq-on: #161615; --g-kej-on: #efede8; --g-e-on: #161615;
  --g-noj-soft: #3a221d; --g-iq-soft: #2e2e2b; --g-kej-soft: #0f0f0e; --g-e-soft: #362b13;
  --shadow: 0 1px 2px rgba(0,0,0,.5);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #161615; --surface: #222220; --sunk: #2c2c29;
  --ink: #efede8; --ink-2: #c9c6be; --ink-3: #9d9a92;
  --line: rgba(239,237,232,.14);
  --band: #0c0c0b; --band-ink: #efede8; --band-muted: #9d9a92;
  --heart: #ef8a70; --star: #e59b72; --hist: #a9c08f; --review: #9d9a92;
  --sponsor-bg: #3a2f17; --sponsor-ink: #f0d79c; --future-bg: #2a2740; --future-ink: #cfc8f3;
  --g-noj: #e07a68; --g-iq: #f3f2ef; --g-kej: #0c0c0b; --g-e: #e5b94a;
  --g-noj-on: #161615; --g-iq-on: #161615; --g-kej-on: #efede8; --g-e-on: #161615;
  --g-noj-soft: #3a221d; --g-iq-soft: #2e2e2b; --g-kej-soft: #0f0f0e; --g-e-soft: #362b13;
  --shadow: 0 1px 2px rgba(0,0,0,.5);
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: var(--t-base); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); text-wrap: balance; letter-spacing: -.01em; line-height: var(--lh-tight); }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--ink-3); outline-offset: 2px; }
[hidden] { display: none !important; }
svg { display: block; }
.k { font-size: var(--t-xs); font-weight: var(--w-bold); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--ink-3); }

/* ---------- estructura ---------- */
.app { max-width: 520px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--bg); padding-block: 14px 10px; display: flex; flex-direction: column; gap: var(--s-3); }
header.line { border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
.brand { all: unset; cursor: pointer; display: flex; flex-direction: column; }
.brand b { font-family: var(--font-display); font-size: var(--t-lg); letter-spacing: -.01em; }
.brand span { font-size: var(--t-xs); color: var(--ink-3); }
.seg { display: flex; gap: 2px; padding: 3px; border-radius: var(--r-pill); background: var(--sunk); }
.seg button { border: 0; cursor: pointer; padding: 6px 12px; border-radius: var(--r-pill); font-size: 13px; font-weight: var(--w-semi); background: transparent; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
main { flex: 1; padding-block: var(--s-4) 140px; display: flex; flex-direction: column; gap: var(--s-4); min-width: 0; }
main.chatpad { padding-bottom: 260px; }

/* ---------- guardianes ---------- */
.av { flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: var(--w-bold); color: var(--go); background: var(--gc); box-shadow: inset 0 0 0 1px var(--line); }
.g-noj { --gc: var(--g-noj); --go: var(--g-noj-on); --gs: var(--g-noj-soft); }
.g-iq { --gc: var(--g-iq); --go: var(--g-iq-on); --gs: var(--g-iq-soft); }
.g-kej { --gc: var(--g-kej); --go: var(--g-kej-on); --gs: var(--g-kej-soft); }
.g-e { --gc: var(--g-e); --go: var(--g-e-on); --gs: var(--g-e-soft); }
.wheel { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
.wg { border: 0; cursor: pointer; background: transparent; border-radius: 14px; padding: 6px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: var(--s-1); position: relative; }
.wg .av { width: 40px; height: 40px; font-size: 16px; opacity: .45; transition: opacity .2s, transform .2s; }
.wg small { font-size: var(--t-xs); font-weight: var(--w-semi); color: var(--ink-3); }
.wg[aria-current="true"] .av { opacity: 1; transform: scale(1.08); }
.wg[aria-current="true"] small { color: var(--ink); }
.wg[aria-current="true"]::after { content: ""; position: absolute; bottom: 0; width: 18px; height: 3px; border-radius: 3px; background: var(--ink); }
.hint { font-size: var(--t-xs); color: var(--ink-3); text-align: center; margin: -4px 0 0; }

/* ---------- chat ---------- */
.msg { display: flex; flex-direction: column; gap: var(--s-2); min-width: 0; scroll-margin-top: 190px; }
.who { display: flex; align-items: center; gap: 10px; }
.who .av { width: 34px; height: 34px; font-size: 14px; }
.who b { font-size: 14.5px; }
.who em { font-style: normal; font-size: var(--t-xs); color: var(--ink-3); }
.bubble { background: var(--gs); border: 1px solid var(--line); border-radius: 4px var(--s-5) var(--s-5) var(--s-5); padding: 13px var(--s-4); text-wrap: pretty; }
.bubble p + p { margin-top: var(--s-2); }
.me { align-self: flex-end; max-width: 85%; background: var(--ink); color: var(--bg); border-radius: var(--s-5) 4px var(--s-5) var(--s-5); padding: 10px 15px; }
.cards { display: flex; flex-direction: column; gap: var(--s-2); }
.choices { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.notes { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }
.note-star { color: var(--star); } .note-hist { color: var(--hist); } .note-muted { color: var(--ink-3); }

/* ---------- componentes ---------- */
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px var(--s-4); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card .k, .card h3 { padding-right: 44px; }
.card h3 { font-size: var(--t-md); line-height: 1.25; }
.card p { font-size: 14.5px; color: var(--ink-2); }
.card .ad { font-size: 13px; color: var(--ink-3); }
.card .heart { top: var(--s-2); right: var(--s-2); bottom: auto; box-shadow: none; background: var(--sunk); }
.tipcard { background: var(--sunk); border: 0; }
.tipcard p { color: var(--ink); }
.steps { margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 26px minmax(0,1fr); gap: var(--s-2); align-items: baseline; font-size: 14.5px; }
.steps li::before { content: counter(s); width: 22px; height: 22px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; font-size: var(--t-xs); font-weight: var(--w-bold); }
.steps li span { color: var(--ink-3); font-size: 13px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: var(--tap); padding: 0 var(--s-4); border-radius: var(--r-pill); border: 1px solid var(--line); font-size: 14.5px; font-weight: var(--w-semi); text-decoration: none; background: var(--surface); color: var(--ink); cursor: pointer; }
.btn.solid { background: var(--ink); color: var(--bg); border-color: transparent; }
.btn.g { background: var(--gc); color: var(--go); }
.btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.btn svg { fill: none; stroke: currentColor; }
.card .btn { align-self: flex-start; margin-top: 4px; min-height: 42px; font-size: 14px; }
.heart { position: absolute; right: 6px; bottom: 6px; width: 40px; height: 40px; border: 0; border-radius: 50%; cursor: pointer; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow); }
.heart svg, .btn.save svg { fill: none; stroke: var(--heart); }
.heart[aria-pressed="true"] svg, .btn.save[aria-pressed="true"] svg { fill: var(--heart); }

.chip { flex: none; border: 1px solid var(--line); background: var(--surface); cursor: pointer; min-height: 40px; padding: 0 14px; border-radius: var(--r-pill); font-size: 14px; font-weight: var(--w-med); color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: transparent; }
.chip.switch { border-style: dashed; color: var(--ink); font-weight: var(--w-semi); }
.chip.pilot { background: var(--ink); color: var(--bg); border-color: transparent; font-weight: var(--w-bold); }

.tag { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; padding: 4px 10px; border-radius: var(--r-pill); font-size: var(--t-xs); font-weight: var(--w-bold); background: var(--surface); color: var(--ink-2); }
.tag.sp, .tag.ally { background: var(--sponsor-bg); color: var(--sponsor-ink); }
.tag.rev { background: var(--sunk); color: var(--review); }
.tag.future { background: var(--future-bg); color: var(--future-ink); }
.tag.ok { background: var(--sunk); color: var(--ink); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.trust { margin-top: 2px; font-size: 13px; line-height: 1.45; color: var(--ink-2); }
.trust a { text-decoration: underline; }
.trust.rev { font-size: 12.5px; font-weight: var(--w-semi); color: var(--review); }

.emptybox { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 22px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); }
.emptybox b { font-size: 19px; font-family: var(--font-display); }
.emptybox span { color: var(--ink-2); }
.pilot-empty b { font-size: var(--t-md); }

/* ---------- dock y navegación ---------- */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: linear-gradient(to top, var(--bg) 85%, transparent); padding-top: 18px; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.dock-in { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.chips { display: flex; gap: var(--s-2); overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
.chips::-webkit-scrollbar { display: none; }
form { display: flex; gap: var(--s-2); align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 5px 5px 5px var(--s-4); box-shadow: var(--shadow); }
form input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; min-height: 40px; }
form button { flex: none; border: 0; cursor: pointer; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--gc); color: var(--go); box-shadow: inset 0 0 0 1px var(--line); }
form button svg { fill: none; stroke: currentColor; }
nav.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(440px, calc(100% - 28px)); display: flex; gap: 4px; padding: 5px; border-radius: var(--r-pill); background: var(--band); box-shadow: var(--shadow); z-index: 6; }
nav.tabs button { flex: 1; border: 0; cursor: pointer; min-height: 46px; border-radius: var(--r-pill); display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 14px; font-weight: var(--w-bold); background: transparent; color: var(--band-muted); }
nav.tabs button[aria-current="page"] { background: var(--bg); color: var(--ink); }
nav.tabs svg { fill: none; stroke: currentColor; }

/* ---------- explorar ---------- */
.pagehead { display: flex; flex-direction: column; gap: 6px; }
.pagehead h1 { font-size: 28px; line-height: 1.1; }
.pagehead p { color: var(--ink-2); font-size: 15px; }
.search { display: flex; align-items: center; gap: 10px; padding: 0 var(--s-4); min-height: 48px; border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--line); }
.search svg { fill: none; stroke: var(--ink-3); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; }
.grid { column-count: 2; column-gap: var(--s-3); }
.pin { display: inline-block; width: 100%; margin: 0 0 14px; break-inside: avoid; cursor: pointer; vertical-align: top; }
.pin-img { position: relative; border-radius: var(--s-5); overflow: hidden; background: var(--sunk); display: flex; align-items: flex-end; padding: var(--s-3); }
.pin-img .glyph { font-size: 42px; font-weight: var(--w-bold); line-height: 1; color: var(--ink-3); opacity: .5; }
.pin-img .tag { position: absolute; left: var(--s-2); top: var(--s-2); }
.pin-cap { padding: var(--s-2) 4px 0; display: flex; flex-direction: column; gap: 3px; }
.pin-cap b { font-size: 14.5px; line-height: 1.25; }
.pin-cap > span:not(.gs) { font-size: 12.5px; line-height: 1.35; color: var(--ink-3); }
.pin-cap .gs { display: flex; gap: 4px; margin-top: 2px; }
.pin-cap .gs .av { width: 20px; height: 20px; font-size: 10px; }
.pin-tip { position: relative; padding: var(--s-4) var(--s-4) 56px; border-radius: var(--s-5); background: var(--surface); border: 1px solid var(--line); }
.pin-tip p { margin-top: 6px; font-size: 16px; line-height: 1.35; font-weight: var(--w-semi); }
.empty-q { margin: 4px; color: var(--ink-2); }
.biz { padding: var(--s-5); border-radius: var(--r-lg); background: var(--band); color: var(--band-ink); display: flex; flex-direction: column; gap: 10px; }
.biz .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.biz .k { color: var(--band-muted); }
.biz .tag { background: var(--band-ink); color: var(--band); }
.biz h2 { font-size: var(--t-lg); }
.biz p { font-size: 14.5px; color: var(--band-muted); }
.biz .btn { align-self: flex-start; background: var(--band-ink); color: var(--band); border-color: transparent; }

/* ---------- ficha ---------- */
.d-img { height: 170px; border-radius: var(--r-lg); background: var(--sunk); display: flex; align-items: flex-end; padding: 18px; }
.d-img .glyph { font-size: 64px; font-weight: var(--w-bold); line-height: 1; color: var(--ink-3); opacity: .5; }
.d-body { display: flex; flex-direction: column; gap: var(--s-2); }
.d-body h1 { font-size: var(--t-xl); line-height: 1.12; }
.d-body > p { font-size: var(--t-base); color: var(--ink-2); text-wrap: pretty; }
.d-body > p.d-addr { font-size: var(--t-sm); color: var(--ink-3); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.actions .btn.solid { flex: 1; }
.recby { display: flex; flex-direction: column; gap: var(--s-2); }
.recby h3 { font-size: 16px; }
.recby .btn { justify-content: flex-start; width: 100%; }
.recby .btn .av { width: 26px; height: 26px; font-size: var(--t-xs); }
.facts { margin: 0; display: grid; gap: var(--s-2); }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: var(--s-4); padding: var(--s-3) var(--s-4); }
.fact dt { font-size: var(--t-xs); font-weight: var(--w-bold); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--ink-3); }
.fact dd { margin: 3px 0 0; }
.warn { padding: var(--s-3) var(--s-4); border-radius: var(--s-4); border: 1.5px dashed var(--star); color: var(--star); font-size: var(--t-sm); }
.rlink { all: unset; box-sizing: border-box; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: var(--s-3); width: 100%; min-height: 50px; padding: 0 18px; border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--line); font-weight: var(--w-semi); }
.rlink svg { fill: none; stroke: currentColor; flex: none; }
.list { display: flex; flex-direction: column; gap: var(--s-2); }
.respect { font-size: 13px; color: var(--ink-3); }

/* ---------- para vos ---------- */
.plan { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.plan h2 { font-size: 22px; }
.plan > p { font-size: var(--t-sm); color: var(--ink-2); }
.plan ol { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: var(--s-2); }
.plan li button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: 36px minmax(0,1fr); gap: var(--s-3); align-items: center; }
.plan .num { width: 36px; height: 36px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; font-weight: var(--w-bold); }
.plan li b { display: block; font-size: 15px; }
.plan li small { font-size: 12.5px; color: var(--ink-3); }
.plan .btn { width: 100%; }
.saved-h { font-size: 18px; margin-top: var(--s-2); }

/* ---------- pie y panel de guardianes ---------- */
.foot { font-size: 11.5px; color: var(--ink-3); text-align: center; }
.linkbtn { border: 0; background: none; padding: 0; cursor: pointer; text-decoration: underline; color: var(--ink-3); font-size: 11.5px; }

.dlg { padding: var(--s-5); display: flex; flex-direction: column; gap: var(--s-3); }

.dlg > p { color: var(--ink-2); font-size: 14.5px; }
.gcard { background: var(--gs); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px var(--s-4); display: grid; grid-template-columns: 44px minmax(0,1fr); gap: var(--s-3); }
.gcard .av { width: 44px; height: 44px; font-size: var(--t-md); }

.gcard dt { color: var(--ink-3); } .gcard dd { margin: 0; }
.dlg .close { align-self: flex-end; }

/* ---------- páginas largas: Aliados y vista interna ---------- */
.doc { display: flex; flex-direction: column; gap: var(--s-4); }
.doc section { display: flex; flex-direction: column; gap: 10px; }
.doc h2 { font-size: 19px; }
.doc h3 { font-size: 16px; }

.status { display: flex; flex-direction: column; gap: 4px; padding: 14px var(--s-4); border-radius: var(--r-md); background: var(--sponsor-bg); color: var(--sponsor-ink); font-size: var(--t-sm); }
.status b { font-size: 14.5px; }
.status.future { background: var(--future-bg); color: var(--future-ink); }
.status.plain { background: var(--sunk); color: var(--ink); }
.terms { margin: 0; display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.terms div { background: var(--surface); padding: var(--s-3) 14px; display: grid; grid-template-columns: minmax(0, 9.5em) minmax(0,1fr); gap: var(--s-3); }
.terms dt { font-size: var(--t-sm); color: var(--ink-3); font-weight: var(--w-semi); }
.terms dd { margin: 0; font-size: 14.5px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px var(--s-4); display: flex; flex-direction: column; gap: var(--s-2); min-width: 0; }

.panel h3 { font-size: 16px; }

.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.inbanner { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r-md); background: var(--future-bg); color: var(--future-ink); font-size: var(--t-sm); font-weight: var(--w-semi); }
.inbanner .btn { min-height: 38px; font-size: 13.5px; }
.subnav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
.subnav::-webkit-scrollbar { display: none; }
.check { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--ink-3); }
.check .no { color: var(--star); font-weight: var(--w-semi); }
.rowlink { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: var(--s-3) 14px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line); }
.rowlink b { font-size: 15px; }
.layer { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 10px; padding: var(--s-3) 14px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line); }
.layer .n { width: 28px; height: 28px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; font-weight: var(--w-bold); font-size: 13px; font-family: var(--font-data); font-variant-numeric: tabular-nums; }

.layer p { font-size: 13.5px; }
.flow { list-style: none; padding: 0 !important; counter-reset: f; }

.flow li::before { content: counter(f); width: 26px; height: 26px; border-radius: 50%; background: var(--sunk); color: var(--ink); display: grid; place-items: center; font-weight: var(--w-bold); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.flow li .tag { margin-top: 4px; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--s-2); }
.sw { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line); font-size: var(--t-xs); min-width: 0; }
.sw i { display: block; height: 40px; border-radius: var(--s-2); box-shadow: inset 0 0 0 1px var(--line); }
.sw code { font-family: var(--font-data); font-size: 11.5px; color: var(--ink-3); overflow-wrap: anywhere; }
.scale { display: flex; flex-direction: column; gap: 6px; }
.scale div { display: grid; grid-template-columns: 90px minmax(0,1fr); gap: 10px; align-items: baseline; }
.scale small { font-family: var(--font-data); font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.bar { height: 12px; border-radius: 3px; background: var(--ink-3); }
.row { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; }
.ph { display: grid; place-items: center; height: 110px; border-radius: var(--r-md); border: 1.5px dashed var(--line); color: var(--ink-3); font-size: 13px; text-align: center; padding: var(--s-2); background: var(--sunk); }
.mininav { display: flex; gap: 4px; padding: 5px; border-radius: var(--r-pill); background: var(--band); }
.mininav span { flex: 1; text-align: center; padding: 10px 6px; border-radius: var(--r-pill); font-size: 13px; font-weight: var(--w-bold); color: var(--band-muted); }
.mininav span:first-child { background: var(--bg); color: var(--ink); }
.ext { overflow-wrap: anywhere; }

@media (prefers-reduced-motion: no-preference) { .msg.new { animation: up .25s ease-out; } @keyframes up { from { transform: translateY(6px); opacity: .4; } } .pin:active { transform: scale(.98); } }

<!-- Datos: se editan en data/, no aquí. config.js = vista previa y vista interna · lugares.js = catálogo · fuentes.js = registro de fuentes -->

<script>
(function () {

var VERSION = 'App 1.2 vista previa · 23-oct-2026';

var PILOT_MAX = 3; // Recorrido «Quiero un café»: máximo de fichas.
var CFG = window.NAIHUAL_CONFIG || {};
var PREVIEW = CFG.vista_previa !== false;          // sin config = vista previa
var INTERNAL = CFG.vista_interna === true;         // sin config = sin vista interna
var SHOW_ALLIES = CFG.mostrar_aliados !== false;
var LAUNCH = String(CFG.fecha_lanzamiento || '').trim();
function w(es, en) { return { es: es, en: en }; }

// ===================== GUARDIANES (docs/nAIhual.md, sección 3c · aprobados por el fundador) =====================
// Selección y orden aprobados: No'j → Iq' → Kej → E'. No se cambian.

var ORDER = ['noj', 'iq', 'kej', 'e'];
var G = {
  noj: { name: "No'j", ini: 'N', value: w('La sabiduría', 'Wisdom'), role: w('Comprender', 'Understand'), speaks: w('Maestro cercano, reflexivo', 'A friendly, reflective teacher'), dir: w('Oriente · rojo', 'East · red'),

};

// ===================== CATÁLOGO (vive en data/lugares.js) =====================
// Publicado = estado «publicado» + nombre, dirección, enlace de Maps, fuente, fecha y quién verificó.
// El visitante solo ve lo publicado. Lo demás queda en la vista interna de revisión. Pausado y retirado no se cargan.
var CATS = { cultura: 1, cafe: 1, comida: 1 };
// Enlace propio de Maps: solo se acepta si es de Google Maps.
var MAPS_RE = /^https:\/\/(www\.google\.[a-z.]+\/maps|maps\.google\.[a-z.]+|maps\.app\.goo\.gl|goo\.gl\/maps)(\/|\?|$)/;
var P = {}, PIDS = [];
(window.NAIHUAL_LUGARES || []).forEach(function (r) {
  if (!r || !r.id || !CATS[r.categoria] || P[r.id]) return;
  var estado = r.estado || 'borrador';
  if (estado === 'pausado' || estado === 'retirado') return;
  var f = r.frase || {};
  P[r.id] = { id: r.id, cat: r.categoria, hist: !!r.historico, g: (r.guardianes || []).filter(function (g) { return ORDER.indexOf(g) >= 0; }),
    name: String(r.nombre || '').trim(), addr: String(r.direccion || '').trim() || null, mapsLink: String(r.maps_url || '').trim(),
    fuente: String(r.fuente || '').trim(), fuenteUrl: String(r.fuente_url || '').trim(), fecha: String(r.fecha_verificacion || '').trim(), verifico: String(r.verifico || '').trim(),
    estado: estado, patro: r.patrocinado === true, pendiente: String(r.pendiente || '').trim(),
    horario: r.fuente_horario ? String(r.horario || '').trim() : '', precio: r.fuente_precio ? String(r.precio || '').trim() : '',
    why: { es: f.es || '', en: f.en || f.es || '' } };
  if (P[r.id].name) PIDS.push(r.id); else delete P[r.id];
});
function validDate(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); if (!m) return false;
  var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  return d.getUTCMonth() === +m[2] - 1 && d.getTime() <= Date.now();
}
function mapsUrl(p) {
  if (!p || !p.addr) return '';
  if (p.mapsLink) return MAPS_RE.test(p.mapsLink) ? p.mapsLink : '';
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent([p.name, p.addr, 'Antigua Guatemala'].join(', '));
}
// Qué le falta a una ficha para publicarse (para la vista interna).
function missing(p) {
  var m = [];
  if (!p.addr) m.push('dirección');
  if (p.addr && !mapsUrl(p)) m.push('enlace de Maps válido');
  if (!p.fuente) m.push('fuente');
  if (!validDate(p.fecha)) m.push('fecha de verificación');
  if (!p.verifico) m.push('quién verificó');
  if (p.estado !== 'publicado') m.push('estado «publicado»');
  return m;
}
function isPub(p) { return !!p && !missing(p).length; }
function pilotCafes() { return PIDS.filter(function (id) { return P[id].cat === 'cafe' && isPub(P[id]); }).slice(0, PILOT_MAX); }

// ===================== FUENTES (vive en data/fuentes.js) =====================
var SRC = {};
(window.NAIHUAL_FUENTES || []).forEach(function (f) { if (f && f.id) SRC[f.id] = f; });

// ===================== RUTAS =====================
var ROUTES = {
  centro: { g: ['e'], stops: ['parque', 'catedral', 'doce', 'palacio', 'arco', 'merced'], kicker: w('Una mañana', 'A morning'), title: w('El corazón de Antigua', 'The heart of Antigua'), intro: w('La plaza, la Catedral y el Arco, con un café de especialidad a media mañana.', 'The square, the Cathedral and the Arch, with a specialty coffee mid-morning.') },
  conventos: { g: ['kej', 'noj'], stops: ['capuchinas', 'once', 'santaclara', 'sanfrancisco', 'patio'], kicker: w('Una tarde', 'An afternoon'), title: w('Conventos del oriente', 'Convents to the east'), intro: w('Tres ruinas y una iglesia viva en el lado tranquilo de la ciudad. Termina con cena en un patio.', 'Three ruins and a living church on the quiet side of town. Ends with dinner in a courtyard.') },
  norte: { g: ['kej'], stops: ['catedral', 'cazador', 'arco', 'merced', 'siena'], kicker: w('Un par de horas', 'A couple of hours'), title: w('Del Arco a La Merced', 'From the Arch to La Merced'), intro: w('La calle más fotografiada de Antigua, a paso lento, con pausas para comer y leer.', 'Antigua’s most photographed street, slowly, with stops to eat and read.') }
};

Object.keys(ROUTES).forEach(function (id) { if (!ROUTES[id].stops.every(function (s) { return isPub(P[s]); })) delete ROUTES[id]; });

// ===================== CONSEJOS (src = fuente del registro que los respalda) =====================
var TIPS = {
  foto: { cat: 'general', g: ['iq', 'e'], body: w('Antes de fotografiar a alguien, pedí permiso. Un «¿puedo?» basta.', 'Before photographing someone, ask first. A simple “may I?” is enough.') },

// 20 nawales: tabla del Documento Consolidado. Inglés traducido por Claude, sin revisar.
var NAWALES = [
  ['batz', "B'atz'", w('Hilo del tiempo, tejido, origen', 'Thread of time, weaving, origin'), w('Mono', 'Monkey'), w('Maestro de artes, tejedor del tiempo, guía familiar', 'Master of the arts, weaver of time, family guide'), w('Terquedad, ambición material, sarcasmo', 'Stubbornness, material ambition, sarcasm')],
  ['e', "E'", w('Camino, destino, estructura corporal', 'Path, destiny, the body’s structure'), w('Gato de monte, puma', 'Wildcat, puma'), w('Guía de viajeros, líder nato, orador', 'Guide of travelers, natural leader, speaker'), w('Impaciencia, inestabilidad emocional', 'Impatience, emotional instability')],
  ['aj', 'Aj', w('Cañaveral, hogar, linaje, autoridad', 'Cane field, home, lineage, authority'), w('Armadillo', 'Armadillo'), w('Protector de niños, mediador, sabio', 'Protector of children, mediator, wise one'), w('Chisme, celos, manipulación', 'Gossip, jealousy, manipulation')],
  ['ix', "I'x", w('Jaguar, energía terrestre, altar', 'Jaguar, earth energy, altar'), w('Jaguar', 'Jaguar'), w('Intuición, sagacidad, fuerza de la Tierra', 'Intuition, shrewdness, strength of the Earth'), w('Orgullo, impulsividad, reserva excesiva', 'Pride, impulsiveness, excessive reserve')],

    '<section><h3>Espacio y forma</h3><div class="scale">' + [1, 2, 3, 4, 5, 6, 7].map(function (n) { return '<div><small>--s-' + n + '</small><span class="bar" style="width:var(--s-' + n + ')"></span></div>'; }).join('') + '</div>' +
      '<div class="row">' + [['--r-sm', 'chico'], ['--r-md', 'tarjeta'], ['--r-lg', 'bloque'], ['--r-pill', 'botón']].map(function (r) { return '<span class="tag" style="border-radius:var(' + r[0] + ');border:1px solid var(--line);padding:10px 14px">' + r[0] + ' · ' + r[1] + '</span>'; }).join('') + '</div></section>' +
    '<section><h3>Botones y chips</h3><div class="row"><span class="btn solid">Principal</span><span class="btn">Secundario</span><span class="btn g g-noj"><span class="av" style="width:24px;height:24px;font-size:11px">N</span>De guardián</span><span class="btn" aria-disabled="true">Desactivado</span></div>' +
      '<div class="row"><span class="chip pilot" style="display:inline-flex;align-items:center">Quiero un café</span><span class="chip" style="display:inline-flex;align-items:center">Pregunta lista</span><span class="chip switch" style="display:inline-flex;align-items:center">Otro guía →</span></div></section>' +
    '<section><h3>Etiquetas</h3><div class="tags"><span class="tag">Café</span><span class="tag rev">En revisión</span><span class="tag sp">Patrocinado</span><span class="tag ally">Aliado Fundador</span><span class="tag future">Diseño futuro / no activo</span><span class="tag ok">Publicada</span></div></section>' +
    '<section><h3>Tarjeta de lugar</h3><div class="card" data-demo="tarjeta"><span class="k">Café · ejemplo ficticio</span><h3>Nombre de ejemplo</h3><p>Frase de ejemplo.</p><span class="ad">Dirección de ejemplo</span><p class="trust">Fuente: ejemplo<br>Comprobado el [fecha] por [persona]</p><span class="btn" aria-disabled="true">' + ICON.pin + 'Cómo llegar</span></div>' +
      '<div class="ph">Espacio para foto del lugar · pendiente (solo con permiso)</div></section>' +
    '<section><h3>Estado vacío</h3><div class="emptybox"><b>Selección en revisión</b><span>Así se avisa cuando todavía no hay datos comprobados.</span></div></section>' +
    '<section><h3>Navegación</h3><div class="mininav" aria-hidden="true"><span>Guía</span><span>Explorar</span><span>Para vos</span></div></section>';
}
function tallerHTML() {
  var sec = SECS.some(function (s) { return s[0] === S.sec; }) ? S.sec : 'revision';
  var body = sec === 'revision' ? secRevision() : sec === 'etapas' ? secEtapas() : sec === 'aprendizaje' ? secAprendizaje() : sec === 'arquitectura' ? secArquitectura() : secSistema();
  return '<div class="inbanner" role="note"><span>Vista interna del equipo · no la ve el visitante</span><button type="button" class="btn" data-tab="guia">Volver a la app</button></div>' +
    '<div class="subnav" role="group" aria-label="Secciones internas">' + SECS.map(function (s) { return '<button type="button" class="chip" data-sec="' + s[0] + '" aria-pressed="' + (s[0] === sec) + '">' + esc(s[1]) + '</button>'; }).join('') + '</div>' +
    '<article class="doc" id="taller-' + sec + '">' + body + '</article>' +
    (S.lang === 'en' ? '<p class="note-muted">The internal view is only available in Spanish for now.</p>' : '');
}

// ===================== DIBUJAR =====================
var main = document.getElementById('main');
var VISITOR_TABS = { guia: 1, feed: 1, para: 1 };
function render(scrollChat) {
  var t = STR[S.lang], onGuia = S.tab === 'guia';
  document.documentElement.lang = S.lang;
  ['es', 'en'].forEach(function (l) { document.getElementById('lang-' + l).setAttribute('aria-pressed', String(S.lang === l)); });
  document.getElementById('tagline').textContent = t.tagline;
  document.getElementById('hint').textContent = t.hint;
  document.getElementById('wheel-wrap').hidden = !onGuia;
  document.getElementById('hdr').className = onGuia ? 'line' : '';
  document.getElementById('dock').hidden = !onGuia;
  main.className = onGuia ? 'chatpad' : '';
  document.getElementById('q').placeholder = t.placeholder;
  document.getElementById('send').setAttribute('aria-label', t.send);
  document.getElementById('ask').className = 'g-' + S.guide;
  document.getElementById('wheel').setAttribute('aria-label', t.wheel);
  document.getElementById('wheel').innerHTML = ORDER.map(function (id) {
    var g = G[id];
    return '<button type="button" class="wg g-' + id + '" data-g="' + id + '" aria-current="' + (id === S.guide) + '" aria-label="' + esc(t.talk + ' ' + g.name + ' · ' + g.value[S.lang]) + '"><span class="av">' + g.ini + '</span><small>' + esc(g.name) + '</small></button>';
  }).join('');
  // «Quiero un café» va primero y resaltado: es la acción del recorrido piloto.
  document.getElementById('chips').innerHTML = t.chips.map(function (c, i) {
    return (i === 1 ? '<button type="button" class="chip switch" data-next>' + esc(t.switchChip) + '</button>' : '') + '<button type="button" class="chip' + (c[0] === 'cafe' ? ' pilot' : '') + '" data-chip="' + c[0] + '">' + esc(c[1]) + '</button>';
  }).join('');
  var tabOn = S.tab === 'detail' ? S.prev : S.tab, n = savedShown().length;
  [['guia', ICON.chat, t.tabGuia], ['feed', ICON.grid, t.tabFeed], ['para', ICON.heart, t.tabPara + (n ? ' · ' + n : '')]].forEach(function (d) {
    var b = document.getElementById('tab-' + d[0]); b.innerHTML = d[1] + esc(d[2]);
    if (tabOn === d[0]) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  var hadFocus = document.activeElement && document.activeElement.id === 'fq', caret = hadFocus ? document.activeElement.selectionStart : 0;
  if (onGuia) {
    main.innerHTML = guiaHTML(scrollChat) + footHTML();
    if (scrollChat) { var msgs = main.querySelectorAll('.msg'); var target = msgs[Math.max(0, msgs.length - 2)]; if (target) target.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
  } else if (S.tab === 'feed') main.innerHTML = feedHTML() + footHTML();
  else if (S.tab === 'para') main.innerHTML = paraHTML();
  else if (S.tab === 'aliados') main.innerHTML = alliesHTML();
  else if (S.tab === 'taller') main.innerHTML = tallerHTML();
  else main.innerHTML = detailHTML();
  if (hadFocus) { var fi = document.getElementById('fq'); if (fi) { fi.focus(); try { fi.setSelectionRange(caret, caret); } catch (e) {} } }
}
function go(tab) {
  if (tab === 'taller' && !INTERNAL) tab = 'guia';
  if (tab === 'aliados' && !SHOW_ALLIES) tab = 'feed';
  if (tab === 'aliados' || tab === 'taller') S.prev = VISITOR_TABS[S.tab] || S.tab === 'taller' ? S.tab : (S.prev || 'feed');
  S.tab = tab; S.detail = null; render(false); window.scrollTo(0, tab === 'guia' ? document.body.scrollHeight : 0);
}
function open(key) {
  if (S.tab !== 'detail') S.prev = S.tab;
  S.detail = key; S.tab = 'detail'; bump(key, 1); persist(); render(false); window.scrollTo(0, 0);
}

document.getElementById('ask').addEventListener('submit', function (e) { e.preventDefault(); var i = document.getElementById('q'); ask(i.value); i.value = ''; });
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-toggle],[data-open],[data-filter],[data-tab],[data-back],[data-lang],[data-chip],[data-next],[data-g],[data-talk],[data-who],[data-close],[data-go],[data-sec],[data-demo-fb],[data-say],[data-stop]');
  if (!el) return;
  if (el.hasAttribute('data-toggle')) { e.stopPropagation(); toggle(el.getAttribute('data-toggle')); return; }
  if (el.hasAttribute('data-open')) { open(el.getAttribute('data-open')); return; }
  if (el.hasAttribute('data-filter')) { var f = el.getAttribute('data-filter'); S.filter = f; if (S.pref[f] !== undefined) S.pref[f]++; persist(); render(false); return; }
  if (el.hasAttribute('data-tab')) { go(el.getAttribute('data-tab')); return; }
  if (el.hasAttribute('data-go')) { go(el.getAttribute('data-go')); return; }
  if (el.hasAttribute('data-sec')) { S.sec = el.getAttribute('data-sec'); render(false); window.scrollTo(0, 0); return; }
  if (el.hasAttribute('data-say')) { ask(el.getAttribute('data-say')); return; }
  if (el.hasAttribute('data-stop')) { if (AI.ctl) AI.ctl.abort(); return; }
  if (el.hasAttribute('data-demo-fb')) { S.demoFb = el.getAttribute('data-demo-fb'); render(false); return; }
  if (el.hasAttribute('data-back')) { var to = S.prev || 'feed'; if (S.tab === 'detail' && to === 'taller') { S.tab = 'taller'; S.detail = null; render(false); window.scrollTo(0, 0); return; } go(to); return; }
  if (el.hasAttribute('data-lang')) { S.lang = el.getAttribute('data-lang'); persist(); render(false); return; }
  if (el.hasAttribute('data-chip')) { var c = STR[S.lang].chips.concat(STR[S.lang].clarifyOpts).filter(function (x) { return x[0] === el.getAttribute('data-chip'); })[0]; if (S.tab !== 'guia') { S.tab = 'guia'; S.detail = null; } ask(c[1]); return; }
  if (el.hasAttribute('data-next')) { switchTo(ORDER[(ORDER.indexOf(S.guide) + 1) % ORDER.length]); render(true); return; }
  if (el.hasAttribute('data-g')) { var id = el.getAttribute('data-g'); if (id !== S.guide) { switchTo(id); render(true); } return; }
  if (el.hasAttribute('data-talk')) { var gt = el.getAttribute('data-talk'); S.tab = 'guia'; S.detail = null; if (gt !== S.guide) switchTo(gt); render(true); return; }
  if (el.hasAttribute('data-who')) { openDlg(); return; }
  if (el.hasAttribute('data-close')) document.getElementById('dlg').close();
});
document.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.pin[data-open]')) { e.preventDefault(); open(e.target.getAttribute('data-open')); } });
document.addEventListener('input', function (e) { if (e.target.id === 'fq') { S.query = e.target.value; render(false); } });

function openDlg() {
  var t = STR[S.lang], L = S.lang;
  document.getElementById('dlg-body').innerHTML = '<h2>' + esc(t.dlgTitle) + '</h2><p>' + esc(t.dlgIntro) + '</p>' +
    ORDER.map(function (id) { var g = G[id]; return '<div class="gcard g-' + id + '"><span class="av">' + g.ini + '</span><div><b>' + esc(g.name) + '</b><dl>' +
      [[t.dValue, g.value[L] + ' *'], [t.dDir, g.dir[L] + ' *'], [t.dRole, g.role[L]], [t.dSpeaks, g.speaks[L]], [t.dRecs, g.recs[L]], [t.dPdf, g.pdf[L]]].map(function (r) { return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') +
      '</dl></div></div>'; }).join('') + '<p class="note-star" style="font-size:12.5px">' + esc(t.dlgPending) + '</p><button type="button" class="btn solid close" data-close>' + esc(t.close) + '</button>';
  var d = document.getElementById('dlg'); if (d.showModal) d.showModal(); else d.setAttribute('open', '');
}

// Abrir una vista directa con un enlace (#aliados, o una sección interna como #etapas si la vista interna está encendida).
(function () {
  var h = String(location.hash || '').slice(1);
  if (h === 'aliados' && SHOW_ALLIES) { S.prev = 'feed'; S.tab = 'aliados'; }
  else if (INTERNAL && (h === 'taller' || SECS.some(function (s) { return s[0] === h; }))) { S.prev = 'guia'; S.tab = 'taller'; if (h !== 'taller') S.sec = h; }
})();
S.msgs.push({ from: ORDER[0], kind: 'welcome', intro: true });
render(false);
})();
</script>
</body>
</html>
