    return okF;
  });
  var fdefs = [['all', t.fAll], ['route', t.fRoute], ['cultura', t.fCultura], ['nawal', t.fNawal], ['cafe', t.fCafe], ['comida', t.fComida], ['tip', t.fTip]];
  var wa = BIZ_WHATSAPP.replace(/\D/g, '');
  var biz = wa ? '<a class="btn btn-primary" href="https://wa.me/' + wa + '?text=' + encodeURIComponent(t.bizMsg) + '" target="_blank" rel="noopener">' + esc(t.bizCta) + '</a>'
               : '<span class="btn btn-primary" aria-disabled="true">' + esc(t.bizPending) + '</span>';
  return '<div class="hero"><h1>' + esc(t.feedTitle) + '</h1><span class="proto">' + esc(t.proto) + '</span></div>' +
    '<label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>' +
    '<input id="q" type="search" autocomplete="off" placeholder="' + esc(t.search) + '" value="' + esc(S.query) + '" aria-label="' + esc(t.search) + '"></label>' +
    '<div class="chips" role="group">' + fdefs.map(function (d) { return '<button type="button" class="chip" data-filter="' + d[0] + '" aria-pressed="' + (f === d[0]) + '">' + esc(d[1]) + '</button>'; }).join('') + '</div>' +
    (list.length ? gridHTML(list) : '<p class="empty-q">' + esc(t.noResults) + '</p>') + notesHTML(list) +
    '<section class="biz"><div class="row"><span class="kicker">' + esc(t.bizKicker) + '</span><span class="tag">' + esc(t.bizTag) + '</span></div><h2>' + esc(t.bizTitle) + '</h2><p>' + esc(t.bizBody) + '</p>' + biz + '</section>' +
    '<footer class="ver">' + esc(t.ver) + '</footer>';
}

function planIds() {
  var pool = [];
  S.saved.forEach(function (key) { var k = key.split(':')[0], id = key.split(':')[1]; if (k === 'p') pool.push(id); if (k === 'r') ROUTES[id].stops.forEach(function (s) { pool.push(s); }); });
  var used = {}, pref = S.pref;
  function pick(cat) {
    var ok = function (x) { return P[x].cat === cat && !used[x] && P[x].addr; };
    var id = pool.filter(ok)[0] || Object.keys(P).filter(ok)[0];
    if (id) used[id] = true;
    return id;
  }
  var a = (pref.cafe || 0) >= (pref.comida || 0) ? 'cafe' : 'comida', b = a === 'cafe' ? 'comida' : 'cafe';
  var seq = ['cultura', a, 'cultura', (pref.cultura || 0) > (pref.cafe || 0) + (pref.comida || 0) ? 'cultura' : a, b];
  return seq.map(pick).filter(Boolean);
}

function paraHTML() {
  var t = STR[S.lang], saved = ORDER.map(pinOf).filter(function (p) { return S.saved.indexOf(p.key) >= 0; });
  var h = '<div class="para-head"><h1>' + esc(t.paraTitle) + '</h1><p>' + esc(t.paraSub) + '</p></div>';
  if (!saved.length) return h + '<div class="emptybox"><span class="ic">' + ICON.heart + '</span><b>' + esc(t.emptyTitle) + '</b><span>' + esc(t.emptyBody) + '</span><button type="button" class="btn btn-primary" data-go="feed">' + esc(t.explore) + '</button></div>';
  var ids = planIds(), pref = S.pref;
  var top = ['cultura', 'cafe', 'comida'].sort(function (x, y) { return (pref[y] || 0) - (pref[x] || 0); })[0];
  h += '<div class="plan"><span class="kicker">' + esc(t.yourPlan) + '</span><h2>' + esc(t.yourPlanTitle) + '</h2><p>' + esc(t.because(saved.length, t[CAT[top].key].toLowerCase())) + '</p><ol>' +
    ids.map(function (id, i) { var p = P[id], c = CAT[p.cat]; return '<li><button type="button" data-open="p:' + id + '"><span class="num ' + c.cls + '">' + (i + 1) + '</span><span><b>' + esc(p.name) + '</b><small>' + esc(t[c.key]) + '</small></span></button></li>'; }).join('') +
    '</ol>' + (ids.length > 1 ? '<a class="btn btn-primary" href="' + routeUrl(ids) + '" target="_blank" rel="noopener">' + ICON.nav + esc(t.fullRoute) + '</a>' : '') + '</div>';
  return h + '<h3 class="saved-h">' + esc(t.savedTitle) + '</h3>' + gridHTML(saved) + notesHTML(saved);
}

function detailHTML() {
  var t = STR[S.lang], L = S.lang, key = S.detail, k = key.split(':')[0], id = key.split(':')[1];
  var on = S.saved.indexOf(key) >= 0;
  var saveBtn = '<button type="button" class="btn btn-secondary" data-toggle="' + key + '" aria-pressed="' + on + '"><svg class="h" width="18" height="18" viewBox="0 0 24 24" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>' + esc(on ? t.saved : t.save) + '</button>';
  var h = '<button type="button" class="btn btn-ghost" data-back>' + ICON.back + esc(t.back) + '</button>';
  var star = false, hist = false;
  function head(cls, glyph, kicker, title, body) {
    return (cls ? '<div class="d-img ' + cls + '"><span class="glyph" aria-hidden="true">' + esc(glyph) + '</span></div>' : '') +
      '<section class="d-body"><span class="kicker">' + esc(kicker) + '</span><h1>' + esc(title) + '</h1>' + (body ? '<p>' + esc(body) + '</p>' : '');
  }
  if (k === 'r') {
    var r = ROUTES[id]; hist = true;
    h += head('t-cult', r.stops.length, r.kicker[L], r.title[L], r.intro[L]) +
      '<div class="actions"><a class="btn btn-primary" href="' + routeUrl(r.stops) + '" target="_blank" rel="noopener">' + ICON.nav + esc(t.fullRoute) + '</a>' + saveBtn + '</div></section>' +
      '<ol class="stops">' + r.stops.map(function (sid, i) { var p = P[sid], c = CAT[p.cat]; return '<li><span class="num ' + c.cls + '">' + (i + 1) + '</span><div class="stop"><span class="tag ' + c.cls + '">' + esc(t[c.key]) + '</span><button type="button" class="nm" data-open="p:' + sid + '">' + esc(p.name) + '</button><span class="ad">' + esc(p.addr || t.addrPending) + '</span><p>' + esc(p.why[L] + marks(p)) + '</p><a class="btn btn-secondary" href="' + mapsUrl(p) + '" target="_blank" rel="noopener">' + ICON.pin + esc(t.howToGet) + '</a></div></li>'; }).join('') + '</ol>';
  } else if (k === 'p') {
    var p = P[id], c = CAT[p.cat]; hist = !!p.hist;
    var routes = Object.keys(ROUTES).filter(function (rid) { return ROUTES[rid].stops.indexOf(id) >= 0; });
    h += head(c.cls, p.name.charAt(0), t[c.key], p.name, p.why[L] + marks(p)) + '<p class="d-addr">' + esc(p.addr || t.addrPending) + '</p>' +
      '<div class="actions"><a class="btn btn-primary" href="' + mapsUrl(p) + '" target="_blank" rel="noopener">' + ICON.nav + esc(t.openMaps) + '</a>' + saveBtn + '</div></section>' +
      (routes.length ? '<h3 class="inroutes">' + esc(t.inRoutes) + '</h3>' + routes.map(function (rid) { return '<button type="button" class="rlink" data-open="r:' + rid + '">' + esc(ROUTES[rid].title[L]) + ICON.arrow + '</button>'; }).join('') : '');
  } else if (k === 'c') {
    star = true;
    h += head('t-nawal', '20', t.collection, t.nawalsTitle + ' *', t.nawalsIntro) + '<div class="actions">' + saveBtn + '</div></section>' +
      '<p class="warn">' + esc(t.nawalWarn) + '</p>' +
      '<div style="margin-top:18px">' + NAWALES.map(function (row) { var nw = N[row[0]]; return '<button type="button" class="rlink" data-open="n:' + row[0] + '"><span>' + nw.n + ' · ' + esc(nw.name) + ' <span style="font-weight:400">— ' + esc(nw.animal[L]) + '</span></span>' + ICON.arrow + '</button>'; }).join('') + '</div>';
  } else if (k === 'n') {
    var nw = N[id]; star = true;
    h += head('t-nawal', nw.n, t.catNawal + ' ' + nw.n + ' / 20', nw.name + ' *', '') + '<div class="actions">' + saveBtn + '</div></section>' +
      '<dl class="facts">' + [[t.nSymbol, nw.symbol], [t.nAnimal, nw.animal], [t.nLight, nw.light], [t.nShadow, nw.shadow]].map(function (f) { return '<div class="fact"><dt>' + esc(f[0]) + '</dt><dd>' + esc(f[1][L]) + '</dd></div>'; }).join('') + '</dl>' +
      '<p class="warn">' + esc(t.nawalWarn) + '</p>' +
      '<button type="button" class="rlink" style="margin-top:16px" data-open="c:nawales">' + esc(t.nawalsTitle) + ICON.arrow + '</button>';
  } else {
    var tp = TIPS[id]; star = !!tp.star;
    h += head(null, '', t.tip, tp.body[L] + marks(tp), '') + '<div class="actions">' + saveBtn + '</div></section>';
  }
  if (star) h += '<p class="note star" style="margin-top:20px">' + esc(t.starNote) + '</p>';
  if (hist) h += '<p class="note hist" style="margin-top:20px">' + esc(t.histNote) + '</p>';
  if (L === 'en') h += '<p class="note muted">' + esc(t.enNote) + '</p>';
  return h + '<p class="respect">' + esc(t.respect) + '</p>';
}

var main = document.getElementById('main');
function render() {
  var t = STR[S.lang];
  document.documentElement.lang = S.lang;
  ['es', 'en'].forEach(function (l) { document.getElementById('lang-' + l).setAttribute('aria-pressed', String(S.lang === l)); });
  var paraOn = S.tab === 'para' || (S.tab === 'detail' && S.prev === 'para');
  var tf = document.getElementById('tab-feed'), tp = document.getElementById('tab-para');
  tf.innerHTML = ICON.grid + esc(t.tabFeed); tp.innerHTML = ICON.heart.replace('width="20" height="20"', 'width="18" height="18"') + esc(t.tabPara + (S.saved.length ? ' · ' + S.saved.length : ''));
  if (paraOn) { tp.setAttribute('aria-current', 'page'); tf.removeAttribute('aria-current'); } else { tf.setAttribute('aria-current', 'page'); tp.removeAttribute('aria-current'); }
  var hadFocus = document.activeElement && document.activeElement.id === 'q', caret = hadFocus ? document.activeElement.selectionStart : 0;
  main.innerHTML = S.tab === 'feed' ? feedHTML() : S.tab === 'para' ? paraHTML() : detailHTML();
  if (hadFocus) { var qi = document.getElementById('q'); if (qi) { qi.focus(); try { qi.setSelectionRange(caret, caret); } catch (e) {} } }
}

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-toggle],[data-open],[data-filter],[data-go],[data-back],[data-lang],[data-tab]');
  if (!el) { if (e.target.closest('#logo')) go('feed'); return; }
  if (el.hasAttribute('data-toggle')) { e.stopPropagation(); toggle(el.getAttribute('data-toggle')); return; }
  if (el.hasAttribute('data-open')) { open(el.getAttribute('data-open')); return; }
  if (el.hasAttribute('data-filter')) { var f = el.getAttribute('data-filter'); S.filter = f; if (S.pref[f] !== undefined) S.pref[f]++; persist(); render(); return; }
  if (el.hasAttribute('data-go')) { go(el.getAttribute('data-go')); return; }
  if (el.hasAttribute('data-back')) { go(S.prev || 'feed'); return; }
  if (el.hasAttribute('data-lang')) { S.lang = el.getAttribute('data-lang'); persist(); render(); return; }
  if (el.hasAttribute('data-tab')) { go(el.getAttribute('data-tab')); }
});
document.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.pin[data-open]')) { e.preventDefault(); open(e.target.getAttribute('data-open')); }
});
document.addEventListener('input', function (e) { if (e.target.id === 'q') { S.query = e.target.value; render(); } });

render();
})();
</script>
</body>
