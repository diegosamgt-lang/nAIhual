<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nAIhual</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de celular (máx. 520px), 3 pestañas abajo: Guía (chat), Explorar (muro 2 columnas), Para vos.
   Visual NEUTRO y provisional: el fundador hará el arte final. Los colores de guardián solo sirven para distinguirlos. */
:root {
  --bg: #f3f2ef; --surface: #ffffff; --sunk: #e8e6e1;
  --ink: #1b1b1a; --ink-2: #4a4945; --ink-3: #75736d;
  --line: rgba(27,27,26,.12);
  /* Color por rumbo* (pendiente de validación cultural): No'j rojo · Iq' blanco · Kej negro · E' amarillo */
  --g-noj: #a63d2f; --g-iq: #ffffff; --g-kej: #2b2a27; --g-e: #e0b23a;
  --g-noj-on: #ffffff; --g-iq-on: #1b1b1a; --g-kej-on: #ffffff; --g-e-on: #1b1b1a;
  --g-noj-soft: #f4e0db; --g-iq-soft: #ffffff; --g-kej-soft: #e4e2dd; --g-e-soft: #f6ebcd;
  --heart: #b4462f;
  --star: #8a4b2a; --hist: #4f6340;
  --band: #1b1b1a; --band-ink: #f3f2ef; --band-muted: #c9c6be;
  --shadow: 0 1px 2px rgba(0,0,0,.08), 0 4px 14px rgba(0,0,0,.05);
  --font: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161615; --surface: #222220; --sunk: #2c2c29;
  --ink: #efede8; --ink-2: #c9c6be; --ink-3: #9d9a92;
  --line: rgba(239,237,232,.14);
  --g-noj: #e07a68; --g-iq: #f3f2ef; --g-kej: #0c0c0b; --g-e: #e5b94a;
  --g-noj-on: #161615; --g-iq-on: #161615; --g-kej-on: #efede8; --g-e-on: #161615;
  --g-noj-soft: #3a221d; --g-iq-soft: #2e2e2b; --g-kej-soft: #0f0f0e; --g-e-soft: #362b13;
  --heart: #ef8a70; --star: #e59b72; --hist: #a9c08f;
  --band: #0c0c0b; --band-ink: #efede8; --band-muted: #9d9a92;
  --shadow: 0 1px 2px rgba(0,0,0,.5);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #161615; --surface: #222220; --sunk: #2c2c29;
  --ink: #efede8; --ink-2: #c9c6be; --ink-3: #9d9a92;
  --line: rgba(239,237,232,.14);
  --g-noj: #e07a68; --g-iq: #f3f2ef; --g-kej: #0c0c0b; --g-e: #e5b94a;
  --g-noj-on: #161615; --g-iq-on: #161615; --g-kej-on: #efede8; --g-e-on: #161615;
  --g-noj-soft: #3a221d; --g-iq-soft: #2e2e2b; --g-kej-soft: #0f0f0e; --g-e-soft: #362b13;
  --heart: #ef8a70; --star: #e59b72; --hist: #a9c08f;
  --band: #0c0c0b; --band-ink: #efede8; --band-muted: #9d9a92;
  --shadow: 0 1px 2px rgba(0,0,0,.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -.01em; }
:focus-visible { outline: 3px solid var(--ink-3); outline-offset: 2px; }
[hidden] { display: none !important; }
svg { display: block; }

.app { max-width: 520px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--bg); padding-block: 14px 10px; display: flex; flex-direction: column; gap: 12px; }
header.line { border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { all: unset; cursor: pointer; display: flex; flex-direction: column; }
.brand b { font-size: 21px; letter-spacing: -.01em; }
.brand span { font-size: 12.5px; color: var(--ink-3); }
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--sunk); }
.seg button { border: 0; cursor: pointer; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: transparent; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* guardianes */
.av { flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: var(--go); background: var(--gc); box-shadow: inset 0 0 0 1px var(--line); }
.g-noj { --gc: var(--g-noj); --go: var(--g-noj-on); --gs: var(--g-noj-soft); }
.g-iq { --gc: var(--g-iq); --go: var(--g-iq-on); --gs: var(--g-iq-soft); }
.g-kej { --gc: var(--g-kej); --go: var(--g-kej-on); --gs: var(--g-kej-soft); }
.g-e { --gc: var(--g-e); --go: var(--g-e-on); --gs: var(--g-e-soft); }
.wheel { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
.wg { border: 0; cursor: pointer; background: transparent; border-radius: 14px; padding: 6px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
.wg .av { width: 40px; height: 40px; font-size: 16px; opacity: .4; transition: opacity .2s, transform .2s; }
.wg small { font-size: 12px; font-weight: 600; color: var(--ink-3); }
.wg[aria-current="true"] .av { opacity: 1; transform: scale(1.08); }
.wg[aria-current="true"] small { color: var(--ink); }
.wg[aria-current="true"]::after { content: ""; position: absolute; bottom: 0; width: 18px; height: 3px; border-radius: 3px; background: var(--gc); }
.hint { font-size: 12px; color: var(--ink-3); text-align: center; margin: -4px 0 0; }

main { flex: 1; padding-block: 16px 140px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
main.chatpad { padding-bottom: 260px; }

/* chat */
.msg { display: flex; flex-direction: column; gap: 8px; min-width: 0; scroll-margin-top: 190px; }
.who { display: flex; align-items: center; gap: 10px; }
.who .av { width: 34px; height: 34px; font-size: 14px; }
.who b { font-size: 14.5px; }
.who em { font-style: normal; font-size: 12.5px; color: var(--ink-3); }
.bubble { background: var(--gs); border: 1px solid var(--line); border-radius: 4px 20px 20px 20px; padding: 13px 16px; text-wrap: pretty; }
.bubble p { margin: 0; } .bubble p + p { margin-top: 8px; }
.me { align-self: flex-end; max-width: 85%; background: var(--ink); color: var(--bg); border-radius: 20px 4px 20px 20px; padding: 10px 15px; }
.cards { display: flex; flex-direction: column; gap: 8px; }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card .k { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); padding-right: 44px; }
.card h3 { font-size: 17px; line-height: 1.25; padding-right: 44px; }
.card p { margin: 0; font-size: 14.5px; color: var(--ink-2); }
.card .ad { font-size: 13px; color: var(--ink-3); }
.card .heart { top: 8px; right: 8px; bottom: auto; box-shadow: none; background: var(--sunk); }
.steps { margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 8px; align-items: baseline; font-size: 14.5px; }
.steps li::before { content: counter(s); width: 22px; height: 22px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.steps li span { color: var(--ink-3); font-size: 13px; }
.tipcard { background: var(--sunk); border: 0; }
.tipcard p { color: var(--ink); }
.notes { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }
.note-star { color: var(--star); } .note-hist { color: var(--hist); } .note-muted { color: var(--ink-3); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); font-size: 14.5px; font-weight: 600; text-decoration: none; background: var(--surface); cursor: pointer; }
.btn.solid { background: var(--ink); color: var(--bg); border-color: transparent; }
.btn.g { background: var(--gc); color: var(--go); }
.btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.btn svg { fill: none; stroke: currentColor; }
.card .btn { align-self: flex-start; margin-top: 4px; min-height: 42px; font-size: 14px; }
.heart { position: absolute; right: 6px; bottom: 6px; width: 40px; height: 40px; border: 0; border-radius: 50%; cursor: pointer; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow); }
.heart svg, .btn.save svg { fill: none; stroke: var(--heart); }
.heart[aria-pressed="true"] svg, .btn.save[aria-pressed="true"] svg { fill: var(--heart); }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: linear-gradient(to top, var(--bg) 85%, transparent); padding-top: 18px; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.dock-in { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); cursor: pointer; min-height: 40px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: transparent; }
.chip.switch { border-style: dashed; color: var(--ink); font-weight: 600; }
.chip.pilot { background: var(--ink); color: var(--bg); border-color: transparent; font-weight: 700; }
.trust { margin: 2px 0 0; font-size: 13px; line-height: 1.45; color: var(--ink-2); }
.trust a { text-decoration: underline; }
.trust.rev, .pin-cap .rev { font-size: 12.5px; font-weight: 600; color: var(--ink-3); }
.tag.sp { align-self: flex-start; background: var(--sunk); color: var(--ink); }
.pilot-empty b { font-size: 17px; }
form { display: flex; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 5px 5px 16px; box-shadow: var(--shadow); }
form input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; min-height: 40px; }
form button { flex: none; border: 0; cursor: pointer; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--gc); color: var(--go); box-shadow: inset 0 0 0 1px var(--line); }
form button svg { fill: none; stroke: currentColor; }

nav.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(440px, calc(100% - 28px)); display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: var(--band); box-shadow: var(--shadow); z-index: 6; }
nav.tabs button { flex: 1; border: 0; cursor: pointer; min-height: 46px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 14px; font-weight: 700; background: transparent; color: var(--band-muted); }
nav.tabs button[aria-current="page"] { background: var(--bg); color: var(--ink); }
nav.tabs svg { fill: none; stroke: currentColor; }

/* explorar */
.pagehead h1 { font-size: 28px; line-height: 1.1; }
.pagehead p { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; }
.search { display: flex; align-items: center; gap: 10px; padding: 0 16px; min-height: 48px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.search svg { fill: none; stroke: var(--ink-3); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; }
.grid { column-count: 2; column-gap: 12px; }
.pin { display: inline-block; width: 100%; margin: 0 0 14px; break-inside: avoid; cursor: pointer; vertical-align: top; }
.pin-img { position: relative; border-radius: 20px; overflow: hidden; background: var(--sunk); display: flex; align-items: flex-end; padding: 12px; }
.pin-img .glyph { font-size: 42px; font-weight: 700; line-height: 1; color: var(--ink-3); opacity: .5; }
.pin-img .tag { position: absolute; left: 8px; top: 8px; }
.tag { display: inline-flex; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface); color: var(--ink-2); }
.pin-cap { padding: 8px 4px 0; display: flex; flex-direction: column; gap: 3px; }
.pin-cap b { font-size: 14.5px; line-height: 1.25; }
.pin-cap > span:not(.gs) { font-size: 12.5px; line-height: 1.35; color: var(--ink-3); }
.pin-cap .gs { display: flex; gap: 4px; margin-top: 2px; }
.pin-cap .gs .av { width: 20px; height: 20px; font-size: 10px; }
.pin-tip { position: relative; padding: 16px 16px 56px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); }
.pin-tip .k { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.pin-tip p { margin: 6px 0 0; font-size: 16px; line-height: 1.35; font-weight: 600; }
.empty-q { margin: 4px; color: var(--ink-2); }
.biz { padding: 20px; border-radius: 26px; background: var(--band); color: var(--band-ink); display: flex; flex-direction: column; gap: 10px; }
.biz .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.biz .kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--band-muted); }
.biz .tag { background: var(--band-ink); color: var(--band); }
.biz h2 { font-size: 21px; }
.biz p { margin: 0; font-size: 14.5px; color: var(--band-muted); }
.biz .btn { align-self: flex-start; background: var(--band-ink); color: var(--band); border-color: transparent; }

/* ficha */
.d-img { height: 170px; border-radius: 26px; background: var(--sunk); display: flex; align-items: flex-end; padding: 18px; }
.d-img .glyph { font-size: 64px; font-weight: 700; line-height: 1; color: var(--ink-3); opacity: .5; }
.d-body { display: flex; flex-direction: column; gap: 8px; }
.d-body .k { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.d-body h1 { font-size: 27px; line-height: 1.12; }
.d-body > p { margin: 0; font-size: 15.5px; color: var(--ink-2); text-wrap: pretty; }
.d-addr { font-size: 13.5px !important; color: var(--ink-3) !important; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.actions .btn.solid { flex: 1; }
.recby { display: flex; flex-direction: column; gap: 8px; }
.recby h3 { font-size: 16px; }
.recby .btn { justify-content: flex-start; width: 100%; }
.recby .btn .av { width: 26px; height: 26px; font-size: 12px; }
.facts { margin: 0; display: grid; gap: 8px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; }
.fact dt { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.fact dd { margin: 3px 0 0; }
.warn { margin: 0; padding: 12px 16px; border-radius: 16px; border: 1.5px dashed var(--star); color: var(--star); font-size: 13.5px; }
.rlink { all: unset; box-sizing: border-box; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 0 18px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; }
.rlink svg { fill: none; stroke: currentColor; flex: none; }
.list { display: flex; flex-direction: column; gap: 8px; }
.respect { margin: 0; font-size: 13px; color: var(--ink-3); }

/* para vos */
.emptybox { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 22px; border-radius: 26px; background: var(--surface); border: 1px solid var(--line); }
.emptybox b { font-size: 19px; }
.emptybox span { color: var(--ink-2); }
.plan { background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.plan .k { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.plan h2 { font-size: 22px; }
.plan > p { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.plan ol { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.plan li button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: 36px minmax(0,1fr); gap: 12px; align-items: center; }
.plan .num { width: 36px; height: 36px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; font-weight: 700; }
.plan li b { display: block; font-size: 15px; }
.plan li small { font-size: 12.5px; color: var(--ink-3); }
.plan .btn { width: 100%; }
.saved-h { font-size: 18px; margin-top: 8px; }

.foot { font-size: 11.5px; color: var(--ink-3); text-align: center; margin: 0; }
.linkbtn { border: 0; background: none; padding: 0; cursor: pointer; text-decoration: underline; color: var(--ink-3); font-size: 11.5px; }
dialog { border: 0; padding: 0; border-radius: 22px; width: min(480px, calc(100% - 32px)); max-height: 85vh; background: var(--bg); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
dialog::backdrop { background: rgba(0,0,0,.4); }
.dlg { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.dlg h2 { font-size: 20px; }
.dlg > p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.gcard { background: var(--gs); border-radius: 18px; padding: 14px 16px; display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 12px; }
.gcard .av { width: 44px; height: 44px; font-size: 17px; }
.gcard b { font-size: 16px; }
.gcard dl { margin: 4px 0 0; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 2px 10px; font-size: 13.5px; }
.gcard dt { color: var(--ink-3); } .gcard dd { margin: 0; }
.dlg .close { align-self: flex-end; }
@media (prefers-reduced-motion: no-preference) { .msg.new { animation: up .25s ease-out; } @keyframes up { from { transform: translateY(6px); opacity: .4; } } .pin:active { transform: scale(.98); } }
</style>
</head>
<body>
<div class="app">
  <header id="hdr">
    <div class="top">
      <button type="button" class="brand" data-tab="guia"><b>nAIhual</b><span id="tagline"></span></button>
      <div class="seg" role="group" aria-label="Idioma / Language">
        <button type="button" id="lang-es" data-lang="es">ES</button>
        <button type="button" id="lang-en" data-lang="en">EN</button>
      </div>
    </div>
    <div id="wheel-wrap"><div class="wheel" id="wheel" role="group"></div><p class="hint" id="hint"></p></div>
  </header>
  <main id="main" aria-live="polite"></main>
</div>
<div class="dock" id="dock">
  <div class="dock-in">
    <div class="chips" id="chips"></div>
    <form id="ask" autocomplete="off">
      <input id="q" type="text" maxlength="200">
      <button type="submit" id="send"><svg width="18" height="18" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
    </form>
  </div>
</div>
<nav class="tabs" aria-label="Secciones">
  <button type="button" id="tab-guia" data-tab="guia"></button>
  <button type="button" id="tab-feed" data-tab="feed"></button>
  <button type="button" id="tab-para" data-tab="para"></button>
</nav>
<dialog id="dlg"><div class="dlg" id="dlg-body"></div></dialog>

<!-- Catálogo de lugares: se edita en data/lugares.js, no aquí. -->
<script src="data/lugares.js"></script>
<script>
(function () {
'use strict';
var VERSION = 'App 1.1 piloto · 23-oct-2026';
var BIZ_WHATSAPP = ''; // Falta el número del fundador. Vacío = botón desactivado.
var PILOT_MAX = 3; // Recorrido «Quiero un café»: máximo de fichas.
function w(es, en) { return { es: es, en: en }; }

function cats(key) {

  bump(key, has ? -3 : 3); persist(); render(false);
}

}
function answer(text) {
  var t = norm(text), named = detectGuardian(t), intent = detectIntent(t);
  var wantsNext = !named && NEXT_RE.test(t);
  var target = named || (wantsNext ? ORDER[(ORDER.indexOf(S.guide) + 1) % ORDER.length] : null);
  if (target && target !== S.guide) {
    S.guide = target;
    var m0 = { from: target, intro: true, asked: true };
    if (intent && R[intent]) { m0.kind = 'r'; m0.intent = intent; }
    else if (intent === 'seguridad') m0.kind = 'safety';
    else if (intent && GAPS[intent]) { m0.kind = 'gap'; m0.gap = intent; }
    else m0.kind = 'takeover';
    S.msgs.push(m0); return;
  }
  var m = { from: S.guide };
  if (intent && R[intent]) { m.kind = 'r'; m.intent = intent; }
  else if (intent === 'seguridad') m.kind = 'safety';
  else if (intent && GAPS[intent]) { m.kind = 'gap'; m.gap = intent; }
  else m.kind = 'unknown';
  S.msgs.push(m);
}
function ask(text) {
  text = text.trim(); if (!text) return;
  S.msgs.push({ user: text });
  answer(text);
  render(true);
}

});
document.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.pin[data-open]')) { e.preventDefault(); open(e.target.getAttribute('data-open')); } });
document.addEventListener('input', function (e) { if (e.target.id === 'fq') { S.query = e.target.value; render(false); } });

function openDlg() {
  var t = STR[S.lang], L = S.lang;
  document.getElementById('dlg-body').innerHTML = '<h2>' + esc(t.dlgTitle) + '</h2><p>' + esc(t.dlgIntro) + '</p>' +
    ORDER.map(function (id) { var g = G[id]; return '<div class="gcard g-' + id + '"><span class="av">' + g.ini + '</span><div><b>' + esc(g.name) + '</b><dl>' +
      [[t.dValue, g.value[L] + ' *'], [t.dDir, g.dir[L] + ' *'], [t.dRole, g.role[L]], [t.dSpeaks, g.speaks[L]], [t.dRecs, g.recs[L]], [t.dPdf, g.pdf[L]]].map(function (r) { return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') +
      '</dl></div></div>'; }).join('') + '<p class="note-star" style="margin:0;font-size:12.5px">' + esc(t.dlgPending) + '</p><button type="button" class="btn solid close" data-close>' + esc(t.close) + '</button>';
  var d = document.getElementById('dlg'); if (d.showModal) d.showModal(); else d.setAttribute('open', '');
}

S.msgs.push({ from: ORDER[0], kind: 'welcome', intro: true });
render(false);
})();
</script>
